# The schedule backstop (cmd/backstop, .github/workflows/backstop.yml): for each
# entry, when no run of the workflow on its default branch started within the
# period (less a 10-minute slack, so an hourly backstop keeps an hourly cadence),
# backstop.yml dispatches it with these inputs. The repository's own schedule stays
# the primary trigger: once it fires, its runs make the backstop skip.
#
# swarm-routing/ns3-upstream-report: GitHub has fired no `schedule` event there since
# the repository was created (swarm-routing/ns3-upstream-report#33); `mode =
# "scheduled"` makes a dispatched run real (a manual dispatch is dry by default).

#
# swarm-routing/.github org-bot.yml (#748): GitHub fires few of this
# repository's schedules (7 of org-bot's 33 slots on 2026-11-21), and a pending
# scheduled refresh may be replaced by a push's. A row per scheduled task,
# found by its run-name (`org-bot <task> (schedule)`, cancelled runs not
# counted); `scheduled = "true"` makes the dispatch run as the schedule would.
# The hourly row's alarm keeps `[backstop] scheduled runs stalled` open while
# no scheduled hourly run completed for 2 hours (3 until 2026-11-24, when the
# backstop-tick made an hourly clock that does not depend on this repository's
# scheduler: maintainer decision on #748). backstop.yml runs on its own cron,
# when an org-bot run completes, and on each `backstop-tick` sent hourly by a
# few active repositories at their own minutes (the 2026-11-23 count found a
# 4 h 07 min gap while dispatch traffic was quiet and no cron fired).

[[entry]]
repo = "swarm-routing/.github"
workflow = "org-bot.yml"   # cron '23 * * * *'
title = "org-bot hourly (schedule)"
period = "1h"
alarm = "2h"
inputs = { task = "hourly", scheduled = "true" }

[[entry]]
repo = "swarm-routing/.github"
workflow = "org-bot.yml"   # cron '41 */3 * * *'
title = "org-bot swarm-core-pin (schedule)"
period = "3h"
inputs = { task = "swarm-core-pin", scheduled = "true" }

[[entry]]
repo = "swarm-routing/.github"
workflow = "org-bot.yml"   # cron '17 4 * * *'
title = "org-bot all (schedule)"
period = "24h"
inputs = { task = "all", scheduled = "true" }

# labels.yml: labels.json on every repository, daily, so a repository created
# since the last run gets the taxonomy within a day (swarm-routing/swarm-mcp
# had GitHub's 10 defaults). Any run on main counts: each one applies it.
[[entry]]
repo = "swarm-routing/.github"
workflow = "labels.yml"    # cron '29 5 * * *'
period = "24h"

[[entry]]
repo = "swarm-routing/ns3-upstream-report"
workflow = "send.yml"      # cron '23 * * * *'
period = "1h"
inputs = { mode = "scheduled" }

[[entry]]
repo = "swarm-routing/ns3-upstream-report"
workflow = "read.yml"      # cron '41 */6 * * *'
period = "6h"
inputs = { mode = "scheduled" }

[[entry]]
repo = "swarm-routing/ns3-upstream-report"
workflow = "maintain.yml"  # cron '13 7 * * *'
period = "24h"
inputs = { mode = "scheduled" }

[[entry]]
repo = "swarm-routing/ns3-upstream-report"
workflow = "rotate.yml"    # cron '29 4 * * 3'
period = "168h"
inputs = { mode = "scheduled" }
