name: Reusable ns-3 CI

# One CI for every swarm-routing contrib module. Builds the caller's module(s)
# inside ghcr.io/swarm-routing/ns3-dev:<version>-<profile> (a warm ns-3 tree,
# so only the module compiles), runs their test.py suites and optional smoke
# programs, checks formatting, and checks licence headers against
# AntHocNet's per-directory rules (ADR-0028): `core/` and the tooling are
# `MIT OR GPL-2.0-only`, ns-3 modules and everything else `GPL-2.0-only`.
#
# Caller (e.g. swarm-routing/ARA/.github/workflows/ci.yml):
#
#   on:
#     push: { branches: [main] }
#     pull_request: {}
#     workflow_dispatch:
#       inputs:
#         ns3-versions:   # on demand only: older ns-3 releases, e.g. ["3.42"]
#           default: ''
#   permissions: { contents: read, packages: read }
#   jobs:
#     ci:
#       uses: swarm-routing/.github/.github/workflows/reusable-ns3-ci.yml@main
#       with:
#         modules: ara=ns3
#         dependencies: swarm-core=swarm-routing/ns3-swarm-core@main
#         run: ara-example --seed=1
#         ns3-versions: ${{ inputs.ns3-versions || '["latest"]' }}
#
# `ns3-versions` defaults to ["latest"]: the release ns-3 supports (it maintains its
# latest only), via the `latest-<profile>` tags, so automatic CI follows ns-3
# with no edit (CONTRIBUTING invariant 7). Older releases are on demand: their
# images are history in ns3-containers, or built there on request.
#
# Quality gates (all default off, so existing callers see no change; rule 10):
#   strict-warnings  -Wall -Wextra -Wpedantic -Wshadow ... -Werror on this repo's
#                    modules only; ns-3's headers are -isystem (#28)
#   coverage         gcov on this repo's modules on the debug leg of the first
#                    version; gcovr table in the job log and summary, Cobertura
#                    XML + HTML as an artifact; report-only, no threshold (#24)
#   determinism      programs with a `{seed}` placeholder: their stdout (where
#                    the marker lines go) for seed 1 twice must be byte-identical,
#                    for seed 2 it must differ (org invariant 5, #26). stderr
#                    (logging, sanitizer summaries) is not compared. A program
#                    that prints its seed passes determinism-normalize (a sed -E
#                    script) to strip it before the cross-seed comparison, else
#                    the label alone would make the outputs differ
#   sonar            SonarQube Cloud CI-based analysis of this repo's modules on the
#                    coverage leg (implies coverage): the compile database of this
#                    repo's files (ns-3's own entries dropped) at
#                    build/compile_commands.json and gcovr's SonarQube report at
#                    coverage-sonar.xml, both in the checkout, then
#                    sonarqube-scan-action with the repo's sonar-project.properties.
#                    Pass `secrets: { SONAR_TOKEN: ... }`. Skipped with a notice when
#                    the token is absent (fork PRs) and with a warning while the
#                    project still has Automatic Analysis on in SonarQube Cloud
# Codecov: a caller adds a job `needs: <this job>` that calls
# reusable-codecov.yml with `permissions: { contents: read, id-token: write }`;
# it uploads the `coverage` artifact this workflow keeps (coverage.xml).
# strict-warnings and coverage need an image whose ns3-build-contrib has the
# options (swarm-routing/ns3-containers; the step fails clearly otherwise).
#
# Module specs are `name=path` (path relative to the caller's checkout) or a
# bare path whose basename is the module name. The name must equal the
# module's build_lib(LIBNAME ...). Dependencies are checked out and linked
# first, in order.
on:
  workflow_call:
    inputs:
      modules:
        description: "Space-separated module specs from this repo: `name=path` or `path`"
        type: string
        required: true
      dependencies:
        description: "Newline-separated `name=owner/repo@ref[:subdir]` modules to build first"
        type: string
        default: ''
      ns3-versions:
        description: "JSON list of ns-3 versions (image tags); `latest` = the release ns-3 supports"
        type: string
        default: '["latest"]'
      profiles:
        description: "JSON list of image profiles: debug, sanitized, optimized"
        type: string
        default: '["debug", "sanitized"]'
      test-suites:
        description: "Space-separated test.py suites; default: one per module of this repo"
        type: string
        default: ''
      extra-modules:
        description: "Extra stock ns-3 modules, `a;b` (outside the image list they compile in the job)"
        type: string
        default: ''
      run:
        description: "Newline-separated `./ns3 run` programs (with args) as smoke tests"
        type: string
        default: ''
      lsan-suppressions:
        description: "Path (in this repo) of an LSan suppressions file for the sanitized leg"
        type: string
        default: ''
      strict-warnings:
        description: "Compile this repo's modules with strict warnings as errors (ns-3 headers exempt)"
        type: boolean
        default: false
      coverage:
        description: "Report gcov line/branch coverage of this repo's modules (debug leg of the first version; report-only)"
        type: boolean
        default: false
      coverage-exclude:
        description: "gcovr --exclude regex for source paths, relative to the repo root"
        type: string
        default: '(.*/)?(test|examples)/'
      sonar:
        description: "SonarQube Cloud CI analysis on the coverage leg (implies coverage); needs secret SONAR_TOKEN and the repo's sonar-project.properties"
        type: boolean
        default: false
      determinism:
        description: "Newline-separated `./ns3 run` programs with a `{seed}` placeholder that print their results (marker lines) on stdout; stdout of seed 1 twice must match byte for byte, seed 2 must differ"
        type: string
        default: ''
      determinism-normalize:
        description: "sed -E script applied to each output before the seed-1-vs-seed-2 comparison only, to drop fields that print the seed itself (e.g. 's/firstRun=[0-9]+//'); the seed-1 repeat is always compared raw"
        type: string
        default: ''
      format:
        description: "Run the clang-format-18 check"
        type: boolean
        default: true
      header-exclude:
        description: "Extended regex of paths exempt from the licence-header check (vendored code)"
        type: string
        default: ''
      dual-roots:
        description: "Space-separated `MIT OR GPL-2.0-only` roots (AntHocNet ADR-0028); everything else is GPL-2.0-only"
        type: string
        default: 'core/ tools/'
      core-roots:
        description: "Space-separated simulator-free roots whose C++ may include only std headers and their own files"
        type: string
        default: 'core/'
      gpl-only:
        description: "Space-separated files under a dual root that stay GPL-2.0-only"
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        description: "SonarQube Cloud token for the `sonar` input; absent (fork PRs): the analysis is skipped"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ns-${{ matrix.version }} ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.ns3-versions) }}
        profile: ${{ fromJSON(inputs.profiles) }}
    container:
      image: ghcr.io/swarm-routing/ns3-dev:${{ matrix.version }}-${{ matrix.profile }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        # A container job's default shell is `sh`, which has no `pipefail`.
        shell: bash
    env:
      # Sanitized leg: fail on the first report; leaks are reported at exit.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
          # SonarQube Cloud reads the history (blame, new code); the rest needs none
          fetch-depth: ${{ inputs.sonar && '0' || '1' }}
      - name: Check out dependencies
        if: inputs.dependencies != ''
        env:
          DEPS: ${{ inputs.dependencies }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/dep-specs"
          while read -r line; do
            [ -n "$line" ] || continue
            name=${line%%=*}; rest=${line#*=}
            repo=${rest%%@*}; ref=${rest#*@}
            sub=""; case "$ref" in *:*) sub=${ref#*:}; ref=${ref%%:*} ;; esac
            dest="$GITHUB_WORKSPACE/deps/$name"
            git clone --quiet --depth 1 --branch "$ref" \
              "https://x-access-token:${TOKEN}@github.com/${repo}.git" "$dest"
            echo "$name=$dest${sub:+/$sub}" >> "$RUNNER_TEMP/dep-specs"
            echo "dependency $name: $repo@$ref ($(git -C "$dest" rev-parse --short HEAD))"
          done <<< "$DEPS"
      - name: Build + test
        env:
          MODULES: ${{ inputs.modules }}
          SUITES: ${{ inputs.test-suites }}
          EXTRA: ${{ inputs.extra-modules }}
          RUNS: ${{ inputs.run }}
          LSAN_SUPP: ${{ inputs.lsan-suppressions }}
          STRICT: ${{ inputs.strict-warnings }}
          COVERAGE: ${{ (inputs.coverage || inputs.sonar) && matrix.profile == 'debug' && matrix.version == fromJSON(inputs.ns3-versions)[0] }}
        run: |
          set -euo pipefail
          args=()
          for opt in strict:--strict-warnings coverage:--coverage; do
            want=${opt%%:*}; flag=${opt#*:}
            if { [ "$want" = strict ] && [ "$STRICT" = true ]; } || { [ "$want" = coverage ] && [ "$COVERAGE" = true ]; }; then
              ns3-build-contrib --help | grep -q -- "$flag" || {
                echo "::error::this image's ns3-build-contrib has no $flag (needs a current swarm-routing/ns3-containers image)"; exit 1; }
              args+=("$flag")
            fi
          done
          [ -f "$RUNNER_TEMP/dep-specs" ] && while read -r d; do args+=("$d"); done < "$RUNNER_TEMP/dep-specs"
          own=()
          for m in $MODULES; do
            case "$m" in
              *=*) own+=("${m%%=*}"); args+=("${m%%=*}=$GITHUB_WORKSPACE/src/${m#*=}") ;;
              *)   own+=("$(basename "$m")"); args+=("$GITHUB_WORKSPACE/src/$m") ;;
            esac
          done
          # Judge this repo's modules only, not dependencies built alongside;
          # images that predate --quality-modules apply the options to all.
          if { [ "$STRICT" = true ] || [ "$COVERAGE" = true ]; } \
             && [[ $(ns3-build-contrib --help) == *--quality-modules* ]]; then
            args+=(--quality-modules "$(IFS=';'; echo "${own[*]}")")
          fi
          [ -n "$EXTRA" ] && args+=(--modules "$EXTRA")
          for s in ${SUITES:-${own[*]}}; do args+=(--suite "$s"); done
          while read -r r; do [ -n "$r" ] && args+=(--run "$r"); done <<< "$RUNS"
          if [ -n "$LSAN_SUPP" ]; then
            export LSAN_OPTIONS="suppressions=$GITHUB_WORKSPACE/src/$LSAN_SUPP:print_suppressions=0"
          fi
          ns3-build-contrib "${args[@]}"
      - name: Determinism (same seed byte-identical, another seed differs)
        if: inputs.determinism != ''
        env:
          PROGS: ${{ inputs.determinism }}
          NORMALIZE: ${{ inputs.determinism-normalize }}
        run: |
          set -euo pipefail
          cd /opt/ns-3
          out="$RUNNER_TEMP/determinism"; mkdir -p "$out"
          norm() { if [ -n "$NORMALIZE" ]; then sed -E "$NORMALIZE" "$1"; else cat "$1"; fi; }
          n=0; fails=0
          while read -r p; do
            [ -n "$p" ] || continue
            case "$p" in *'{seed}'*) ;; *) echo "::error::determinism program has no {seed} placeholder: $p"; exit 1 ;; esac
            n=$((n + 1))
            for run in 1a 1b 2; do
              seed=${run%[ab]}
              ./ns3 run --no-build "${p//\{seed\}/$seed}" > "$out/$n-$run.txt"
            done
            # Into files, so a broken normalize script stops the step (set -e)
            # instead of comparing two empty streams.
            norm "$out/$n-1a.txt" > "$out/$n-1a.norm"
            norm "$out/$n-2.txt" > "$out/$n-2.norm"
            if ! cmp -s "$out/$n-1a.txt" "$out/$n-1b.txt"; then
              echo "::error::not deterministic: two runs with seed 1 differ: $p"
              diff "$out/$n-1a.txt" "$out/$n-1b.txt" | head -20 || true
              fails=$((fails + 1))
            elif cmp -s "$out/$n-1a.norm" "$out/$n-2.norm"; then
              echo "::error::seed ignored: seeds 1 and 2 give identical results: $p"
              fails=$((fails + 1))
            else
              echo "ok: $p ($(wc -l < "$out/$n-1a.txt") lines, identical for seed 1, different for seed 2)"
            fi
          done <<< "$PROGS"
          [ "$fails" = 0 ]
      - name: Coverage report (gcovr; report-only)
        if: (inputs.coverage || inputs.sonar) && matrix.profile == 'debug' && matrix.version == fromJSON(inputs.ns3-versions)[0]
        env:
          EXCLUDE: ${{ inputs.coverage-exclude }}
          SONAR: ${{ inputs.sonar }}
        run: |
          set -euo pipefail
          if ! command -v gcovr > /dev/null; then
            timeout 600 apt-get update -qq
            timeout 600 apt-get install -y -qq --no-install-recommends gcovr > /dev/null
          fi
          src="$GITHUB_WORKSPACE/src"
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          cd /opt/ns-3/cmake-cache
          sonar_args=()
          if [ "$SONAR" = true ]; then sonar_args=(--sonarqube "$src/coverage-sonar.xml"); fi
          gcovr --root "$src" --filter "$src/" --exclude "$src/$EXCLUDE" "${sonar_args[@]}" \
            --txt --cobertura "$GITHUB_WORKSPACE/coverage/coverage.xml" \
            --html-details "$GITHUB_WORKSPACE/coverage/index.html" --print-summary . \
            | tee "$GITHUB_WORKSPACE/coverage/summary.txt"
          { echo '### Coverage (report-only)'; echo '```'; cat "$GITHUB_WORKSPACE/coverage/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: SonarQube Cloud — token, analysis method, compile database
        id: sonar
        if: inputs.sonar && matrix.profile == 'debug' && matrix.version == fromJSON(inputs.ns3-versions)[0]
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/src"
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SonarQube Cloud analysis skipped: no SONAR_TOKEN (a fork's pull request, or the caller passed none)"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -f "$src/sonar-project.properties" ]; then
            echo "::error::sonar: true needs sonar-project.properties in the repository (org-sync seeds it)"; exit 1
          fi
          key=$(sed -n 's/^sonar\.projectKey=//p' "$src/sonar-project.properties")
          # Automatic Analysis and CI analysis exclude each other: the scanner
          # fails while the project is on Automatic Analysis, so skip, loudly.
          auto=$(python3 -I - "$key" <<'PY'
          import json, sys, urllib.request
          url = "https://sonarcloud.io/api/navigation/component?component=" + sys.argv[1]
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  print(str(json.load(r).get("autoscanEnabled", False)).lower())
          except OSError as e:
              print("error:", e)
          PY
          )
          if [ "$auto" != false ]; then
            echo "::warning::SonarQube Cloud analysis skipped for $key: ${auto/true/Automatic Analysis is on}. Switch the project to CI-based analysis (SonarQube Cloud: Administration > Analysis Method) so CI imports coverage"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The compile database of this repository's files only: contrib/<module>
          # links to the checkout, so a realpath inside it is ours; ns-3's own
          # and the dependencies' entries are dropped.
          mkdir -p "$src/build"
          python3 -I - "$src" /opt/ns-3/cmake-cache/compile_commands.json "$src/build/compile_commands.json" <<'PY'
          import json, os, sys
          src, db, out = os.path.realpath(sys.argv[1]), sys.argv[2], sys.argv[3]
          keep = []
          for e in json.load(open(db)):
              f = os.path.realpath(os.path.join(e["directory"], e["file"]))
              if f.startswith(src + os.sep):
                  keep.append({**e, "file": f})
          if not keep:
              sys.exit("sonar: no compile command of this repository in " + db)
          json.dump(keep, open(out, "w"), indent=1)
          print(f"sonar: {len(keep)} compile commands of this repository")
          PY
          for tool in unzip curl; do
            command -v "$tool" > /dev/null || {
              timeout 600 apt-get update -qq
              timeout 600 apt-get install -y -qq --no-install-recommends unzip curl > /dev/null
              break; }
          done
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud analysis
        if: steps.sonar.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          projectBaseDir: src
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: (inputs.coverage || inputs.sonar) && matrix.profile == 'debug' && matrix.version == fromJSON(inputs.ns3-versions)[0]
        with:
          name: coverage
          path: coverage
          retention-days: 7
      - name: Keep test.py output on failure
        if: failure()
        run: cp -r /opt/ns-3/testpy-output "$GITHUB_WORKSPACE/testpy-output" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: testpy-output-${{ matrix.version }}-${{ matrix.profile }}
          path: testpy-output
          retention-days: 3
          if-no-files-found: ignore

  format:
    if: inputs.format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Org .clang-format unless the repo ships its own
        run: |
          [ -f .clang-format ] || curl -fsSL -o .clang-format \
            https://raw.githubusercontent.com/swarm-routing/.github/main/.clang-format
      - name: clang-format-18 --dry-run -Werror
        run: |
          files=$(git ls-files '*.h' '*.cc' '*.cpp' '*.hpp')
          [ -z "$files" ] && { echo "no C++ files"; exit 0; }
          # shellcheck disable=SC2086
          clang-format-18 --dry-run -Werror $files

  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@main
    with:
      dual-roots: ${{ inputs.dual-roots }}
      core-roots: ${{ inputs.core-roots }}
      gpl-only: ${{ inputs.gpl-only }}
      exclude: ${{ inputs.header-exclude }}
