name: epics

# Are the epic lists still what the issues say? Every public repository's
# README `## Epics` section, ROADMAP.md#epics and the profile's open epics are
# generated by tools/epics/epics.py (CONTRIBUTING, "Epics are the public
# plan"). Weekly, and on demand, this compares each one with the issues; on
# drift it opens, or comments on, one issue here and the run fails, so the
# next contributor (or agent) re-runs the script. Pull requests that change
# the script run its self-test and a fetch only: drift is not their fault.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/epics/**'
      - '.github/workflows/epics.yml'

permissions:
  contents: read

concurrency:
  group: epics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test
        run: python3 -I tools/epics/epics.py --self-test
      - name: Fetch the epics of every public repository
        run: python3 tools/epics/epics.py fetch --out "$RUNNER_TEMP/epics.json"
      - name: Compare every list with the issues
        if: github.event_name != 'pull_request'
        run: |
          data="$RUNNER_TEMP/epics.json"
          report="$RUNNER_TEMP/report.txt"
          rc=0
          {
            python3 tools/epics/epics.py roadmap ROADMAP.md --check --data "$data" || rc=1
            python3 tools/epics/epics.py profile profile/README.md --check --data "$data" || rc=1
            python3 tools/epics/epics.py check-all --data "$data" || rc=1
          } > "$report"
          cat "$report"
          [ "$rc" = 0 ] && exit 0
          title='[epics] epic lists are stale'
          body="$RUNNER_TEMP/body.md"
          {
            echo "The weekly \`epics\` run ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) found lists that no longer match the issues:"
            echo
            printf '%s\n' '```'
            grep -v ': up to date$' "$report"
            printf '%s\n' '```'
            echo
            cat <<'EOF'
          Refresh each one with `tools/epics/epics.py` (CONTRIBUTING, "Epics are the public plan"): `epics.py readme .` in each listed repository, `epics.py roadmap ROADMAP.md` and `epics.py profile profile/README.md` here, one PR per repository.
          EOF
          } > "$body"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body" \
              --label documentation --label packaging --label model:haiku-5.5 --label priority:P3
          fi
          exit 1
