name: bestpractices

# Do the org's OpenSSF Best Practices entries (bestpractices.dev) still match
# the repositories? Weekly, and on demand, the Go tool `bestpractices check`
# (cmd/bestpractices, run from the ci-tools image by digest, #531) reads each
# registered project's public JSON (no login, one request a second, never a
# POST) for every public repository, found by `bestpractices_project` in its
# .github/org-sync.toml or by its URL on the site, and keeps one issue per
# repository, `[bestpractices] N finding(s)` (label chore): for a registered
# project, the findings (answers in .bestpractices.json the site lacks or
# contradicts, justification URLs at files no longer on main, a lost level, a
# missing key) with the proposal link(s) to "open, review, Save" and the
# owner-only criteria still `?`; for a public repository not registered (and
# not opted out with `bestpractices = false` under [settings]), the
# registration steps. Updated in place, closed when the site matches. The site
# has no write API: the maintainer's Save is the one step left (CONTRIBUTING
# "OpenSSF Best Practices"). Report-only: never a required check. Drift is
# reported in the issues and the step summary, not in the run's status: with
# --issues the tool exits 0 on drift and 2 only when the run failed (a read,
# an alert listing or an issue write), so a red run is a real failure (#611).
#
# Token: the org bot's, from .github/actions/bot-token as ai-files-review.yml
# uses it (the GitHub App's installation token, else ORG_BOT_TOKEN), for
# Issues: read and write on every repository. Without one, or with dry-run,
# no issue is written. The token never runs on code from a pull request: a pull
# request that changes this workflow runs the image's tool read-only, with the
# workflow's own token, on one repository. The tool's tests run in
# ci-tools-image.yml.
on:
  schedule:
    - cron: '37 7 * * 3'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated NAME or NAME=ID (default: every public repo, looked up)'
        type: string
        default: ''
      dry-run:
        description: 'Report only; open, update or close no issue'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/bestpractices.yml'

permissions:
  contents: read

concurrency:
  group: bestpractices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REPOS: ${{ inputs.repos }}
      DRY_RUN: ${{ inputs.dry-run }}
      # the ci-tools image by digest (docs/adr/0002-pipelines-are-go.md)
      IMG: ghcr.io/swarm-routing/ci-tools@sha256:5b8871db312aa437420362a530be522d1ad611425db015ecfe4e198fb293ff72  # promoted from 26e9061 (#729: critical and high counts)
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The ci-tools image (pulled with retries, #645)
        uses: ./.github/actions/pull-ci-tools
        timeout-minutes: 3  # about 15 MB, and up to 90 s of retries
        with:
          image: ${{ env.IMG }}
      - name: The tool runs (pull request, read-only, no issues)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          rc=0
          docker run --rm -e GH_TOKEN "$IMG" bestpractices check --repos AntHocNet || rc=$?
          [ "$rc" -le 1 ] || { echo "::error::bestpractices check: exit $rc (unreadable)"; exit 1; }
      - name: Bot token
        if: github.event_name != 'pull_request'
        id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Check every registered project
        if: github.event_name != 'pull_request'
        env:
          BESTPRACTICES_TOKEN: ${{ steps.bot.outputs.token }}
          # reads (the org listing, config files, trees) work with the workflow's own token
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
        run: |
          set -o pipefail
          args=(check --issues)
          [ -n "$REPOS" ] && args+=(--repos "$REPOS")
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ -z "$BESTPRACTICES_TOKEN" ] && echo "::warning::no bot token (neither the App secrets nor ORG_BOT_TOKEN): no issue is written"
          docker run --rm -e GH_TOKEN -e BESTPRACTICES_TOKEN -e GITHUB_RUN_ID -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL \
            "$IMG" bestpractices "${args[@]}" | tee "$RUNNER_TEMP/check.txt"
      - name: Summary
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: |
          {
            echo "### bestpractices"
            echo
            printf '%s\n' '```'
            cat "$RUNNER_TEMP/check.txt" 2>/dev/null || echo "(no output)"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
