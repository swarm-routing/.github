name: ns-3 CI self-test

# Proves reusable-ns3-ci.yml from this checkout (so a PR that changes it is
# tested with its own version) on tools/checks/fixtures/ns3-ci/protocol-hello,
# a protocol module on swarm-core and routing-bench (sim-containers'
# test/fixtures/protocol-hello), with its dependencies at the releases
# ns3-protocol-dev holds today:
#
#   ns3-dev        protocol-image left at its default: the build every caller
#                  has today, both dependencies built from source
#   protocol       protocol-image: true, debug and sanitized, strict warnings:
#                  both dependencies are the image's prebuilt modules (the
#                  log and summary say "prebuilt in the image")
#   mismatch       protocol-image: true with routing-bench one release behind
#                  the image: built from source over the prebuilt module
#                  (a notice says so), and the leg still passes
#
# The three calls run one after another: they share the reusable workflow's
# concurrency group (same modules, version and profile), which cancels a
# running leg on a pull request. When swarm-core or sim-tools releases and
# ns3-protocol-dev moves past these pins, the `protocol` call builds from
# source as `mismatch` does (still green); bump the pins with it.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reusable-ns3-ci.yml', '.github/workflows/ns3-ci-selftest.yml', 'tools/checks/fixtures/ns3-ci/**']
  pull_request:
    paths: ['.github/workflows/reusable-ns3-ci.yml', '.github/workflows/ns3-ci-selftest.yml', 'tools/checks/fixtures/ns3-ci/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ns3-dev:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-ns3-ci.yml
    with:
      modules: protocol-hello=tools/checks/fixtures/ns3-ci/protocol-hello
      dependencies: |
        swarm-core=swarm-routing/swarm-adapter-ns3@v2.0.0
        routing-bench=swarm-routing/sim-tools@v1.1.4:ns3/routing-bench
      profiles: '["debug"]'
      format: false
      # this repository is tooling (ci.yml: all dual), the fixture an ns-3 module
      dual-roots: '.'
      gpl-only: >-
        tools/checks/fixtures/ns3-ci/protocol-hello/model/protocol-hello.h
        tools/checks/fixtures/ns3-ci/protocol-hello/model/protocol-hello.cc
        tools/checks/fixtures/ns3-ci/protocol-hello/test/protocol-hello-test-suite.cc
      header-exclude: '^(\.claude|\.devcontainer)/'

  protocol:
    needs: ns3-dev
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-ns3-ci.yml
    with:
      modules: protocol-hello=tools/checks/fixtures/ns3-ci/protocol-hello
      dependencies: |
        swarm-core=swarm-routing/swarm-adapter-ns3@v2.0.0
        routing-bench=swarm-routing/sim-tools@v1.1.4:ns3/routing-bench
      protocol-image: true
      strict-warnings: true
      format: false
      dual-roots: '.'
      gpl-only: >-
        tools/checks/fixtures/ns3-ci/protocol-hello/model/protocol-hello.h
        tools/checks/fixtures/ns3-ci/protocol-hello/model/protocol-hello.cc
        tools/checks/fixtures/ns3-ci/protocol-hello/test/protocol-hello-test-suite.cc
      header-exclude: '^(\.claude|\.devcontainer)/'

  mismatch:
    needs: protocol
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-ns3-ci.yml
    with:
      modules: protocol-hello=tools/checks/fixtures/ns3-ci/protocol-hello
      dependencies: |
        swarm-core=swarm-routing/swarm-adapter-ns3@v2.0.0
        routing-bench=swarm-routing/sim-tools@v1.1.3:ns3/routing-bench
      protocol-image: true
      profiles: '["debug"]'
      format: false
      dual-roots: '.'
      gpl-only: >-
        tools/checks/fixtures/ns3-ci/protocol-hello/model/protocol-hello.h
        tools/checks/fixtures/ns3-ci/protocol-hello/model/protocol-hello.cc
        tools/checks/fixtures/ns3-ci/protocol-hello/test/protocol-hello-test-suite.cc
      header-exclude: '^(\.claude|\.devcontainer)/'
