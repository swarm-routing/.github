name: Reusable Codecov upload

# Uploads a coverage report another job of the same run kept as an artifact
# (reusable-ns3-ci.yml keeps `coverage`, with coverage.xml) to Codecov. A
# workflow of its own because the upload authenticates with GitHub OIDC (the
# org's choice: no Codecov token is stored anywhere), which needs
# `id-token: write`; a caller must grant it, and asking for it inside
# reusable-ns3-ci.yml would fail every caller that does not (rule 10).
#
# Caller (after its reusable-ns3-ci.yml job `ci`, with `coverage: true`):
#
#   codecov:
#     needs: ci
#     permissions: { contents: read, id-token: write }
#     uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@main
#
# A failed upload (Codecov down; a fork's pull request, which gets no OIDC
# token) never fails CI: coverage stays report-only (swarm-routing/.github#24).
on:
  workflow_call:
    inputs:
      artifact:
        description: "Name of the artifact holding the report"
        type: string
        default: coverage
      files:
        description: "Report path(s) inside the artifact, comma-separated"
        type: string
        default: coverage.xml
      flags:
        description: "Codecov flags for this upload (e.g. ns3, python)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/coverage
      - name: Report paths
        id: prep
        env:
          FILES: ${{ inputs.files }}
          DIR: ${{ runner.temp }}/coverage
        run: |
          set -euo pipefail
          out=()
          IFS=, read -ra fs <<< "$FILES"
          for f in "${fs[@]}"; do out+=("$DIR/$f"); done
          echo "files=$(IFS=,; echo "${out[*]}")" >> "$GITHUB_OUTPUT"
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.prep.outputs.files }}
          disable_search: true
          flags: ${{ inputs.flags }}
          use_oidc: true
          fail_ci_if_error: false
