name: Reusable Python lint and coverage

# Lint and coverage for the org's Python (sim-tools' readers, tooling):
#   ruff check (+ ruff format --check)   lint, fails on a finding (#25)
#   coverage.py over the self-tests      line + branch coverage, report-only:
#                                        no threshold (AntHocNet #162, #24)
# A repo without its own ruff config gets the org's ruff.toml (explicit rule
# list, so a ruff upgrade never widens it silently).
# The tests are plain scripts (stdlib, no pytest dependency): each runs under
# `coverage run`, and a non-zero exit fails the job as it does without coverage.
# Child Python processes are measured too (coverage.py `patch = subprocess`,
# #480): a test that runs a tool as `python3 tool.py` counts the tool's lines.
# A repo's own coverage config (.coveragerc, [coverage:*] in setup.cfg or
# tox.ini, [tool.coverage.*] in pyproject.toml) wins and is used as it is;
# `measure-subprocesses: false` turns the default off.
#
# Caller:
#
#   jobs:
#     quality:
#       uses: swarm-routing/.github/.github/workflows/reusable-python-ci.yml@main
#       with:
#         paths: python
#         tests: python/tests/test_*.py
#         source: python/ns3_tool
on:
  workflow_call:
    inputs:
      paths:
        description: "Space-separated paths ruff checks"
        type: string
        required: true
      ruff-format:
        description: "Also require `ruff format --check`"
        type: boolean
        default: true
      tests:
        description: "Space-separated test script globs, each run as `coverage run <script>`; empty skips coverage"
        type: string
        default: ''
      source:
        description: "Space- or comma-separated packages/directories whose coverage is reported (every item is measured)"
        type: string
        default: ''
      python-version:
        type: string
        default: '3.13'
      measure-subprocesses:
        description: "Measure child Python processes the tests start (coverage.py patch = subprocess); ignored when the repo has its own coverage config"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer push to the same pull request cancels this job (#505); pushes,
    # merge groups and dispatches each get their own group, never cancelled.
    # inputs.paths and inputs.tests keep two calls in one caller workflow apart.
    concurrency:
      group: python-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-${{ inputs.paths }}-${{ inputs.tests }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Tool versions (swarm-routing/.github tools/versions.env, #647)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # this repository's own file, so a pull request here tests the versions it
          # sets; every caller reads main's, as `make doctor` does. A caller reads it
          # and the python-ci.txt lock (next step) at one commit of main, resolved
          # once, so a version bump merging in between cannot split them (#716)
          src="$GITHUB_WORKSPACE/tools/versions.env"
          req="$GITHUB_WORKSPACE/tools/requirements/python-ci.txt"
          if [ "$GITHUB_REPOSITORY" != swarm-routing/.github ] || [ ! -f "$src" ] || [ ! -f "$req" ]; then
            sha=$(git ls-remote https://github.com/swarm-routing/.github refs/heads/main | cut -f1)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve swarm-routing/.github main"; exit 1; }
            src="$RUNNER_TEMP/versions.env"
            req="$RUNNER_TEMP/python-ci.txt"
            raw="https://raw.githubusercontent.com/swarm-routing/.github/$sha"
            curl --proto =https --tlsv1.2 -fsSL --retry 3 -o "$src" "$raw/tools/versions.env"
            curl --proto =https --tlsv1.2 -fsSL --retry 3 -o "$req" "$raw/tools/requirements/python-ci.txt"
          fi
          echo "PYTHON_CI_LOCK=$req" >> "$GITHUB_ENV"
          # only KEY=VALUE lines reach the environment; anything else fails the job
          if grep -vE '^(#.*|[A-Z][A-Z0-9_]*=[A-Za-z0-9._-]+)?$' "$src"; then
            echo "::error::tools/versions.env has a line that is not KEY=VALUE"; exit 1
          fi
          grep -E '^[A-Z][A-Z0-9_]*=' "$src" | tee -a "$GITHUB_ENV"
      - name: Install ruff and coverage (pinned by hash)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # the hash-pinned lock of tools/requirements/python-ci.in (OpenSSF Scorecard
          # Pinned-Dependencies, #716), read with versions.env in the step above
          req="$PYTHON_CI_LOCK"
          # versions.env stays the one source of the versions: the lock must pin the same
          for pin in "ruff==$RUFF_VERSION" "coverage==$COVERAGE_VERSION"; do
            if ! grep -qxF "$pin \\" "$req"; then
              echo "::error::tools/requirements/python-ci.txt does not pin $pin (tools/versions.env); regenerate it"; exit 1
            fi
          done
          python3 -m pip install --quiet --only-binary :all: --require-hashes -r "$req"
      - name: Org ruff.toml unless the repo has its own ruff config
        run: |
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || grep -qs '^\[tool\.ruff' pyproject.toml; then
            echo "using the repo's own ruff config"
          else
            curl --proto =https --tlsv1.2 -fsSL -o ruff.toml https://raw.githubusercontent.com/swarm-routing/.github/main/ruff.toml
          fi
      - name: ruff check
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          # shellcheck disable=SC2086  # PATHS word-splits on purpose
          ruff check --output-format=github $PATHS
      - name: ruff format --check
        if: inputs.ruff-format
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          # shellcheck disable=SC2086
          ruff format --check --diff $PATHS
      - name: Self-tests under coverage (report-only)
        if: inputs.tests != ''
        env:
          TESTS: ${{ inputs.tests }}
          SOURCE: ${{ inputs.source }}
          SUBPROCESSES: ${{ inputs.measure-subprocesses }}
        run: |
          set -euo pipefail
          src=()
          # coverage.py keeps only the last of several --source options, so the
          # items (space- or comma-separated) go in as one comma list (#530)
          sources=$(printf '%s' "$SOURCE" | tr -s ' ,\t\n' ',' | sed 's/^,//; s/,$//')
          [ -z "$sources" ] || src+=(--source "$sources")
          if [ -f .coveragerc ] || grep -qs '^\[coverage:' setup.cfg tox.ini \
            || grep -qs '^\[tool\.coverage' pyproject.toml; then
            echo "using the repo's own coverage config"
          elif [ "$SUBPROCESSES" = true ]; then
            # child processes too (#480); coverage.py writes their data beside the parent's
            printf '[run]\npatch = subprocess\n' > "$RUNNER_TEMP/coveragerc"
            src+=(--rcfile "$RUNNER_TEMP/coveragerc")
            echo "measuring child Python processes (patch = subprocess)"
          fi
          n=0
          # shellcheck disable=SC2086  # TESTS globs on purpose
          for t in $TESTS; do
            echo "== $t"
            coverage run --parallel-mode --branch "${src[@]}" "$t"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no test matched: $TESTS"; exit 1; }
          coverage combine --quiet
          mkdir -p coverage
          coverage report --show-missing | tee coverage/summary.txt
          coverage xml -q -o coverage/coverage.xml
          coverage html -q -d coverage/html
          { echo '### Python coverage (report-only)'; echo '```'; tail -n 1 coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.tests != ''
        with:
          name: python-coverage
          path: coverage
          retention-days: 7
