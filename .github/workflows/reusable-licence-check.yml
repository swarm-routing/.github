name: Reusable licence check

# AntHocNet's per-directory licence rules (ADR-0028) for any swarm-routing repo:
# every tracked .h/.hpp/.cc/.cpp/.py/.sh carries an SPDX line in its first five
# lines; files under the dual roots carry exactly `MIT OR GPL-2.0-only`; C++
# under a core root includes only the standard library and its own files.
# Also requires LICENSE (GPL-2.0), LICENSE-MIT and LICENSING.md at the root.
# `core-deps` names other repositories' dual-licensed cores a core builds on
# (a protocol's core/ on swarm-core's), as `owner/repo@ref:subdir`: each is
# fetched at that ref, and a core may include its files when they carry
# `MIT OR GPL-2.0-only` themselves (check-headers.py --core-dep). The fetched
# trees and their list live under $RUNNER_TEMP, never in the checkout.
# The checker is tools/checks/check-headers.py in swarm-routing/.github.
on:
  workflow_call:
    inputs:
      dual-roots:
        type: string
        default: 'core/ tools/'
      core-roots:
        type: string
        default: 'core/'
      gpl-only:
        type: string
        default: ''
      exclude:
        type: string
        default: ''
      core-deps:
        description: "Space-separated `owner/repo@ref:subdir` dual-licensed cores a core root may include from; empty: none"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  licence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          path: .org
          sparse-checkout: tools/checks
          persist-credentials: false
      - name: Licence texts present
        run: |
          for f in LICENSE LICENSE-MIT LICENSING.md; do
            [ -f "$f" ] || { echo "::error file=$f::missing $f (see AntHocNet LICENSING.md / ADR-0028)"; exit 1; }
          done
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE || { echo "::error file=LICENSE::LICENSE must be the GPL-2.0 text"; exit 1; }
      - name: Fetch the cores a core builds on
        if: inputs.core-deps != ''
        env:
          CORE_DEPS: ${{ inputs.core-deps }}
        run: |
          # Outside the checkout, so a PR cannot plant the list or a dependency.
          base="$RUNNER_TEMP/core-deps"
          rm -rf "$base"; mkdir -p "$base"; : > "$base.list"
          i=0
          for spec in $CORE_DEPS; do
            repo=${spec%%@*}; rest=${spec#*@}; ref=${rest%%:*}; sub=${rest#*:}
            if [ "$repo" = "$spec" ] || [ "$sub" = "$rest" ] || [ -z "$ref" ] || [ -z "$sub" ]; then
              echo "::error::core-deps entry '$spec' is not owner/repo@ref:subdir"; exit 1
            fi
            i=$((i + 1)); dir="$base/$i"   # one checkout per entry, even for one repository twice
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/$repo" "$ref"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            [ -d "$dir/$sub" ] || { echo "::error::$repo@$ref has no $sub/"; exit 1; }
            echo "$dir/$sub" >> "$base.list"
          done
      - name: SPDX headers and the one-way include rule
        env:
          DUAL: ${{ inputs.dual-roots }}
          CORE: ${{ inputs.core-roots }}
          CORE_DEPS: ${{ inputs.core-deps }}
          GPL_ONLY: ${{ inputs.gpl-only }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          args=()
          for d in $DUAL; do args+=(--dual "$d"); done
          for c in $CORE; do args+=(--core "$c"); done
          for g in $GPL_ONLY; do args+=(--gpl-only "$g"); done
          # Only the list the fetch step just wrote, and only when deps are declared.
          if [ -n "$CORE_DEPS" ]; then
            while read -r dep; do args+=(--core-dep "$dep"); done < "$RUNNER_TEMP/core-deps.list"
          fi
          python3 -I .org/tools/checks/check-headers.py --self-test
          python3 -I .org/tools/checks/check-headers.py "${args[@]}" --exclude "$EXCLUDE" .
