name: Reusable licence check

# AntHocNet's per-directory licence rules (ADR-0028) for any swarm-routing repo:
# every tracked .h/.hpp/.cc/.cpp/.py/.sh carries an SPDX line in its first five
# lines; files under the dual roots carry exactly `MIT OR GPL-2.0-only`; C++
# under a core root includes only the standard library and its own files.
# Also requires LICENSE (GPL-2.0), LICENSE-MIT and LICENSING.md at the root.
# `core-deps` names other repositories' dual-licensed cores a core builds on
# (a protocol's core/ on swarm-core's), as `owner/repo@ref:subdir`: each is
# fetched at that ref, and a core may include its files when they carry
# `MIT OR GPL-2.0-only` themselves (check-headers --core-dep). The fetched
# trees and their list live under $RUNNER_TEMP, never in the checkout.
# The checker is cmd/check-headers in swarm-routing/.github (the Go port of
# the former tools/checks/check-headers.py, #531), run from the ci-tools image by digest
# with `docker run`: the checkout and the fetched cores mounted read-only, as
# the image's nonroot user; it reads the git index itself (no git in the image).
on:
  workflow_call:
    inputs:
      dual-roots:
        type: string
        default: 'core/ tools/'
      core-roots:
        type: string
        default: 'core/'
      gpl-only:
        type: string
        default: ''
      exclude:
        type: string
        default: ''
      core-deps:
        description: "Space-separated `owner/repo@ref:subdir` dual-licensed cores a core root may include from; empty: none"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  licence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Licence texts present
        run: |
          for f in LICENSE LICENSE-MIT LICENSING.md; do
            [ -f "$f" ] || { echo "::error file=$f::missing $f (see AntHocNet LICENSING.md / ADR-0028)"; exit 1; }
          done
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE || { echo "::error file=LICENSE::LICENSE must be the GPL-2.0 text"; exit 1; }
      - name: Fetch the cores a core builds on
        if: inputs.core-deps != ''
        env:
          CORE_DEPS: ${{ inputs.core-deps }}
        run: |
          # Outside the checkout, so a PR cannot plant the list or a dependency.
          base="$RUNNER_TEMP/core-deps"
          rm -rf "$base"; mkdir -p "$base"; : > "$base.list"
          i=0
          for spec in $CORE_DEPS; do
            repo=${spec%%@*}; rest=${spec#*@}; ref=${rest%%:*}; sub=${rest#*:}
            if [ "$repo" = "$spec" ] || [ "$sub" = "$rest" ] || [ -z "$ref" ] || [ -z "$sub" ]; then
              echo "::error::core-deps entry '$spec' is not owner/repo@ref:subdir"; exit 1
            fi
            i=$((i + 1)); dir="$base/$i"   # one checkout per entry, even for one repository twice
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/$repo" "$ref"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            [ -d "$dir/$sub" ] || { echo "::error::$repo@$ref has no $sub/"; exit 1; }
            echo "$dir/$sub" >> "$base.list"
          done
      - name: SPDX headers and the one-way include rule
        timeout-minutes: 6  # the image pull (about 15 MB, up to 90 s of retries) and two runs of a few seconds
        env:
          DUAL: ${{ inputs.dual-roots }}
          CORE: ${{ inputs.core-roots }}
          CORE_DEPS: ${{ inputs.core-deps }}
          GPL_ONLY: ${{ inputs.gpl-only }}
          EXCLUDE: ${{ inputs.exclude }}
          # the ci-tools image by digest (docs/adr/0002-pipelines-are-go.md); sha-bd03540
          IMG: ghcr.io/swarm-routing/ci-tools@sha256:47de777a458c52a808a970ba1c2cd1a557c991c26deebde249f5ee9c95a75547
        run: |
          args=()
          for d in $DUAL; do args+=(--dual "$d"); done
          for c in $CORE; do args+=(--core "$c"); done
          for g in $GPL_ONLY; do args+=(--gpl-only "$g"); done
          run=(docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace)
          # Only the list the fetch step just wrote, and only when deps are declared;
          # the fetched trees are mounted read-only at /core-deps.
          if [ -n "$CORE_DEPS" ]; then
            run+=(-v "$RUNNER_TEMP/core-deps:/core-deps:ro")
            while read -r dep; do args+=(--core-dep "/core-deps/${dep#"$RUNNER_TEMP/core-deps/"}"); done < "$RUNNER_TEMP/core-deps.list"
          fi
          # GHCR answered `denied` and then `not found` for this public digest for a few
          # minutes on 2026-11-17 (04:53-04:58Z, with no login in this job), so a pull
          # gets three more tries before the gate fails (#578)
          for delay in 15 30 45 0; do
            docker pull --quiet "$IMG" && break
            [ "$delay" -gt 0 ] || { echo "::error::could not pull $IMG"; exit 1; }
            echo "pull failed; retrying in $delay s" >&2; sleep "$delay"
          done
          "${run[@]}" "$IMG" check-headers --self-test
          "${run[@]}" "$IMG" check-headers "${args[@]}" --exclude "$EXCLUDE" .
