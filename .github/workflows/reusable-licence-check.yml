name: Reusable licence check

# AntHocNet's per-directory licence rules (ADR-0028) for any swarm-routing repo:
# every tracked .h/.hpp/.cc/.cpp/.py/.sh carries an SPDX line in its first five
# lines; files under the dual roots carry exactly `MIT OR GPL-2.0-only`; C++
# under a core root includes only the standard library and its own files.
# Also requires LICENSE (GPL-2.0), LICENSE-MIT and LICENSING.md at the root.
# `core-deps` names other repositories' dual-licensed cores a core builds on
# (a protocol's core/ on swarm-core's), as `owner/repo@ref:subdir`: each is
# fetched at that ref, and a core may include its files when they carry
# `MIT OR GPL-2.0-only` themselves (check-headers --core-dep).
# The checker is cmd/check-headers in swarm-routing/.github, run from the
# ci-tools image by digest as `uses: docker://` runs a read-only tool
# (ADR-0002, #531): it reads the checkout and the git index, no git needed.
# That container sees only the workspace, so the fetched cores go in
# .licence-core-deps/ there (refused when the checkout tracks it, emptied
# first, never in the git index, so never scanned); the list of them stays
# under $RUNNER_TEMP, where a PR cannot plant it.
on:
  workflow_call:
    inputs:
      dual-roots:
        type: string
        default: 'core/ tools/'
      core-roots:
        type: string
        default: 'core/'
      gpl-only:
        type: string
        default: ''
      exclude:
        type: string
        default: ''
      core-deps:
        description: "Space-separated `owner/repo@ref:subdir` dual-licensed cores a core root may include from; empty: none"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  licence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Licence texts present
        run: |
          for f in LICENSE LICENSE-MIT LICENSING.md; do
            [ -f "$f" ] || { echo "::error file=$f::missing $f (see AntHocNet LICENSING.md / ADR-0028)"; exit 1; }
          done
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE || { echo "::error file=LICENSE::LICENSE must be the GPL-2.0 text"; exit 1; }
      - name: Fetch the cores a core builds on
        if: inputs.core-deps != ''
        env:
          CORE_DEPS: ${{ inputs.core-deps }}
        run: |
          # In the checkout (the container sees only the workspace), under a
          # directory the checkout may not track; the list outside it.
          base=.licence-core-deps
          if [ -n "$(git ls-files -- "$base")" ]; then
            echo "::error::$base/ is tracked: the licence check fetches the cores there"; exit 1
          fi
          rm -rf "$base"; mkdir -p "$base"; : > "$RUNNER_TEMP/core-deps.list"
          i=0
          for spec in $CORE_DEPS; do
            repo=${spec%%@*}; rest=${spec#*@}; ref=${rest%%:*}; sub=${rest#*:}
            if [ "$repo" = "$spec" ] || [ "$sub" = "$rest" ] || [ -z "$ref" ] || [ -z "$sub" ]; then
              echo "::error::core-deps entry '$spec' is not owner/repo@ref:subdir"; exit 1
            fi
            i=$((i + 1)); dir="$base/$i"   # one checkout per entry, even for one repository twice
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/$repo" "$ref"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            [ -d "$dir/$sub" ] || { echo "::error::$repo@$ref has no $sub/"; exit 1; }
            echo "$dir/$sub" >> "$RUNNER_TEMP/core-deps.list"
          done
      - name: The checker's arguments
        id: args
        env:
          DUAL: ${{ inputs.dual-roots }}
          CORE: ${{ inputs.core-roots }}
          CORE_DEPS: ${{ inputs.core-deps }}
          GPL_ONLY: ${{ inputs.gpl-only }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          # One line for the container's args; each value is one word (the
          # inputs are space-split, as before), and the runner reads a double
          # quote in args as quoting, so a value holding one is refused. An
          # empty exclude is the same as none, so it is left out.
          args="check-headers"
          add() {
            case "$2" in *'"'*) echo "::error::$1 '$2' holds a double quote"; exit 1;; esac
            args="$args $1 $2"
          }
          for d in $DUAL; do add --dual "$d"; done
          for c in $CORE; do add --core "$c"; done
          for g in $GPL_ONLY; do add --gpl-only "$g"; done
          # Only the list the fetch step just wrote, and only when deps are declared.
          if [ -n "$CORE_DEPS" ]; then
            while read -r dep; do add --core-dep "$dep"; done < "$RUNNER_TEMP/core-deps.list"
          fi
          if [ -n "$EXCLUDE" ]; then
            case "$EXCLUDE" in *[[:space:]]*) echo "::error::exclude '$EXCLUDE' holds whitespace"; exit 1;; esac
            add --exclude "$EXCLUDE"
          fi
          echo "args=$args ." >> "$GITHUB_OUTPUT"
          echo "$args ."
      - name: check-headers self-test
        uses: docker://ghcr.io/swarm-routing/ci-tools@sha256:602462891c03d1a5557901037a7169394538523fe9e9dac7b4884cd1d651a0b0 # sha-328d5d4
        timeout-minutes: 3
        with:
          args: check-headers --self-test
      - name: SPDX headers and the one-way include rule
        uses: docker://ghcr.io/swarm-routing/ci-tools@sha256:602462891c03d1a5557901037a7169394538523fe9e9dac7b4884cd1d651a0b0 # sha-328d5d4
        timeout-minutes: 3
        with:
          args: ${{ steps.args.outputs.args }}
