name: labels

# labels.json, the org taxonomy, on every org repository, private ones
# included, as soon as it changes (#570): cmd/labels from the ci-tools image
# by digest (docs/adr/0002-pipelines-are-go.md) creates a missing label and
# updates one whose colour, description or name's case differs; it never
# deletes a label (golden rule 11), so a repository's own labels stay. A
# private repository is printed as "private repository N", never by name.
#
# Runs on a push to main that changes labels.json or this workflow, weekly
# (a label edited by hand in a repository goes back to the taxonomy) and on
# demand. A pull request that changes either runs a read-only dry run with
# the workflow's own token (the public repositories only). Each repository's
# sync-labels.yml caller keeps its monthly run as a second path.
#
# Token: the org App's installation token (.github/actions/bot-token), which
# has Issues write on every repository, private ones included.
on:
  push:
    branches: [main]
    paths:
      - labels.json
      - .github/workflows/labels.yml
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Read every repository and print what would change'
        type: boolean
        default: false
  pull_request:
    paths:
      - labels.json
      - .github/workflows/labels.yml

permissions:
  contents: read

concurrency:
  group: labels-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # the ci-tools image by digest (docs/adr/0002-pipelines-are-go.md)
      IMG: ghcr.io/swarm-routing/ci-tools@sha256:47de777a458c52a808a970ba1c2cd1a557c991c26deebde249f5ee9c95a75547  # promoted from bd03540 (#650)
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The ci-tools image (pulled with retries, #645)
        uses: ./.github/actions/pull-ci-tools
        timeout-minutes: 3  # about 15 MB, and up to 90 s of retries
        with:
          image: ${{ env.IMG }}
      - name: Dry run (pull request, reads only)
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace "$IMG" labels --dry-run
      - name: Bot token
        if: github.event_name != 'pull_request'
        id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Apply labels.json
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -o pipefail
          args=()
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ -z "$GH_TOKEN" ] && echo "::warning::no bot token (neither the App secrets nor ORG_BOT_TOKEN): dry run only"
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace "$IMG" labels "${args[@]}" \
            | tee "$RUNNER_TEMP/labels.txt"
      - name: Summary
        if: always() && github.event_name != 'pull_request'
        run: |
          {
            echo "### labels"
            echo
            printf '%s\n' '```'
            cat "$RUNNER_TEMP/labels.txt" 2>/dev/null || echo "(no output)"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
