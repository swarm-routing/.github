name: Reusable release

# One release pipeline for every swarm-routing repository (#20), so no repo
# copies AntHocNet's release.yml and the copies never drift (ROADMAP
# "Releases": no org repository releases before this exists).
#
# A release takes two runs, because `main` takes no direct push (the org's
# `main` rulesets require a PR, and GITHUB_TOKEN cannot be a bypass actor);
# bots open PRs instead (AntHocNet#789 option B, the same design as
# AntHocNet#883):
#
# 1. mode `bump` (a workflow_dispatch). Commitizen bumps the version from the
#    Conventional-Commit history since the last tag (the first release is
#    v0.1.0), rewrites the caller's version files and writes CHANGELOG.md.
#    The `propose` job puts that commit on the fixed branch `bot/release`,
#    rebuilt on the default branch's tip (force-pushed), and opens or updates
#    the PR `chore(release): bump version A to B`. It pushes with the org
#    GitHub App's token (.github/actions/bot-token: BOT_APP_ID /
#    BOT_APP_PRIVATE_KEY, else ORG_BOT_TOKEN, else GITHUB_TOKEN), so CI runs
#    on the PR. Nothing is built, tagged or published.
# 2. Merging that PR is the release (mode `release`, a push to the default
#    branch). The `route` job releases only a commit that is the merge of a
#    PR whose head is `<owner>/<repo>:bot/release` (GET
#    /repos/{repo}/commits/{sha}/pulls); any other push is a no-op. Then:
#      build    the caller's `build` command (default `make dist`, #11)
#               writes the release assets into `dist-dir` from the merged
#               commit; a CycloneDX SBOM of `sbom-path` and SHA256SUMS are
#               added. Read-only token: the caller's build never runs with
#               write access.
#      attest   signed SLSA build provenance for every asset (actions/attest,
#               keyless Sigstore with this workflow's identity), attached as
#               `<name>-<version>.intoto.jsonl` (the name Scorecard's
#               Signed-Releases recognises, AntHocNet#788) and as the
#               Sigstore bundle `<name>-<version>.sigstore.json`; the SBOM
#               attested against the assets; then the verify commands of the
#               release notes run here, and a release that does not verify
#               never goes out.
#      publish  (environment `release`, so where a repository protects it the
#               maintainer approves the run) tags the merged commit
#               v<version> (tags are outside the branch ruleset, so
#               GITHUB_TOKEN pushes it) and creates the GitHub release with
#               every asset and the notes (the version's CHANGELOG.md
#               section, the checksums, the verify commands).
#    Re-runs resume: a tag already on this commit is kept and the release is
#    completed; a tag on a different commit fails the run. Nothing in any
#    mode pushes to the default branch.
#
# mode `dry-run` (or `dry-run: true`) bumps on the runner only, then builds,
# checksums, writes the SBOM, attests (real attestations, in the caller's
# attestation store, on the dry-run's assets) and verifies; nothing is
# pushed, proposed, tagged or published. The whole release (assets, notes,
# the bump commit as a git bundle) is the `artifact` output, kept 1 day.
#
# `mode` left empty (the default) picks from the event: a push releases
# (when it is a merged bump PR), anything else bumps; `dry-run: true` wins.
#
# The caller needs a Commitizen config (`[tool.commitizen]` in pyproject.toml,
# or .cz.toml) in `working-directory`, with `tag_format = "v$version"` and
# `major_version_zero = true` while 0.x (CONTRIBUTING "Releases and DOIs" has
# the minimal one). Commitizen is pinned here with hashes, so its version is
# this workflow's, not the caller's.
#
# Environment of the `build` command (bash, in `working-directory`):
#   RELEASE_VERSION  e.g. 0.1.0     RELEASE_TAG  e.g. v0.1.0
#   RELEASE_DIST     dist-dir, as given
# It may also test what it built (e.g. unpack a module tarball into an
# ns3-dev tree and run its suite); a non-zero exit stops the release before
# anything is signed or tagged. Assets are the regular files at the top of
# `dist-dir` (subdirectories are ignored); names this workflow writes
# (SHA256SUMS, *.intoto.jsonl, *.sigstore.json, *.cdx.json) are refused.
#
# Permissions. Each job declares its own; a called workflow can only keep or
# reduce the caller's grant, so the caller's job grants their union, dry run
# included (the attestations are real). The caller (CONTRIBUTING "Cutting a
# release" has it whole):
#
#   on:
#     workflow_dispatch:
#       inputs:
#         mode: { type: choice, options: [dry-run, bump], default: dry-run }
#     push:
#       branches: [main]
#   concurrency: { group: "release-${{ github.sha }}", cancel-in-progress: false }
#   jobs:
#     release:
#       if: ${{ github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore(release): bump version ') }}
#       permissions: { contents: write, pull-requests: write, id-token: write, attestations: write }
#       uses: swarm-routing/.github/.github/workflows/reusable-release.yml@main
#       with:
#         mode: ${{ inputs.mode }}           # empty on push: release
#       secrets:
#         BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
#         BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
#         ORG_BOT_TOKEN: ${{ secrets.ORG_BOT_TOKEN }}
#
# An ns-3 repository also publishes its images at the same version (#107):
#
#     image:
#       needs: release
#       if: ${{ needs.release.outputs.mode == 'release' }}
#       permissions: { contents: read, packages: write, id-token: write, attestations: write }
#       uses: swarm-routing/.github/.github/workflows/reusable-ns3-image.yml@main
#       with:
#         modules: ara=ns3
#         tag: ${{ needs.release.outputs.tag }}
#
# Verify a release (the notes carry these with the real names):
#
#   sha256sum -c SHA256SUMS --ignore-missing
#   gh attestation verify <asset> --repo swarm-routing/<repo> \
#     --signer-workflow swarm-routing/.github/.github/workflows/reusable-release.yml
#   gh attestation verify <asset> --repo swarm-routing/<repo> --predicate-type https://cyclonedx.org/bom
#   gh attestation verify <asset> --repo swarm-routing/<repo> --bundle <name>-<version>.sigstore.json   # offline
#
# The signing identity is this reusable workflow (Fulcio's SAN is the called
# workflow's ref); the caller repository is in the certificate's
# workflow-repository extension.
on:
  workflow_call:
    inputs:
      build:
        description: "Bash command, run in working-directory after the bump, that writes the release assets into dist-dir"
        type: string
        default: 'make dist'
      dist-dir:
        description: "Directory (relative to working-directory) whose top-level files are the release assets"
        type: string
        default: 'dist'
      working-directory:
        description: "Directory holding the Commitizen config; the build runs here"
        type: string
        default: '.'
      sbom-path:
        description: "What the CycloneDX SBOM describes, relative to working-directory (default: the checkout at the release commit)"
        type: string
        default: '.'
      dry-run:
        description: "Bump, build, checksum, SBOM, attest and verify, but push, tag and publish nothing (the same as mode: dry-run)"
        type: boolean
        default: false
      mode:
        description: "bump (open or update the bump PR), release (publish the merged bump PR this commit is), dry-run; empty: release on push, bump otherwise"
        type: string
        default: ''
    secrets:
      BOT_APP_ID:
        description: "The org GitHub App's ID, for the bump PR's token (.github/actions/bot-token)"
        required: false
      BOT_APP_PRIVATE_KEY:
        description: "The org GitHub App's private key"
        required: false
      ORG_BOT_TOKEN:
        description: "Fallback token for the bump PR when the App is not configured"
        required: false
    outputs:
      mode:
        description: "What the run did: bump, release, dry-run, or none (a push that is not a merged bump PR)"
        value: ${{ jobs.route.outputs.mode }}
      version:
        description: "The released (or, in bump mode, proposed) version, e.g. 0.1.0"
        value: ${{ jobs.build.outputs.version }}
      tag:
        description: "The release tag, e.g. v0.1.0"
        value: ${{ jobs.build.outputs.tag }}
      artifact:
        description: "Artifact holding release/ (every asset) and meta/ (notes.md; release.bundle with the bump commit in bump and dry-run modes)"
        value: ${{ jobs.build.outputs.artifact }}
      pull-request:
        description: "In bump mode, the URL of the bump PR"
        value: ${{ jobs.propose.outputs.url }}

jobs:
  # Which mode this run is, and, for a release, that the commit is the merge
  # of the bump PR. The commit title alone is not enough: any squash-merged
  # PR could carry it.
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # which PR the pushed commit came from
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      version: ${{ steps.route.outputs.version }}
      base: ${{ steps.route.outputs.base }}
    steps:
      - name: Mode
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          MODE_IN: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry-run }}
          EVENT: ${{ github.event_name }}
        run: |
          mode="$MODE_IN"
          if [ "$DRY_RUN" = true ]; then
            if [ -n "$mode" ] && [ "$mode" != dry-run ]; then
              echo "::error::dry-run: true and mode: $mode disagree"; exit 1
            fi
            mode=dry-run
          fi
          if [ -z "$mode" ]; then
            if [ "$EVENT" = push ]; then mode=release; else mode=bump; fi
          fi
          case "$mode" in
            bump|release|dry-run) ;;
            *) echo "::error::mode '$mode': use bump, release or dry-run"; exit 1 ;;
          esac
          base="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          if [ "$mode" != dry-run ] && [ "$GITHUB_REF" != "refs/heads/${base}" ]; then
            echo "::error::a $mode runs on the default branch ${base}; this run is on ${GITHUB_REF}"
            exit 1
          fi
          if [ "$mode" = release ]; then
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > "$RUNNER_TEMP/pulls.json"
            pr="$(jq -c --arg sha "$GITHUB_SHA" --arg base "$base" \
              '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == $base)] | .[0] // empty' \
              "$RUNNER_TEMP/pulls.json")"
            from="$(jq -r '"\(.head.repo.full_name):\(.head.ref)"' <<< "${pr:-null}")"
            if [ -z "$pr" ] || [ "$from" != "${GITHUB_REPOSITORY}:bot/release" ]; then
              msg="${GITHUB_SHA} is not the merge of a ${GITHUB_REPOSITORY}:bot/release PR (came from '${pr:+$from}'); nothing to release"
              # Every push to the default branch may reach here: only a
              # dispatch that asked for a release is an error.
              if [ "$EVENT" = push ]; then echo "::notice::$msg"; mode=none; else echo "::error::$msg"; exit 1; fi
            else
              title="$(jq -r .title <<< "$pr")"
              ver="$(sed -n -E 's/^chore\(release\): bump version .+ to ([^ ]+)$/\1/p' <<< "$title")"
              if [ -z "$ver" ]; then
                echo "::error::the merged bump PR's title '$title' names no version (chore(release): bump version A to B)"; exit 1
              fi
              echo "version=${ver}" >> "$GITHUB_OUTPUT"
              echo "Release commit ${GITHUB_SHA}: $(jq -r .html_url <<< "$pr") (${title})"
            fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "mode: ${mode}"

  # bump and dry-run: Commitizen's bump on the runner. release: the merged
  # commit's version, and its CHANGELOG.md section as the notes. Then (not in
  # bump mode) the caller's build, the SBOM and the checksums.
  build:
    needs: route
    if: ${{ needs.route.outputs.mode != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      old-version: ${{ steps.bump.outputs.old-version }}
      tag: ${{ steps.bump.outputs.tag }}
      name: ${{ steps.bump.outputs.name }}
      artifact: ${{ steps.bump.outputs.artifact }}
      commit: ${{ steps.bump.outputs.commit }}
    env:
      WD: ${{ inputs.working-directory }}
      DIST_IN: ${{ inputs.dist-dir }}
      MODE: ${{ needs.route.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history and its tags, for Commitizen
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'   # the wheels hashed below are cp312 x86_64

      - name: Install Commitizen (pinned with hashes)
        # The set AntHocNet's requirements/commitizen.txt resolves (uv pip
        # compile --generate-hashes), reduced to the wheel each package
        # installs on this runner; every hash below is one of that file's.
        timeout-minutes: 10
        run: |
          req="$RUNNER_TEMP/commitizen.txt"
          cat > "$req" <<'EOF'
          argcomplete==3.7.2 --hash=sha256:6029205678bdd9c1c728a155f5f9ecf5812393f969eef58807641a2bc2aa5b19
          charset-normalizer==3.5.2 --hash=sha256:3d31298449090ab8d47b7b1b2a555ff73cac7ed438a08b7ac160980c7ebed649
          colorama==0.4.6 --hash=sha256:4f1d9991f5acc0ca119f9d443620b77f9d6b33703e51011c16baf57afb285fc6
          commitizen==4.19.3 --hash=sha256:d625e038cce66d92da20d24c2c366d410caca43966eba8ec036debf48fda2a68
          decli==0.6.3 --hash=sha256:5152347c7bb8e3114ad65db719e5709b28d7f7f45bdb709f70167925e55640f3
          deprecated==1.3.1 --hash=sha256:597bfef186b6f60181535a29fbe44865ce137a5079f295b479886c82729d5f3f
          jinja2==3.1.6 --hash=sha256:85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
          markupsafe==3.0.4 --hash=sha256:8e124f974786f831d6043728e38296969d3579db8896fe004682f5758e613581
          packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          prompt-toolkit==3.0.53 --hash=sha256:01c0891d7f9237d5e339f7d3e42cdae80b7534abb1c7c0e3352efba6231492f2
          pyyaml==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc
          questionary==2.1.1 --hash=sha256:a51af13f345f1cdea62347589fbb6df3b290306ab8930713bfae4d475a7d4a59
          termcolor==3.3.0 --hash=sha256:cf642efadaf0a8ebbbf4bc7a31cec2f9b5f21a9f726f4ccbb08192c9c26f43a5
          tomlkit==0.15.2 --hash=sha256:05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437
          wcwidth==0.9.4 --hash=sha256:b185c8b927b23af2721be1783499d1cfa5c028b098b0858951b4ae224477f1c2
          wrapt==2.5.2 --hash=sha256:092472b7b1494deef40dac5e9f6295013a9d51b112b5fbc4350f64dc2574e46a
          EOF
          python -m pip install --quiet --only-binary=:all: --require-hashes -r "$req"
          cz version

      - name: Version (bump and dry-run, on the runner only; release, the merged commit's)
        id: bump
        env:
          PR_VERSION: ${{ needs.route.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT="$RUNNER_TEMP/rel"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          cd "$WD"
          if ! cz version --project > /dev/null 2>&1; then
            echo "::error::no Commitizen config in '$WD' (CONTRIBUTING.md, Releases and DOIs)"
            exit 1
          fi
          mkdir -p "$OUT/release" "$OUT/meta"
          old="$(cz version --project)"
          if [ "$MODE" = release ]; then
            # The merged bump PR already carries the version and the changelog.
            ver="$old"
            tag="v${ver}"
            if [ "$ver" != "$PR_VERSION" ]; then
              echo "::error::the merged bump PR proposed ${PR_VERSION}, but this commit's version is ${ver}"
              exit 1
            fi
            # A tag on this commit is a re-run after a failed publish: build
            # again and let publish resume. A tag elsewhere: the version is taken.
            if tagged="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")"; then
              if [ "$tagged" != "$GITHUB_SHA" ]; then
                echo "::error::${tag} already tags ${tagged}, not ${GITHUB_SHA}"
                exit 1
              fi
              echo "::notice::${tag} already tags ${GITHUB_SHA}: a re-run, publish resumes"
            fi
            # The notes: this version's section of the changelog the bump wrote.
            awk -v h="## ${tag}" 'index($0, h " ") == 1 || $0 == h { p = 1; print; next } p && /^## / { exit } p' \
              CHANGELOG.md > "$OUT/meta/changes.md" 2> /dev/null || true
            if [ ! -s "$OUT/meta/changes.md" ]; then
              echo "::warning::no '## ${tag}' section in ${WD}/CHANGELOG.md; the notes carry only the heading"
              printf '## %s\n' "$tag" > "$OUT/meta/changes.md"
            fi
            commit="$GITHUB_SHA"
          else
            # The first release is v0.1.0 (ROADMAP "Releases", .github#81); after
            # that Commitizen computes the next version from the commits.
            manual=()
            if [ -z "$(git tag --list 'v[0-9]*')" ]; then manual=(0.1.0); fi
            rc=0
            cz bump --yes --changelog --changelog-to-stdout --git-output-to-stderr "${manual[@]}" \
              > "$OUT/meta/changes.md" || rc=$?
            if [ "$rc" -ne 0 ]; then
              # 3 = no commits since the last tag, 21 = none that bumps (docs, ci, ...)
              echo "::error::cz bump exited $rc: nothing to release since the last tag, or the bump failed (log above)"
              exit "$rc"
            fi
            ver="$(cz version --project)"
            tag="v${ver}"
            if [ "$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Commitizen did not tag HEAD as ${tag}: set tag_format = \"v\$version\""
              exit 1
            fi
            test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
            commit="$(git rev-parse HEAD)"
            if [ "$MODE" = bump ]; then
              # The tag goes on the merged commit (publish), never on this one;
              # propose pushes this commit as bot/release.
              git tag -d "$tag" > /dev/null
              git update-ref refs/heads/bot/release "$commit"
              git bundle create "$OUT/meta/release.bundle" refs/heads/bot/release "^${GITHUB_SHA}"
            else
              git bundle create "$OUT/meta/release.bundle" "refs/tags/${tag}" "^${GITHUB_SHA}"
            fi
          fi
          # Asset stem: the repository name, lowercase, leading dots dropped.
          name="${GITHUB_REPOSITORY#*/}"; name="${name#.}"; name="${name,,}"
          {
            echo "version=${ver}"
            echo "old-version=${old}"
            echo "tag=${tag}"
            echo "name=${name}"
            echo "artifact=release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            # Fixed before anything else runs: propose pushes only this commit,
            # whatever a later step does to the bundle on disk.
            echo "commit=${commit}"
          } >> "$GITHUB_OUTPUT"
          { echo "RELEASE_VERSION=${ver}"; echo "RELEASE_TAG=${tag}"; echo "NAME=${name}"; } >> "$GITHUB_ENV"
          git log --oneline -1
          cat "$OUT/meta/changes.md"

      - name: Build the assets (the caller's command)
        if: ${{ needs.route.outputs.mode != 'bump' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD: ${{ inputs.build }}
          RELEASE_DIST: ${{ inputs.dist-dir }}
        run: |
          bash -eo pipefail -c "$BUILD"

      - name: Collect the assets
        if: ${{ needs.route.outputs.mode != 'bump' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ ! -d "$DIST_IN" ]; then
            echo "::error::the build wrote no '$DIST_IN' directory"
            exit 1
          fi
          n=0
          for f in "$DIST_IN"/* "$DIST_IN"/.[!.]*; do
            [ -e "$f" ] || continue
            b="$(basename "$f")"
            if [ ! -f "$f" ] || [ -L "$f" ]; then echo "::notice::not an asset (not a regular file): $b"; continue; fi
            case "$b" in
              SHA256SUMS|*.intoto.jsonl|*.sigstore.json|*.cdx.json)
                echo "::error::'$b' is a name this workflow writes; rename it"; exit 1 ;;
            esac
            cp -p "$f" "$OUT/release/$b"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then echo "::error::'$DIST_IN' holds no files"; exit 1; fi
          ls -l "$OUT/release"

      - name: CycloneDX SBOM
        if: ${{ needs.route.outputs.mode != 'bump' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.sbom-path }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/rel/release/${{ steps.bump.outputs.name }}-${{ steps.bump.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SHA256SUMS
        if: ${{ needs.route.outputs.mode != 'bump' }}
        run: |
          sbom="$OUT/release/${NAME}-${RELEASE_VERSION}.cdx.json"
          test "$(jq -r .bomFormat "$sbom")" = CycloneDX
          cd "$OUT/release"
          # Bare names, so `sha256sum -c` works in the directory of the download.
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > "$OUT/SHA256SUMS"
          mv "$OUT/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bump.outputs.artifact }}
          path: |
            ${{ runner.temp }}/rel/release
            ${{ runner.temp }}/rel/meta
          retention-days: 1
          if-no-files-found: error

  attest:
    needs: [route, build]
    if: ${{ needs.route.outputs.mode == 'release' || needs.route.outputs.mode == 'dry-run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write       # keyless Sigstore signing
      attestations: write   # store the provenance and SBOM attestations
    env:
      VER: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      NAME: ${{ needs.build.outputs.name }}
      SIGNER: swarm-routing/.github/.github/workflows/reusable-release.yml
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/rel

      - name: Subjects
        id: subjects
        run: |
          REL="$RUNNER_TEMP/rel/release"
          { echo "REL=$REL"; echo "META=$RUNNER_TEMP/rel/meta"; } >> "$GITHUB_ENV"
          cd "$REL"
          sha256sum -c SHA256SUMS
          sbom="${NAME}-${VER}.cdx.json"
          # Provenance covers every file in SHA256SUMS and SHA256SUMS itself;
          # the SBOM is attested against the caller's assets.
          {
            echo "all<<EOF"
            echo "$REL/SHA256SUMS"
            cut -d' ' -f3- SHA256SUMS | sed "s|^|$REL/|"
            echo "EOF"
            echo "assets<<EOF"
            cut -d' ' -f3- SHA256SUMS | grep -vxF "$sbom" | sed "s|^|$REL/|"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: SLSA build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.all }}

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.assets }}
          sbom-path: ${{ runner.temp }}/rel/release/${{ needs.build.outputs.name }}-${{ needs.build.outputs.version }}.cdx.json

      - name: Provenance files
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$REL/${NAME}-${VER}.sigstore.json"
          # The bundle's signed DSSE envelope on one line, the format
          # slsa-github-generator publishes, under the name Scorecard's
          # Signed-Releases looks for (AntHocNet#788).
          jq -c '.dsseEnvelope' "$BUNDLE" > "$REL/${NAME}-${VER}.intoto.jsonl"
          test "$(jq -r '.payloadType' "$REL/${NAME}-${VER}.intoto.jsonl")" = "application/vnd.in-toto+json"
          test "$(wc -l < "$REL/${NAME}-${VER}.intoto.jsonl")" -eq 1
          jq -r '.payload | @base64d | fromjson | .predicateType' "$REL/${NAME}-${VER}.intoto.jsonl"

      - name: Release notes, with the verify commands
        env:
          REPO: ${{ github.repository }}
        run: |
          first="$(cut -d' ' -f3- "$REL/SHA256SUMS" | grep -vxF "${NAME}-${VER}.cdx.json" | head -n1)"
          {
            cat "$META/changes.md"
            echo
            echo "## Verify your download"
            echo
            echo "Checksums (also the \`SHA256SUMS\` asset):"
            echo
            echo '```'
            cat "$REL/SHA256SUMS"
            echo '```'
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing   # in the directory you downloaded to"
            echo '```'
            echo
            echo "Every asset carries signed SLSA build provenance (\`${NAME}-${VER}.intoto.jsonl\`, and the Sigstore bundle \`${NAME}-${VER}.sigstore.json\`) and is described by a CycloneDX SBOM (\`${NAME}-${VER}.cdx.json\`). With the GitHub CLI, for any asset, e.g. \`${first}\`:"
            echo
            echo '```'
            echo "gh attestation verify ${first} --repo ${REPO} --signer-workflow ${SIGNER}"
            echo "gh attestation verify ${first} --repo ${REPO} --predicate-type https://cyclonedx.org/bom"
            echo "gh attestation verify ${first} --repo ${REPO} --bundle ${NAME}-${VER}.sigstore.json   # offline"
            echo '```'
            echo
            echo "Built and signed by [\`reusable-release.yml\`](https://github.com/swarm-routing/.github/blob/main/.github/workflows/reusable-release.yml), run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID})."
          } > "$META/notes.md"
          cat "$META/notes.md"

      - name: Verify, with the commands of the notes
        # A release whose checksums or attestations do not verify never goes out.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd "$REL"
          sha256sum -c SHA256SUMS --ignore-missing
          # gh prints nothing when not on a terminal: --format json, and a line
          # per check, so the log shows what was verified.
          ok() { jq -e -r --arg f "$1" --arg w "$2" 'if length > 0 then "verified \($w): \($f)" else empty end'; }
          mapfile -t files < <(cut -d' ' -f3- SHA256SUMS)
          for f in "${files[@]}" SHA256SUMS; do
            gh attestation verify "$f" --repo "$REPO" --signer-workflow "$SIGNER" --format json < /dev/null | ok "$f" provenance
            gh attestation verify "$f" --repo "$REPO" --bundle "${NAME}-${VER}.sigstore.json" --format json < /dev/null | ok "$f" "provenance (offline bundle)"
          done
          for f in "${files[@]}"; do
            [ "$f" = "${NAME}-${VER}.cdx.json" ] && continue
            gh attestation verify "$f" --repo "$REPO" --predicate-type https://cyclonedx.org/bom --format json < /dev/null | ok "$f" sbom
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: |
            ${{ runner.temp }}/rel/release
            ${{ runner.temp }}/rel/meta
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Summary
        env:
          MODE: ${{ needs.route.outputs.mode }}
        run: |
          {
            echo "### ${TAG}$( [ "$MODE" = dry-run ] && echo ' (dry run: nothing pushed or published)')"
            echo
            echo '```'
            find "$REL" -maxdepth 1 -type f -printf '%s\t%f\n' | LC_ALL=C sort -k2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [route, build, attest]
    if: ${{ needs.route.outputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The `release` environment: where the repository enables it
    # (`[settings] release_environment = true`, tools/repo-settings), the
    # maintainer approves this job before anything is tagged or published.
    environment: release
    # One publish per commit at a time, never cancelled: a re-run waits for
    # the run before it, then resumes from what that one left.
    concurrency:
      group: release-publish-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write   # push the tag, create the release
    env:
      TAG: ${{ needs.build.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      # It runs no code of the caller's: the merged commit's checkout (for
      # the tag) and the built files only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/rel

      - name: Tag the merged commit
        # Tags are outside the branch ruleset (the release-tags ruleset only
        # stops a v* tag being moved or deleted), so GITHUB_TOKEN pushes it.
        # Idempotent: a tag already on this commit is kept (a re-run
        # resumes); one on another commit fails.
        run: |
          test "$COMMIT" = "$GITHUB_SHA"
          # The peeled line (^{}) of an annotated tag sorts last; a
          # lightweight tag has only its own line.
          tagged="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n 1 | cut -f1)"
          if [ -n "$tagged" ]; then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::${TAG} already tags ${tagged}, not ${GITHUB_SHA}"
              exit 1
            fi
            echo "${TAG} already tags ${GITHUB_SHA}; resuming."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$RUNNER_TEMP/rel"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run after a release was created: complete its assets and notes.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$R"/release/*
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$R/meta/notes.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes-file "$R/meta/notes.md" "$R"/release/*
          fi
          echo "Published ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

  # mode bump: the bump commit as the PR `chore(release): bump version A to
  # B` from bot/release. It runs no code of the caller's (the build job ran
  # only Commitizen in this mode).
  propose:
    needs: [route, build]
    if: ${{ needs.route.outputs.mode == 'bump' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-bump-${{ github.repository }}
      cancel-in-progress: false
    # contents + pull-requests: write only for the GITHUB_TOKEN fallback when
    # no bot token is configured; the bot token is the one that should push,
    # since a push or PR made with GITHUB_TOKEN starts no CI run.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.pr.outputs.url }}
    env:
      COMMIT: ${{ needs.build.outputs.commit }}
      VER: ${{ needs.build.outputs.version }}
      OLD: ${{ needs.build.outputs.old-version }}
      BASE: ${{ needs.route.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/rel

      # The org App's token (else ORG_BOT_TOKEN), so CI runs on the PR. The
      # action is this repository's, by path: a reusable workflow's `./`
      # would be the caller's checkout.
      - name: Bot token
        id: bot
        uses: swarm-routing/.github/.github/actions/bot-token@main
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}

      - name: Push bot/release and open or update the PR
        id: pr
        env:
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          WORKFLOW_GITHUB_TOKEN: ${{ github.token }}
        run: |
          R="$RUNNER_TEMP/rel"
          git fetch --quiet "$R/meta/release.bundle" "refs/heads/bot/release:refs/remotes/bundle/release"
          # The commit the build job recorded (a job output no step here can
          # change), one bump commit on the dispatched tip.
          test "$(git rev-parse refs/remotes/bundle/release)" = "$COMMIT"
          test "$(git rev-parse "${COMMIT}^")" = "$GITHUB_SHA"
          token="$BOT_TOKEN"
          if [ -z "$token" ]; then
            echo "::warning::no bot token: GITHUB_TOKEN pushes and opens the PR, so no CI runs on it (close and reopen it to start CI), and the org's Actions policy may refuse the PR"
            token="$WORKFLOW_GITHUB_TOKEN"
          fi
          auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "::add-mask::$auth"
          # Rebuilt on the default branch's tip each time: bot/release is the
          # bot's branch, so it is force-pushed.
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "${COMMIT}:refs/heads/bot/release"
          title="chore(release): bump version ${OLD} to ${VER}"
          body="$RUNNER_TEMP/body.md"
          {
            echo "Commitizen's bump to **v${VER}** from the commits on \`${BASE}\` since the last tag (\`CHANGELOG.md\` has the notes)."
            echo
            echo "**Merging this PR releases v${VER}.** The release workflow runs on the merge: it builds, attests and verifies the merged commit, tags it v${VER} and publishes the GitHub release (swarm-routing/.github \`reusable-release.yml\`)."
            echo
            echo "If \`${BASE}\` moves before the merge, dispatch the release workflow with mode \`bump\` again: it rebuilds this branch on the new tip."
            echo
            echo "Opened by run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          } > "$body"
          export GH_TOKEN="$token"
          n="$(gh pr list --repo "$GITHUB_REPOSITORY" --head bot/release --base "$BASE" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh pr edit "$n" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body" > /dev/null
            url="$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
            echo "Updated ${url}"
          else
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head bot/release --title "$title" --body-file "$body")"
            echo "Opened ${url}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "### ${title}: ${url}" >> "$GITHUB_STEP_SUMMARY"
