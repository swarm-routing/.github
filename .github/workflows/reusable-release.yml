name: Reusable release

# One release pipeline for every swarm-routing repository (#20), so no repo
# copies AntHocNet's release.yml and the copies never drift (ROADMAP
# "Releases": no org repository releases before this exists).
#
# A release takes two runs, because `main` takes no direct push (the org's
# `main` rulesets require a PR, and GITHUB_TOKEN cannot be a bypass actor);
# bots open PRs instead (AntHocNet#789 option B, the same design as
# AntHocNet#883):
#
# 1. mode `bump` (a workflow_dispatch). Commitizen bumps the version from the
#    Conventional-Commit history since the last tag (the first release is
#    v0.1.0), rewrites the caller's version files and writes CHANGELOG.md;
#    org_sync.py apply at the caller's .github/org-sync.lock commit then
#    renders its org-managed files again into the same commit (a first
#    release's CHANGELOG.md link in the README, #810). The `propose` job puts that commit on the fixed branch `bot/release`,
#    rebuilt on the default branch's tip (force-pushed), and opens or updates
#    the PR `chore(release): bump version A to B`. It pushes with the org
#    GitHub App's token (.github/actions/bot-token: BOT_APP_ID /
#    BOT_APP_PRIVATE_KEY, else ORG_BOT_TOKEN, else GITHUB_TOKEN), so CI runs
#    on the PR. Its body ends with `<!-- release-increment: X -->` (the
#    `increment` it was bumped with, `auto` when empty): when the default
#    branch moves while it is open, org-bot's `release-rebuild` task
#    dispatches the caller with mode `bump` and that increment again, which
#    rebuilds `bot/release` on the new tip (#430). Nothing is built, tagged
#    or published. Before that (bump and dry-run alike), the ladder gate
#    (#430): when the caller keeps a `docs/roadmap.md`, the bumped version
#    must have its row there (tools/release/release_check.py `ladder`, this
#    repository's at main), or the run fails before anything is proposed; no
#    ladder is a warning.
# 2. Merging that PR is the release (mode `release`, a push to the default
#    branch). The `route` job releases only a commit that is the merge of a
#    PR whose head is `<owner>/<repo>:bot/release` (GET
#    /repos/{repo}/commits/{sha}/pulls); any other push is a no-op. Then:
#      build    the caller's `build` command (default `make dist`, #11)
#               writes the release assets into `dist-dir` from the merged
#               commit; a CycloneDX SBOM of `sbom-path` and SHA256SUMS are
#               added. Read-only token: the caller's build never runs with
#               write access.
#      attest   signed SLSA build provenance for every asset (actions/attest,
#               keyless Sigstore with this workflow's identity), attached as
#               `<name>-<version>.intoto.jsonl` (the name Scorecard's
#               Signed-Releases recognises, AntHocNet#788) and as the
#               Sigstore bundle `<name>-<version>.sigstore.json`; the SBOM
#               attested against the assets; then the verify commands of the
#               release notes run here, and a release that does not verify
#               never goes out.
#      publish  (environment `release`, so where a repository protects it the
#               maintainer approves the run) tags the merged commit
#               v<version> and creates the GitHub release with every
#               asset and the notes (the version's CHANGELOG.md section, the
#               checksums, the verify commands). Tags are outside the branch
#               ruleset; the org App's token (else ORG_BOT_TOKEN, else
#               GITHUB_TOKEN) pushes the tag, because GitHub refuses a new
#               ref to GITHUB_TOKEN when the commit's .github/workflows/
#               differs from the default branch's tip (the branch moved
#               while the approval waited, ns3-tools v0.1.0). The release
#               itself is created with GITHUB_TOKEN (the tag exists by then).
#    Re-runs resume: a tag already on this commit is kept and the release is
#    completed; a tag on a different commit fails the run. Nothing in any
#    mode pushes to the default branch.
#      zenodo   (opt-in, `zenodo: true`, #232) archives the published release
#               on Zenodo with its own assets (every file of the release:
#               the build's, SHA256SUMS, the SBOM, the provenance) and the
#               metadata of the commit's CITATION.cff, through
#               tools/zenodo/zenodo.py `publish-release` (this repository's,
#               at main): the first version of a new concept for a first
#               release, else a new version of the repository's concept, so
#               the concept DOI is kept. Idempotent (a tag already on Zenodo
#               is reported, not archived again), retried with backoff on 429
#               and 5xx; the concept and version DOIs go to the job summary
#               and to the outputs `zenodo-concept` and `zenodo-doi`, and a
#               refusal fails the job. Then `zenodo.py record` checks the
#               commit's CITATION.cff `doi:`, `zenodo_concept` and README
#               DOI badge against the concept Zenodo returned: a missing one
#               (a first release made the concept) is a notice, and
#               org-bot's `zenodo` task opens the PR that writes it; a
#               different concept fails the job (the release and the
#               archive stand). It needs the ZENODO_TOKEN secret
#               (a Zenodo token with deposit:write and deposit:actions) and
#               runs in the `release` environment, so the token can live
#               there as an environment secret. Once a repository opts in,
#               turn Zenodo's GitHub integration off for it, or the release is
#               archived twice (CONTRIBUTING "Releases and DOIs"). A failed
#               zenodo job leaves the GitHub release as it is: re-run it, or
#               the daily zenodo.yml `sync` archives the release after its
#               grace period (a first release, with no concept yet: re-run
#               it, or zenodo.yml mode `create`). A repository whose
#               .github/org-sync.toml sets `zenodo = false` (#811: skills,
#               swarm-mcp, the site, .github) is never archived: leave
#               `zenodo` false there (publish-release refuses it).
#    The last step of `publish` tells the org site (`notify-site`, default
#    true, #388): once the release is published it sends `repository_dispatch`
#    event `org-release` to swarm-routing/swarm-routing.github.io with
#    client_payload {repository, tag, commit, previous_tag} (previous_tag: the
#    highest v* tag below this one, omitted for a first release), with the org
#    App's token (it needs Contents: write on the site repository; CONTRIBUTING
#    "The bot's GitHub App"). The site's release-sync.yml redeploys Pages and
#    proposes its hub-data and lock PRs. It is report-only: a failed dispatch
#    is a warning and a line in the job summary, never a failed release (the
#    site's weekly run catches a missed event). A private repository never
#    sends it, whatever `notify-site` says (the site lists public
#    repositories only, and its Actions logs are public);
#    release-selftest.yml passes it too, so no test sends an event.
#    In a dry run with `downstream-consumers` (a consumer list in the caller's
#    repository, #482), the `downstream` job builds and tests those consumers
#    on an ns3-dev image against this commit (tools/downstream/downstream.sh,
#    the script ns3-containers' image canary runs), report-only. Before the
#    build, a dry run's preflight (release_check.py `preflight`) fails when the
#    list does not name this repository by its current name, or the PyPI
#    project the caller publishes to names another repository.
#    The last job, `notify-org` (`notify-org`, default true, #479), sends the
#    same event to swarm-routing/.github once publish succeeded and the zenodo
#    and vcpkg jobs ended: org-bot.yml then runs the release aftercare for this
#    repository and moves its consumers' locks without waiting for an hourly
#    slot. Report-only, never from a private repository, `false` in the
#    self-test.
#      vcpkg    (opt-in, `vcpkg-ports: "<port> ..."`, #439) after the
#               release is published, opens or updates the port bump PR in
#               swarm-routing/vcpkg-registry for each named port: a checkout
#               of the registry's main, its own renderer
#               (`tools/port_bump.py bump --port P --tag vX.Y.Z`: the asset
#               named in the port's portfile, checked against this release's
#               SHA256SUMS, its SHA512, the version, the git-tree, versions/;
#               a port not in ports/ yet comes from templates/P/), then
#               `port_bump.py check`; the commit goes to the bot's branch
#               `bot/vcpkg-<repository>` (rebuilt on the registry's main,
#               force-pushed) and the PR `feat(ports): <ports> <version>`,
#               with auto-merge (squash) enabled on it (#461), so the
#               registry's merge queue lands it once its required checks
#               pass, with no hand step (a refusal is a warning, the release
#               stands). Never a direct push to the registry's main. It needs the org
#               App's token (GITHUB_TOKEN cannot write another repository): no
#               token fails the job with a notice, and the GitHub release
#               stands; re-run the job, or run the same command by hand. A
#               private repository never opens one.
#
# mode `dry-run` (or `dry-run: true`) bumps on the runner only, then builds,
# checksums, writes the SBOM, attests (real attestations, in the caller's
# attestation store, on the dry-run's assets) and verifies; nothing is
# pushed, proposed, tagged or published. The whole release (assets, notes,
# the bump commit as a git bundle) is the `artifact` output, kept 1 day.
#
# Release notes are never empty (#524). They are the version's CHANGELOG.md
# section; a release with no `feat` or `fix` commit gets only a heading from
# Commitizen. In a bump or dry run, empty rendered notes fall back to the
# version's section of the CHANGELOG.md the bump wrote; still empty, the run
# warns and the bump PR's body asks for the paragraph on that PR. A release
# whose merged CHANGELOG.md has nothing under `## vX.Y.Z` fails in the build
# job, before anything is tagged or published (tools/release/release_notes.py
# `notes`).
#
# mode `release-notes` (with `tag: vX.Y.Z`, #524) re-renders the notes of
# that existing release: the version's CHANGELOG.md section at the dispatched
# commit (the default branch, where a paragraph written after the release
# lives) replaces everything above `## Verify your download`, which is kept
# byte for byte (release_notes.py `rerender`, then read back). GITHUB_TOKEN
# (contents: write) edits the release; nothing is built, tagged or uploaded.
# An empty section fails the run and leaves the notes as they are.
#
# `mode` left empty (the default) picks from the event: a push releases
# (when it is a merged bump PR), anything else bumps; `dry-run: true` wins.
#
# `increment` (#211; bump and dry-run only) forces the bump's size instead of
# the one Commitizen reads from the commits: `PATCH`, `MINOR` or `MAJOR`,
# passed as `cz bump --increment <value>`. Empty (the default) leaves the
# bump exactly as before. Any other value fails the run in `route`, before
# anything is built or pushed. `MAJOR` is how a repository releases 1.0.0
# (CONTRIBUTING "Cutting a release": set `major_version_zero = false` first,
# then dispatch `bump` with `increment: MAJOR`). A repository with no `v*`
# tag yet releases 0.1.0 first whatever `increment` says, except `MAJOR`:
# then Commitizen bumps the configured version's major, so a config at any
# 0.x version releases 1.0.0 as its first release. A release run ignores the
# input (the merged bump PR already carries the version).
#
# `first-release-from-config` (#636; bump and dry-run only, default false):
# with no `v*` tag yet, Commitizen bumps from the version in the caller's
# config by the commits, as every later release does, instead of releasing
# 0.1.0. For a repository that already published versions without tags
# (swarm-routing/skills: plugin.json at 0.32.x), so its first tag continues
# that numbering. With a tag it changes nothing; `increment` still applies.
#
# The caller needs a Commitizen config (`[tool.commitizen]` in pyproject.toml,
# or .cz.toml) in `working-directory`, with `tag_format = "v$version"` and
# `major_version_zero = true` while 0.x (CONTRIBUTING "Releases and DOIs" has
# the minimal one). Commitizen is pinned here with hashes, so its version is
# this workflow's, not the caller's.
#
# Environment of the `build` command (bash, in `working-directory`):
#   RELEASE_VERSION  e.g. 0.1.0     RELEASE_TAG  e.g. v0.1.0
#   RELEASE_DIST     dist-dir, as given
# It may also test what it built (e.g. unpack a module tarball into an
# ns3-dev tree and run its suite); a non-zero exit stops the release before
# anything is signed or tagged. Assets are the regular files at the top of
# `dist-dir` (subdirectories are ignored); names this workflow writes
# (SHA256SUMS, *.intoto.jsonl, *.sigstore.json, *.cdx.json) are refused.
#
# Permissions. Each job declares its own; a called workflow can only keep or
# reduce the caller's grant, so the caller's job grants their union, dry run
# included (the attestations are real). The caller (CONTRIBUTING "Cutting a
# release" has it whole):
#
#   on:
#     workflow_dispatch:
#       inputs:
#         mode: { type: choice, options: [dry-run, bump, release-notes], default: dry-run }
#         increment: { type: choice, options: [auto, PATCH, MINOR, MAJOR], default: auto }  # no empty option (actionlint)
#         tag: { type: string, default: '' }   # release-notes: the release to re-render, vX.Y.Z
#     push:
#       branches: [main]
#   concurrency: { group: "release-${{ github.sha }}", cancel-in-progress: false }
#   jobs:
#     release:
#       if: "${{ github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore(release): bump version ') }}"
#       permissions: { contents: write, pull-requests: write, id-token: write, attestations: write }
#       uses: swarm-routing/.github/.github/workflows/reusable-release.yml@main
#       with:
#         mode: ${{ inputs.mode }}           # empty on push: release
#         increment: ${{ inputs.increment != 'auto' && inputs.increment || '' }}  # '' on push and for auto
#         tag: ${{ inputs.tag }}               # '' on push
#       secrets:
#         BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
#         BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
#         ORG_BOT_TOKEN: ${{ secrets.ORG_BOT_TOKEN }}
#
# To archive on Zenodo from the release job (#232), add `zenodo: true` under
# `with:` and `ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}` under `secrets:`.
#
# A repository that releases a C++ library packaged as a vcpkg port (#439)
# adds `vcpkg-ports: swarm-core` (its port names, space-separated) under
# `with:`; the bot secrets above are what the registry PR needs.
#
# An ns-3 repository also publishes its images at the same version (#107):
#
#     image:
#       needs: release
#       if: ${{ needs.release.outputs.mode == 'release' }}
#       permissions: { contents: read, packages: write, id-token: write, attestations: write }
#       uses: swarm-routing/.github/.github/workflows/reusable-ns3-image.yml@main
#       with:
#         modules: ara=ns3
#         tag: ${{ needs.release.outputs.tag }}
#
# Verify a release (the notes carry these with the real names):
#
#   sha256sum -c SHA256SUMS --ignore-missing
#   gh attestation verify <asset> --repo swarm-routing/<repo> \
#     --signer-workflow swarm-routing/.github/.github/workflows/reusable-release.yml
#   gh attestation verify <asset> --repo swarm-routing/<repo> --predicate-type https://cyclonedx.org/bom \
#     --signer-workflow swarm-routing/.github/.github/workflows/reusable-release.yml
#   gh attestation verify <asset> --repo swarm-routing/<repo> --bundle <name>-<version>.sigstore.json \
#     --signer-workflow swarm-routing/.github/.github/workflows/reusable-release.yml   # offline
#
# The signing identity is this reusable workflow (Fulcio's SAN is the called
# workflow's ref); the caller repository is in the certificate's
# workflow-repository extension.
on:
  workflow_call:
    inputs:
      build:
        description: "Bash command, run in working-directory after the bump, that writes the release assets into dist-dir"
        type: string
        default: 'make dist'
      dist-dir:
        description: "Directory (relative to working-directory) whose top-level files are the release assets"
        type: string
        default: 'dist'
      working-directory:
        description: "Directory holding the Commitizen config; the build runs here"
        type: string
        default: '.'
      sbom-path:
        description: "What the CycloneDX SBOM describes, relative to working-directory (default: the checkout at the release commit)"
        type: string
        default: '.'
      dry-run:
        description: "Bump, build, checksum, SBOM, attest and verify, but push, tag and publish nothing (the same as mode: dry-run)"
        type: boolean
        default: false
      mode:
        description: "bump (open or update the bump PR), release (publish the merged bump PR this commit is), dry-run, release-notes (re-render the notes of the existing release `tag` from CHANGELOG.md); empty: release on push, bump otherwise"
        type: string
        default: ''
      increment:
        description: "bump and dry-run: force the bump's size, PATCH, MINOR or MAJOR (cz bump --increment); empty: from the commits, as before. MAJOR with no v* tag releases the configured 0.x version's major (1.0.0) instead of 0.1.0"
        type: string
        default: ''
      first-release-from-config:
        description: "bump and dry-run, with no v* tag yet: bump from the Commitizen config's version by the commits (or `increment`) instead of releasing 0.1.0, for a repository whose versions predate its tags (#636). Default false: the first release is 0.1.0"
        type: boolean
        default: false
      zenodo:
        description: "After a release is published, archive it on Zenodo with its own assets (needs the ZENODO_TOKEN secret; turn Zenodo's GitHub integration off for the repository); refused for a repository whose .github/org-sync.toml sets zenodo = false"
        type: boolean
        default: false
      zenodo-sandbox:
        description: "With zenodo: archive on sandbox.zenodo.org instead (a sandbox token as ZENODO_TOKEN), to prove the path"
        type: boolean
        default: false
      notify-site:
        description: "After a release is published, send repository_dispatch `org-release` to swarm-routing/swarm-routing.github.io (report-only); false in tests; a private repository never sends it"
        type: boolean
        default: true
      downstream-consumers:
        description: "Dry run only (#482): a consumer list in the caller's repository (tools/downstream/downstream.sh's format, e.g. `.github/downstream.txt`); the dry run then builds and tests those consumers on `downstream-image` against this commit, which stands in for the release (the list's `downstream-self` line). Report-only. Empty (default): nothing"
        type: string
        default: ''
      downstream-self:
        description: "With downstream-consumers: the list's line whose checkout is this repository at the dry run's commit (default: the repository's name)"
        type: string
        default: ''
      downstream-image:
        description: "With downstream-consumers: the ns3-dev image the consumers build on (an Ubuntu debug image; another is skipped)"
        type: string
        default: 'ghcr.io/swarm-routing/ns3-dev:latest-debug'
      notify-org:
        description: "After a release is published (and its zenodo and vcpkg jobs ended), send repository_dispatch `org-release` to swarm-routing/.github, so org-bot runs its release aftercare and moves the consumers' locks at once (report-only, #479); false in tests; a private repository never sends it"
        type: boolean
        default: true
      vcpkg-ports:
        description: "Space-separated swarm-routing/vcpkg-registry ports this release bumps (e.g. `swarm-core`); after publish the org bot opens or updates the registry PR rendered by its tools/port_bump.py. Empty (default): nothing"
        type: string
        default: ''
      tag:
        description: "mode release-notes only (#524): the existing release (vX.Y.Z) whose notes are re-rendered from the version's CHANGELOG.md section at the dispatched commit; the Verify your download block is kept byte for byte"
        type: string
        default: ''
    secrets:
      BOT_APP_ID:
        description: "The org GitHub App's ID, for the bump PR's and the release tag's token (.github/actions/bot-token)"
        required: false
      BOT_APP_PRIVATE_KEY:
        description: "The org GitHub App's private key"
        required: false
      ORG_BOT_TOKEN:
        description: "Fallback token for the bump PR and the release tag when the App is not configured"
        required: false
      ZENODO_TOKEN:
        description: "With zenodo: a Zenodo token with deposit:write and deposit:actions (a secret of the `release` environment, where it is one, takes its place)"
        required: false
    outputs:
      mode:
        description: "What the run did: bump, release, dry-run, release-notes, or none (a push that is not a merged bump PR)"
        value: ${{ jobs.route.outputs.mode }}
      version:
        description: "The released (or, in bump mode, proposed) version, e.g. 0.1.0"
        value: ${{ jobs.build.outputs.version }}
      tag:
        description: "The release tag, e.g. v0.1.0"
        value: ${{ jobs.build.outputs.tag }}
      artifact:
        description: "Artifact holding release/ (every asset) and meta/ (notes.md; release.bundle with the bump commit in bump and dry-run modes)"
        value: ${{ jobs.build.outputs.artifact }}
      pull-request:
        description: "In bump mode, the URL of the bump PR"
        value: ${{ jobs.propose.outputs.url }}
      zenodo-concept:
        description: "With zenodo: the Zenodo concept record id the release was archived in"
        value: ${{ jobs.zenodo.outputs.concept }}
      zenodo-doi:
        description: "With zenodo: the release's version DOI on Zenodo"
        value: ${{ jobs.zenodo.outputs.doi }}

# None at the top: every job declares its own, write scopes only where it
# writes (OpenSSF Scorecard Token-Permissions, #716).
permissions: {}

jobs:
  # Which mode this run is, and, for a release, that the commit is the merge
  # of the bump PR. The commit title alone is not enough: any squash-merged
  # PR could carry it.
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # which PR the pushed commit came from
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      version: ${{ steps.route.outputs.version }}
      base: ${{ steps.route.outputs.base }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - name: Mode
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          MODE_IN: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry-run }}
          INCREMENT: ${{ inputs.increment }}
          EVENT: ${{ github.event_name }}
          TAG_IN: ${{ inputs.tag }}
        run: |
          case "$INCREMENT" in
            ''|PATCH|MINOR|MAJOR) ;;
            *) echo "::error::increment '$INCREMENT': use PATCH, MINOR, MAJOR or leave it empty"; exit 1 ;;
          esac
          mode="$MODE_IN"
          if [ "$DRY_RUN" = true ]; then
            if [ -n "$mode" ] && [ "$mode" != dry-run ]; then
              echo "::error::dry-run: true and mode: $mode disagree"; exit 1
            fi
            mode=dry-run
          fi
          if [ -z "$mode" ]; then
            if [ "$EVENT" = push ]; then mode=release; else mode=bump; fi
          fi
          case "$mode" in
            bump|release|dry-run|release-notes) ;;
            *) echo "::error::mode '$mode': use bump, release, dry-run or release-notes"; exit 1 ;;
          esac
          if [ "$mode" = release-notes ]; then
            if ! [[ "$TAG_IN" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::mode release-notes needs tag: vX.Y.Z (got '${TAG_IN}')"; exit 1
            fi
          elif [ -n "$TAG_IN" ]; then
            echo "::notice::tag: $TAG_IN applies to mode release-notes only; a $mode ignores it"
          fi
          base="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          if [ "$mode" != dry-run ] && [ "$GITHUB_REF" != "refs/heads/${base}" ]; then
            echo "::error::a $mode runs on the default branch ${base}; this run is on ${GITHUB_REF}"
            exit 1
          fi
          if [ "$mode" = release ]; then
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > "$RUNNER_TEMP/pulls.json"
            pr="$(jq -c --arg sha "$GITHUB_SHA" --arg base "$base" \
              '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == $base)] | .[0] // empty' \
              "$RUNNER_TEMP/pulls.json")"
            from="$(jq -r '"\(.head.repo.full_name):\(.head.ref)"' <<< "${pr:-null}")"
            if [ -z "$pr" ] || [ "$from" != "${GITHUB_REPOSITORY}:bot/release" ]; then
              msg="${GITHUB_SHA} is not the merge of a ${GITHUB_REPOSITORY}:bot/release PR (came from '${pr:+$from}'); nothing to release"
              # Every push to the default branch may reach here: only a
              # dispatch that asked for a release is an error.
              if [ "$EVENT" = push ]; then echo "::notice::$msg"; mode=none; else echo "::error::$msg"; exit 1; fi
            else
              title="$(jq -r .title <<< "$pr")"
              ver="$(sed -n -E 's/^chore\(release\): bump version .+ to ([^ ]+)$/\1/p' <<< "$title")"
              if [ -z "$ver" ]; then
                echo "::error::the merged bump PR's title '$title' names no version (chore(release): bump version A to B)"; exit 1
              fi
              echo "version=${ver}" >> "$GITHUB_OUTPUT"
              echo "Release commit ${GITHUB_SHA}: $(jq -r .html_url <<< "$pr") (${title})"
            fi
          fi
          if [ -n "$INCREMENT" ] && [ "$mode" != bump ] && [ "$mode" != dry-run ]; then
            echo "::notice::increment: $INCREMENT applies to bump and dry-run only; a $mode ignores it"
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "mode: ${mode}"

  # bump and dry-run: Commitizen's bump on the runner. release: the merged
  # commit's version, and its CHANGELOG.md section as the notes. Then (not in
  # bump mode) the caller's build, the SBOM and the checksums.
  build:
    needs: route
    if: ${{ needs.route.outputs.mode != 'none' && needs.route.outputs.mode != 'release-notes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      old-version: ${{ steps.bump.outputs.old-version }}
      tag: ${{ steps.bump.outputs.tag }}
      name: ${{ steps.bump.outputs.name }}
      artifact: ${{ steps.bump.outputs.artifact }}
      commit: ${{ steps.bump.outputs.commit }}
      notes-empty: ${{ steps.bump.outputs.notes-empty }}
    env:
      WD: ${{ inputs.working-directory }}
      DIST_IN: ${{ inputs.dist-dir }}
      MODE: ${{ needs.route.outputs.mode }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history and its tags, for Commitizen
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'   # the wheels hashed below are cp312 x86_64

      - name: Install Commitizen (pinned with hashes)
        # The set AntHocNet's requirements/commitizen.txt resolves (uv pip
        # compile --generate-hashes), reduced to the wheel each package
        # installs on this runner; every hash below is one of that file's.
        timeout-minutes: 10
        run: |
          req="$RUNNER_TEMP/commitizen.txt"
          cat > "$req" <<'EOF'
          argcomplete==3.7.2 --hash=sha256:6029205678bdd9c1c728a155f5f9ecf5812393f969eef58807641a2bc2aa5b19
          charset-normalizer==3.5.2 --hash=sha256:3d31298449090ab8d47b7b1b2a555ff73cac7ed438a08b7ac160980c7ebed649
          colorama==0.4.6 --hash=sha256:4f1d9991f5acc0ca119f9d443620b77f9d6b33703e51011c16baf57afb285fc6
          commitizen==4.19.3 --hash=sha256:d625e038cce66d92da20d24c2c366d410caca43966eba8ec036debf48fda2a68
          decli==0.6.3 --hash=sha256:5152347c7bb8e3114ad65db719e5709b28d7f7f45bdb709f70167925e55640f3
          deprecated==1.3.1 --hash=sha256:597bfef186b6f60181535a29fbe44865ce137a5079f295b479886c82729d5f3f
          jinja2==3.1.6 --hash=sha256:85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
          markupsafe==3.0.4 --hash=sha256:8e124f974786f831d6043728e38296969d3579db8896fe004682f5758e613581
          packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          prompt-toolkit==3.0.53 --hash=sha256:01c0891d7f9237d5e339f7d3e42cdae80b7534abb1c7c0e3352efba6231492f2
          pyyaml==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc
          questionary==2.1.1 --hash=sha256:a51af13f345f1cdea62347589fbb6df3b290306ab8930713bfae4d475a7d4a59
          termcolor==3.3.0 --hash=sha256:cf642efadaf0a8ebbbf4bc7a31cec2f9b5f21a9f726f4ccbb08192c9c26f43a5
          tomlkit==0.15.2 --hash=sha256:05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437
          wcwidth==0.9.4 --hash=sha256:b185c8b927b23af2721be1783499d1cfa5c028b098b0858951b4ae224477f1c2
          wrapt==2.5.2 --hash=sha256:092472b7b1494deef40dac5e9f6295013a9d51b112b5fbc4350f64dc2574e46a
          EOF
          python -m pip install --quiet --only-binary=:all: --require-hashes -r "$req"
          cz version

      # The org's release tools (tools/release/: release_check.py for the
      # ladder gate and the preflight, release_notes.py for the notes;
      # tools/downstream/downstream.sh, the preflight's list check), this repository's at
      # main, read into the runner's temp directory (never into the caller's
      # checkout, which the build and the SBOM read); when the caller is this
      # repository (release-selftest.yml), its own checkout's.
      - name: Org release tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in release/release_check.py release/release_notes.py downstream/downstream.sh; do
            if [ "$GITHUB_REPOSITORY" = swarm-routing/.github ]; then
              cp "tools/$t" "$RUNNER_TEMP/${t#*/}"
            else
              gh api -H 'Accept: application/vnd.github.raw' \
                "repos/swarm-routing/.github/contents/tools/${t}?ref=main" > "$RUNNER_TEMP/${t#*/}"
            fi
          done

      - name: Version (bump and dry-run, on the runner only; release, the merged commit's)
        id: bump
        env:
          PR_VERSION: ${{ needs.route.outputs.version }}
          INCREMENT: ${{ inputs.increment }}
          FROM_CONFIG: ${{ inputs.first-release-from-config && 'config' || '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT="$RUNNER_TEMP/rel"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          cd "$WD"
          if ! cz version --project > /dev/null 2>&1; then
            echo "::error::no Commitizen config in '$WD' (CONTRIBUTING.md, Releases and DOIs)"
            exit 1
          fi
          mkdir -p "$OUT/release" "$OUT/meta"
          old="$(cz version --project)"
          if [ "$MODE" = release ]; then
            # The merged bump PR already carries the version and the changelog.
            ver="$old"
            tag="v${ver}"
            if [ "$ver" != "$PR_VERSION" ]; then
              echo "::error::the merged bump PR proposed ${PR_VERSION}, but this commit's version is ${ver}"
              exit 1
            fi
            # A tag on this commit is a re-run after a failed publish: build
            # again and let publish resume. A tag elsewhere: the version is taken.
            if tagged="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")"; then
              if [ "$tagged" != "$GITHUB_SHA" ]; then
                echo "::error::${tag} already tags ${tagged}, not ${GITHUB_SHA}"
                exit 1
              fi
              echo "::notice::${tag} already tags ${GITHUB_SHA}: a re-run, publish resumes"
            fi
            # The notes: this version's section of the changelog the bump PR
            # merged (the commit this run tags). Empty notes never ship
            # (#524): a section with nothing under its heading (a release with
            # no feat or fix, whose paragraph was not written on the bump PR)
            # fails here, before anything is built, tagged or published.
            : > "$RUNNER_TEMP/rendered.md"
            if ! python3 -I "$RUNNER_TEMP/release_notes.py" notes --rendered "$RUNNER_TEMP/rendered.md" \
                 --changelog CHANGELOG.md --tag "$tag" --out "$OUT/meta/changes.md" --require-body; then
              echo "::error::${WD}/CHANGELOG.md at ${GITHUB_SHA} has no paragraph under '## ${tag}': a release with empty notes is never published. Nothing was tagged or published (CONTRIBUTING \"Cutting a release\": the paragraph is written on the bump PR)"
              exit 1
            fi
            echo "notes-empty=false" >> "$GITHUB_OUTPUT"
            commit="$GITHUB_SHA"
          else
            # The first release is v0.1.0 (ROADMAP "Releases", .github#81); after
            # that Commitizen computes the next version from the commits, or
            # takes the size `increment` forces (#211). With no tag and
            # increment MAJOR, the first release is the configured version's
            # next major (0.x -> 1.0.0), not 0.1.0. With
            # first-release-from-config, the first release is bumped from the
            # configured version like any later one (#636).
            bump_args=()
            if [ -z "$(git tag --list 'v[0-9]*')" ] && [ -n "$FROM_CONFIG" ]; then
              echo "::notice::no v* tag yet: first-release-from-config, bumping from $(cz version --project)"
              if [ -n "$INCREMENT" ]; then
                bump_args=(--increment "$INCREMENT")
              fi
            elif [ -z "$(git tag --list 'v[0-9]*')" ] && [ "$INCREMENT" != MAJOR ]; then
              bump_args=(0.1.0)
              if [ -n "$INCREMENT" ]; then
                echo "::notice::no v* tag yet: the first release is 0.1.0, increment $INCREMENT is not used"
              fi
            elif [ -n "$INCREMENT" ]; then
              bump_args=(--increment "$INCREMENT")
            fi
            rc=0
            cz bump --yes --changelog --changelog-to-stdout --git-output-to-stderr "${bump_args[@]}" \
              > "$OUT/meta/changes.md" || rc=$?
            if [ "$rc" -ne 0 ]; then
              # 3 = no commits since the last tag, 21 = none that bumps (docs, ci, ...)
              echo "::error::cz bump exited $rc: nothing to release since the last tag, or the bump failed (log above)"
              exit "$rc"
            fi
            ver="$(cz version --project)"
            tag="v${ver}"
            # Rendered notes with nothing under the heading (no feat or fix,
            # #524): the version's section of the CHANGELOG.md the bump wrote,
            # else they stay empty, and then the bump PR says so and a
            # release from it fails before publishing.
            src="$(python3 -I "$RUNNER_TEMP/release_notes.py" notes --rendered "$OUT/meta/changes.md" \
                     --changelog CHANGELOG.md --tag "$tag" --out "$OUT/meta/changes.md")"
            echo "$src"
            if [ "$src" = "notes: empty" ]; then
              echo "notes-empty=true" >> "$GITHUB_OUTPUT"
              echo "::warning::${tag} has empty notes (no feat or fix since the last tag): write its paragraph under '## ${tag}' in CHANGELOG.md on the bump PR before merging, or the release fails before publishing (#524)"
            else
              echo "notes-empty=false" >> "$GITHUB_OUTPUT"
            fi
            # org-sync after the bump (#810): a first release creates
            # CHANGELOG.md, which the org-managed README "Releases & citing"
            # then links, so `check / org-sync` on the bump PR would fail.
            # The caller's .github/org-sync.lock (the working directory's,
            # else the repository root's) names the swarm-routing/.github
            # commit its files were rendered from; org_sync.py apply at that
            # commit (a blobless clone in the runner's temp directory, never
            # in the caller's checkout) renders them again with the bump's
            # files, and any change goes into the bump commit. The pin never
            # moves here: an apply that would move the lock, or that meets a
            # conflict, is undone with a warning and the bump stays as
            # Commitizen made it. No lock: nothing to do.
            sync_dir=""
            for d in . "$GITHUB_WORKSPACE"; do
              if [ -f "$d/.github/org-sync.lock" ]; then sync_dir="$(cd "$d" && pwd)"; break; fi
            done
            if [ -n "$sync_dir" ]; then
              pin="$(sed -nE 's/^commit = "([0-9a-f]{40})"[[:space:]]*$/\1/p' "$sync_dir/.github/org-sync.lock")"
              if [ -z "$pin" ]; then
                echo "::warning::${sync_dir#"$GITHUB_WORKSPACE"/}/.github/org-sync.lock names no commit: org-sync not run after the bump"
              else
                org="$RUNNER_TEMP/org-sync-templates"
                git clone -q --filter=blob:none --no-checkout https://github.com/swarm-routing/.github "$org"
                git -C "$org" -c advice.detachedHead=false checkout -q --detach "$pin"
                lock_before="$(sha256sum "$sync_dir/.github/org-sync.lock")"
                rc=0
                python3 -I "$org/tools/org-sync/org_sync.py" apply "$sync_dir" || rc=$?
                if [ "$rc" -ne 0 ] || [ "$(sha256sum "$sync_dir/.github/org-sync.lock")" != "$lock_before" ]; then
                  echo "::warning::org_sync.py apply at ${pin:0:12} after the bump exited ${rc} or moved .github/org-sync.lock: undone; if check / org-sync fails on the bump PR, run it there by hand (#810)"
                  git reset -q --hard HEAD
                  git clean -fdq
                elif [ -n "$(git status --porcelain)" ]; then
                  git status --short
                  git add -A
                  git commit -q --amend --no-edit
                  git tag -f "$tag" HEAD > /dev/null
                  echo "::notice::org-sync at ${pin:0:12} after the bump: its changes are in the bump commit (#810)"
                else
                  echo "org-sync at ${pin:0:12} after the bump: nothing to change"
                fi
              fi
            fi
            if [ "$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Commitizen did not tag HEAD as ${tag}: set tag_format = \"v\$version\""
              exit 1
            fi
            test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
            commit="$(git rev-parse HEAD)"
            if [ "$MODE" = bump ]; then
              # The tag goes on the merged commit (publish), never on this one;
              # propose pushes this commit as bot/release.
              git tag -d "$tag" > /dev/null
              git update-ref refs/heads/bot/release "$commit"
              git bundle create "$OUT/meta/release.bundle" refs/heads/bot/release "^${GITHUB_SHA}"
            else
              git bundle create "$OUT/meta/release.bundle" "refs/tags/${tag}" "^${GITHUB_SHA}"
            fi
          fi
          # Asset stem: the repository name, lowercase, leading dots dropped.
          name="${GITHUB_REPOSITORY#*/}"; name="${name#.}"; name="${name,,}"
          {
            echo "version=${ver}"
            echo "old-version=${old}"
            echo "tag=${tag}"
            echo "name=${name}"
            # A forced increment (or first-release-from-config) names its own
            # artifact, so two calls in one run (release-selftest.yml's legs)
            # do not collide.
            echo "artifact=release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}${INCREMENT:+-${INCREMENT,,}}${FROM_CONFIG:+-${FROM_CONFIG}}"
            # Fixed before anything else runs: propose pushes only this commit,
            # whatever a later step does to the bundle on disk.
            echo "commit=${commit}"
          } >> "$GITHUB_OUTPUT"
          { echo "RELEASE_VERSION=${ver}"; echo "RELEASE_TAG=${tag}"; echo "NAME=${name}"; } >> "$GITHUB_ENV"
          git log --oneline -1
          cat "$OUT/meta/changes.md"

      # The ladder gate (#430): a bump or dry-run of a version the repository's
      # docs/roadmap.md has no row for fails here, before anything is built or
      # proposed. No ladder is a warning (the org ROADMAP's release train is
      # the scope). The check is tools/release/release_check.py `ladder`, this
      # repository's at main, read into the runner's temp directory (never
      # into the caller's checkout, which the build and the SBOM read); when
      # the caller is this repository (release-selftest.yml), its own checkout's.
      - name: Ladder gate (docs/roadmap.md has the version)
        if: ${{ needs.route.outputs.mode != 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail   # the checker's exit 1 must survive the tee
          tool="$RUNNER_TEMP/release_check.py"   # the org release tools step's
          if ! python3 -I "$tool" ladder . --version "$RELEASE_VERSION" | tee "$RUNNER_TEMP/ladder.txt"; then
            echo "::error::docs/roadmap.md has no row for ${RELEASE_TAG}: add the version and its exit criteria to the ladder in a PR, then dispatch again (CONTRIBUTING \"Cutting a release\", #430)"
            exit 1
          fi
          if grep -q '^WARN' "$RUNNER_TEMP/ladder.txt"; then
            echo "::warning::$(sed -n 's/^WARN *//p' "$RUNNER_TEMP/ladder.txt" | head -1)"
          fi

      # The preflight (release_check.py `preflight`, the sim-tools v1.1.3 dry
      # runs): the repository's current name (the API follows renames), the
      # downstream list's own line (the downstream job's DOWNSTREAM_LOCAL), and
      # the PyPI project the caller publishes to. A dry run only, before the
      # build: a definite mismatch fails it here instead of in the downstream
      # or pypi job; what cannot be read, and the trusted publisher PyPI does
      # not show, are warnings.
      - name: Preflight (the repository's name, its downstream line, its PyPI project)
        if: ${{ needs.route.outputs.mode == 'dry-run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ inputs.downstream-consumers }}
          SELF: ${{ inputs.downstream-self || github.event.repository.name }}
        run: |
          set -o pipefail   # the checker's exit 1 must survive the tee
          args=(preflight . --repo "$GITHUB_REPOSITORY")
          if [ -n "$LIST" ]; then args+=(--downstream-consumers "$LIST" --downstream-self "$SELF"); fi
          if ! python3 -I "$RUNNER_TEMP/release_check.py" "${args[@]}" | tee "$RUNNER_TEMP/preflight.txt"; then
            echo "::error::$(sed -n 's/^FAIL *//p' "$RUNNER_TEMP/preflight.txt" | head -1)"
            exit 1
          fi
          sed -n 's/^\(WARN\|NEXT\) *\(.*\)/::warning::\2/p' "$RUNNER_TEMP/preflight.txt"

      - name: Build the assets (the caller's command)
        if: ${{ needs.route.outputs.mode != 'bump' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD: ${{ inputs.build }}
          RELEASE_DIST: ${{ inputs.dist-dir }}
        run: |
          bash -eo pipefail -c "$BUILD"

      - name: Collect the assets
        if: ${{ needs.route.outputs.mode != 'bump' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ ! -d "$DIST_IN" ]; then
            echo "::error::the build wrote no '$DIST_IN' directory"
            exit 1
          fi
          n=0
          for f in "$DIST_IN"/* "$DIST_IN"/.[!.]*; do
            [ -e "$f" ] || continue
            b="$(basename "$f")"
            if [ ! -f "$f" ] || [ -L "$f" ]; then echo "::notice::not an asset (not a regular file): $b"; continue; fi
            case "$b" in
              SHA256SUMS|*.intoto.jsonl|*.sigstore.json|*.cdx.json)
                echo "::error::'$b' is a name this workflow writes; rename it"; exit 1 ;;
            esac
            cp -p "$f" "$OUT/release/$b"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then echo "::error::'$DIST_IN' holds no files"; exit 1; fi
          ls -l "$OUT/release"

      - name: CycloneDX SBOM
        if: ${{ needs.route.outputs.mode != 'bump' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.sbom-path }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/rel/release/${{ steps.bump.outputs.name }}-${{ steps.bump.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SHA256SUMS
        if: ${{ needs.route.outputs.mode != 'bump' }}
        run: |
          sbom="$OUT/release/${NAME}-${RELEASE_VERSION}.cdx.json"
          test "$(jq -r .bomFormat "$sbom")" = CycloneDX
          cd "$OUT/release"
          # Bare names, so `sha256sum -c` works in the directory of the download.
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > "$OUT/SHA256SUMS"
          mv "$OUT/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bump.outputs.artifact }}
          path: |
            ${{ runner.temp }}/rel/release
            ${{ runner.temp }}/rel/meta
          retention-days: 1
          if-no-files-found: error

  attest:
    needs: [route, build]
    if: ${{ needs.route.outputs.mode == 'release' || needs.route.outputs.mode == 'dry-run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write       # keyless Sigstore signing
      attestations: write   # store the provenance and SBOM attestations
    env:
      VER: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      NAME: ${{ needs.build.outputs.name }}
      SIGNER: swarm-routing/.github/.github/workflows/reusable-release.yml
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/rel

      - name: Subjects
        id: subjects
        run: |
          REL="$RUNNER_TEMP/rel/release"
          { echo "REL=$REL"; echo "META=$RUNNER_TEMP/rel/meta"; } >> "$GITHUB_ENV"
          cd "$REL"
          sha256sum -c SHA256SUMS
          sbom="${NAME}-${VER}.cdx.json"
          # Provenance covers every file in SHA256SUMS and SHA256SUMS itself;
          # the SBOM is attested against the caller's assets.
          {
            echo "all<<EOF"
            echo "$REL/SHA256SUMS"
            cut -d' ' -f3- SHA256SUMS | sed "s|^|$REL/|"
            echo "EOF"
            echo "assets<<EOF"
            cut -d' ' -f3- SHA256SUMS | grep -vxF "$sbom" | sed "s|^|$REL/|"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: SLSA build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.all }}

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.assets }}
          sbom-path: ${{ runner.temp }}/rel/release/${{ needs.build.outputs.name }}-${{ needs.build.outputs.version }}.cdx.json

      - name: Provenance files
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$REL/${NAME}-${VER}.sigstore.json"
          # The bundle's signed DSSE envelope on one line, the format
          # slsa-github-generator publishes, under the name Scorecard's
          # Signed-Releases looks for (AntHocNet#788).
          jq -c '.dsseEnvelope' "$BUNDLE" > "$REL/${NAME}-${VER}.intoto.jsonl"
          test "$(jq -r '.payloadType' "$REL/${NAME}-${VER}.intoto.jsonl")" = "application/vnd.in-toto+json"
          test "$(wc -l < "$REL/${NAME}-${VER}.intoto.jsonl")" -eq 1
          jq -r '.payload | @base64d | fromjson | .predicateType' "$REL/${NAME}-${VER}.intoto.jsonl"

      - name: Release notes, with the verify commands
        env:
          REPO: ${{ github.repository }}
        run: |
          first="$(cut -d' ' -f3- "$REL/SHA256SUMS" | grep -vxF "${NAME}-${VER}.cdx.json" | head -n1)"
          {
            cat "$META/changes.md"
            echo
            echo "## Verify your download"
            echo
            echo "Checksums (also the \`SHA256SUMS\` asset):"
            echo
            echo '```'
            cat "$REL/SHA256SUMS"
            echo '```'
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing   # in the directory you downloaded to"
            echo '```'
            echo
            echo "Every asset carries signed SLSA build provenance (\`${NAME}-${VER}.intoto.jsonl\`, and the Sigstore bundle \`${NAME}-${VER}.sigstore.json\`) and is described by a CycloneDX SBOM (\`${NAME}-${VER}.cdx.json\`). With the GitHub CLI, for any asset, e.g. \`${first}\`:"
            echo
            echo '```'
            echo "gh attestation verify ${first} --repo ${REPO} --signer-workflow ${SIGNER}"
            echo "gh attestation verify ${first} --repo ${REPO} --predicate-type https://cyclonedx.org/bom --signer-workflow ${SIGNER}"
            echo "gh attestation verify ${first} --repo ${REPO} --bundle ${NAME}-${VER}.sigstore.json --signer-workflow ${SIGNER}   # offline"
            echo '```'
            echo
            echo "Built and signed by [\`reusable-release.yml\`](https://github.com/swarm-routing/.github/blob/main/.github/workflows/reusable-release.yml), run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID})."
          } > "$META/notes.md"
          cat "$META/notes.md"

      - name: Verify, with the commands of the notes
        # A release whose checksums or attestations do not verify never goes out.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd "$REL"
          sha256sum -c SHA256SUMS --ignore-missing
          # gh prints nothing when not on a terminal: --format json, and a line
          # per check, so the log shows what was verified.
          ok() { jq -e -r --arg f "$1" --arg w "$2" 'if length > 0 then "verified \($w): \($f)" else empty end'; }
          # Every check names the signer: without --signer-workflow gh expects it
          # in --repo, which holds only when the caller is this repository.
          mapfile -t files < <(cut -d' ' -f3- SHA256SUMS)
          for f in "${files[@]}" SHA256SUMS; do
            gh attestation verify "$f" --repo "$REPO" --signer-workflow "$SIGNER" --format json < /dev/null | ok "$f" provenance
            gh attestation verify "$f" --repo "$REPO" --bundle "${NAME}-${VER}.sigstore.json" --signer-workflow "$SIGNER" --format json < /dev/null | ok "$f" "provenance (offline bundle)"
          done
          for f in "${files[@]}"; do
            [ "$f" = "${NAME}-${VER}.cdx.json" ] && continue
            gh attestation verify "$f" --repo "$REPO" --predicate-type https://cyclonedx.org/bom --signer-workflow "$SIGNER" --format json < /dev/null | ok "$f" sbom
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: |
            ${{ runner.temp }}/rel/release
            ${{ runner.temp }}/rel/meta
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Summary
        env:
          MODE: ${{ needs.route.outputs.mode }}
        run: |
          {
            echo "### ${TAG}$( [ "$MODE" = dry-run ] && echo ' (dry run: nothing pushed or published)')"
            echo
            echo '```'
            find "$REL" -maxdepth 1 -type f -printf '%s\t%f\n' | LC_ALL=C sort -k2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [route, build, attest]
    if: ${{ needs.route.outputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The `release` environment: where the repository enables it
    # (`[settings] release_environment = true`, tools/repo-settings), the
    # maintainer approves this job before anything is tagged or published.
    environment: release
    # One publish per commit at a time, never cancelled: a re-run waits for
    # the run before it, then resumes from what that one left.
    concurrency:
      group: release-publish-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write   # push the tag, create the release
    env:
      TAG: ${{ needs.build.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      # It runs no code of the caller's: the merged commit's checkout (for
      # the tag) and the built files only. No persisted GITHUB_TOKEN: the
      # tag step authenticates git itself, with the token it picks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/rel

      # The org App's token (else ORG_BOT_TOKEN) pushes the tag. For a new
      # ref GitHub checks the pushed commit's workflow files against the
      # default branch, and a release commit whose `.github/workflows/`
      # differs from the branch's tip (main moved while the `release`
      # environment waited for approval) is refused to GITHUB_TOKEN, which
      # can never hold the `workflows` permission; the App holds it (#21).
      # The action is this repository's, by path: a reusable workflow's `./`
      # would be the caller's checkout.
      - name: Bot token
        id: bot
        uses: swarm-routing/.github/.github/actions/bot-token@eb4464f60e7f9b2c5ef5f70c2d1c0f8119e0eddf # main@2026-11-24
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}

      - name: Tag the merged commit
        # Tags are outside the branch ruleset (the release-tags ruleset only
        # stops a v* tag being moved or deleted), so the bot token (else
        # GITHUB_TOKEN) pushes it. Idempotent: a tag already on this commit
        # is kept (a re-run resumes); one on another commit fails.
        env:
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_NAME: ${{ steps.bot.outputs.git-name }}
          BOT_EMAIL: ${{ steps.bot.outputs.git-email }}
          WORKFLOW_GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$COMMIT" = "$GITHUB_SHA"
          token="$BOT_TOKEN"
          if [ -z "$token" ]; then
            echo "::warning::no bot token: GITHUB_TOKEN pushes the tag, which GitHub refuses when the commit's .github/workflows/ differs from the default branch's tip"
            token="$WORKFLOW_GITHUB_TOKEN"
          fi
          auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "::add-mask::$auth"
          git config "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: basic $auth"
          # The peeled line (^{}) of an annotated tag sorts last; a
          # lightweight tag has only its own line.
          tagged="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n 1 | cut -f1)"
          if [ -n "$tagged" ]; then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::${TAG} already tags ${tagged}, not ${GITHUB_SHA}"
              exit 1
            fi
            echo "${TAG} already tags ${GITHUB_SHA}; resuming."
            exit 0
          fi
          git config user.name  "${BOT_NAME:-github-actions[bot]}"
          git config user.email "${BOT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

      # A signal only (#226): Zenodo archives the release with the
      # maintainer's OAuth token, whose quota these tokens do not share, so a
      # low number here is a hint, never a reason to stop. `rate_limit` costs
      # no quota.
      - name: API quota before publishing
        continue-on-error: true
        timeout-minutes: 2
        env:
          RELEASE_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          ZENODO_PUSH: ${{ inputs.zenodo }}
        run: |
          {
            echo "### GitHub API quota before publishing ${TAG}"
            echo
            echo "| token | core remaining / limit | resets (UTC) |"
            echo "|---|---|---|"
            for which in RELEASE_TOKEN BOT_TOKEN; do
              tok="${!which}"
              [ -n "$tok" ] || continue
              row=$(GH_TOKEN="$tok" gh api rate_limit \
                --jq '.resources.core | "\(.remaining) / \(.limit) | \(.reset | todate)"' 2>/dev/null) \
                || row="unavailable | -"
              echo "| ${which,,} | ${row} |"
            done
            echo
            if [ "$ZENODO_PUSH" = true ]; then
              echo "The \`zenodo\` job archives this release from the workflow, with ZENODO_TOKEN; Zenodo reads nothing from GitHub."
            elif python3 -I -c 'import sys, tomllib; sys.exit(tomllib.load(open(".github/org-sync.toml", "rb")).get("zenodo", True) is not False)' 2>/dev/null; then
              echo "No Zenodo archive: \`zenodo = false\` in .github/org-sync.toml (swarm-routing/.github#811); this release stays a GitHub release."
            else
              echo "Zenodo fetches the release with the maintainer's own quota, not these (CONTRIBUTING \"When Zenodo fails a release\")."
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$RUNNER_TEMP/rel"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run after a release was created: complete its assets and notes.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$R"/release/*
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$R/meta/notes.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes-file "$R/meta/notes.md" "$R"/release/*
          fi
          echo "Published ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # The org site follows the release (#388): its release-sync.yml listens
      # for `org-release` (swarm-routing/swarm-routing.github.io#120). The bot
      # token, never GITHUB_TOKEN, which reaches this repository only; the App
      # needs Contents: write on the site. Report-only: a failed dispatch is a
      # warning and a summary line, and the site's weekly run catches it.
      - name: Tell the org site
        # never from a private repository, whatever notify-site says: the site's
        # Actions logs are public, and the event names the repository
        if: ${{ inputs.notify-site && !github.event.repository.private }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          SITE: swarm-routing/swarm-routing.github.io
        run: |
          warn() {
            echo "::warning::$1"
            echo "Site not notified: $1 (the site's weekly release-sync run catches it)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ -n "$GH_TOKEN" ] || warn "no bot token (BOT_APP_ID / BOT_APP_PRIVATE_KEY, ORG_BOT_TOKEN unset), so no org-release event for ${TAG}"
          # The previous release: the highest v* tag below this one (sort -V),
          # read from the remote, as the checkout has no tags. Empty for a
          # first release, and then left out of the payload.
          # A failed or timed-out lookup is reported, and the event goes
          # without previous_tag (the site's release_sync.py finds it).
          prev=""
          if tags="$(timeout 30 git ls-remote --tags --refs origin 'refs/tags/v*' 2> /dev/null)"; then
            prev="$(printf '%s\n' "$tags" | sed 's|.*refs/tags/||' | grep -E '^v[0-9]' | { cat; echo "$TAG"; } \
              | sort -V -u | grep -Fx -B1 "$TAG" | grep -Fxv "$TAG" || true)"
          else
            echo "::warning::the release tags could not be listed (failed or timed out); org-release goes without previous_tag"
          fi
          args=(-f event_type=org-release
                -f "client_payload[repository]=${GITHUB_REPOSITORY}"
                -f "client_payload[tag]=${TAG}"
                -f "client_payload[commit]=${COMMIT}")
          [ -z "$prev" ] || args+=(-f "client_payload[previous_tag]=${prev}")
          if timeout 45 gh api -X POST "repos/${SITE}/dispatches" "${args[@]}" > /dev/null; then
            echo "Sent org-release to ${SITE}: ${GITHUB_REPOSITORY} ${TAG}${prev:+ (previous ${prev})}" >> "$GITHUB_STEP_SUMMARY"
          else
            warn "repository_dispatch org-release to ${SITE} failed or timed out for ${TAG} (the reason is above)"
          fi

  # Before a library ships (#482): in a dry run, its main consumers are built
  # and tested against this commit on an ns3-dev image, by the same script as
  # ns3-containers' image canary (swarm-routing/.github tools/downstream/,
  # fetched from main as this workflow's actions are). The caller's checkout
  # stands in for the release: the consumer list's `downstream-self` line is
  # a copy of it (DOWNSTREAM_LOCAL), and each consumer's stage points at it
  # (AntHocNet: NS3_TOOLS_DIR, SWARM_CORE_DIR). Report-only: a failing
  # consumer is a warning, the summary table and a red job that does not fail
  # the run; it never blocks the bump.
  downstream:
    # route only: the consumers judge the commit, not the version, so a dry
    # run whose bump stops (a missing ladder row, nothing to release since the
    # last tag) still reports them, and in parallel with the build
    needs: route
    if: ${{ inputs.downstream-consumers != '' && needs.route.outputs.mode == 'dry-run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    permissions:
      contents: read
    env:
      LIST: ${{ inputs.downstream-consumers }}
      SELF: ${{ inputs.downstream-self || github.event.repository.name }}
      IMAGE: ${{ inputs.downstream-image }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: self
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          # main, as this workflow's actions; in .github itself (its
          # release-selftest.yml) the commit under test, so a PR's script runs
          ref: ${{ github.repository == 'swarm-routing/.github' && github.sha || 'main' }}
          path: org
          persist-credentials: false
      - name: Pull the image
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do docker pull -q "$IMAGE" && exit 0; sleep $((i * 20)); done
          exit 1
      - name: Build and test the consumers against this commit
        env:
          DOWNSTREAM_TITLE: Downstream check before the release (report-only)
          DOWNSTREAM_FAILED: ${{ runner.temp }}/downstream-failed
        run: |
          [ -f "self/$LIST" ] || { echo "::error::downstream-consumers: no file $LIST in the repository"; exit 1; }
          export DOWNSTREAM_LOCAL="${SELF}=${GITHUB_WORKSPACE}/self"
          if ! org/tools/downstream/downstream.sh "$IMAGE" "self/$LIST"; then
            if [ -f "$DOWNSTREAM_FAILED" ]; then
              while read -r name src reason; do
                echo "::warning::downstream: ${name} (${src}) fails against this commit: ${reason}"
              done < "$DOWNSTREAM_FAILED"
            fi
            exit 1
          fi

  # org-bot follows the release (#479): `org-release` to swarm-routing/.github,
  # whose org-bot.yml then runs the `release` task (release-aftercare: the
  # roadmap's shipped block and the DOI rows, release-rebuild) for this
  # repository and `release-lock` (and, for swarm-core, `swarm-core-pin`) in
  # every consumer, instead of waiting for an hourly slot GitHub may skip (it
  # fired none for .github between 12:57 and 16:30 UTC on 2026-11-15). After
  # the zenodo and vcpkg jobs, whatever they concluded, so the version DOI and
  # the port PR are there to record; the hourly run stays the backstop. The bot
  # token (Contents: write on .github), never GITHUB_TOKEN. Report-only: a
  # failed dispatch is a warning and a summary line.
  notify-org:
    needs: [route, build, publish, zenodo, vcpkg]
    if: ${{ always() && inputs.notify-org && needs.publish.result == 'success' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      TAG: ${{ needs.build.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - name: Bot token
        id: bot
        continue-on-error: true
        timeout-minutes: 2
        uses: swarm-routing/.github/.github/actions/bot-token@eb4464f60e7f9b2c5ef5f70c2d1c0f8119e0eddf # main@2026-11-24
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Tell org-bot
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          warn() {
            echo "::warning::$1"
            echo "org-bot not notified: $1 (its hourly release run catches it)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ -n "$GH_TOKEN" ] || warn "no bot token (BOT_APP_ID / BOT_APP_PRIVATE_KEY, ORG_BOT_TOKEN unset), so no org-release event for ${TAG}"
          if timeout 45 gh api -X POST repos/swarm-routing/.github/dispatches \
               -f event_type=org-release \
               -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
               -f "client_payload[tag]=${TAG}" \
               -f "client_payload[commit]=${COMMIT}" > /dev/null; then
            echo "Sent org-release to swarm-routing/.github: ${GITHUB_REPOSITORY} ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          else
            warn "repository_dispatch org-release to swarm-routing/.github failed or timed out for ${TAG} (the reason is above)"
          fi

  # Opt-in (`zenodo: true`, #232): the published release, archived on Zenodo
  # from here, so Zenodo never fetches it from GitHub with the maintainer's
  # OAuth token (and quota, #226). No code of the caller's runs: its
  # checkout is read for CITATION.cff and .github/org-sync.toml only.
  zenodo:
    needs: [route, build, publish]
    if: ${{ inputs.zenodo && needs.route.outputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The `release` environment: ZENODO_TOKEN may be its secret (the caller
    # repository's), which then takes the place of the one passed in, and no
    # job outside the environment can read it. Where the environment has
    # required reviewers, this job waits for an approval too.
    environment: release
    concurrency:
      group: release-zenodo-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      concept: ${{ steps.push.outputs.concept }}
      doi: ${{ steps.push.outputs.doi }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SANDBOX: ${{ inputs.zenodo-sandbox }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - name: The release commit (CITATION.cff, .github/org-sync.toml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false
      # zenodo.py is this repository's, at main, as the bot-token action is:
      # a reusable workflow's `./` would be the caller's checkout.
      - name: The archiving tool (swarm-routing/.github tools/zenodo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          ref: main
          path: org-tools
          sparse-checkout: tools/zenodo
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/rel
      - name: Archive on Zenodo
        id: push
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "::error::zenodo: true, but no ZENODO_TOKEN reached this job: pass it under secrets: (or set it on the release environment). The GitHub release is published; archive it with the zenodo workflow (CONTRIBUTING \"When Zenodo fails a release\")."
            exit 1
          fi
          sandbox=()
          [ "$SANDBOX" = true ] && sandbox=(--sandbox)
          files=()
          for f in "$RUNNER_TEMP"/rel/release/*; do [ -f "$f" ] && files+=("$f"); done
          if ! python3 -I org-tools/tools/zenodo/zenodo.py publish-release --repo "$GITHUB_REPOSITORY" \
              --tag "$TAG" --checkout caller --publish "${sandbox[@]}" --files "${files[@]}"; then
            echo "::error::Zenodo did not archive ${TAG} (the reason is above). The GitHub release is published; re-run this job, or the daily zenodo workflow archives it after its grace period."
            exit 1
          fi
      # #232 item 5: the repository names the concept Zenodo returned. A
      # missing name is written by org-bot's `zenodo` task (a PR, never by
      # hand); two concepts are the maintainer's to settle. Not on the
      # sandbox, whose concept is a test one.
      - name: Check CITATION.cff and the DOI badge against the concept
        if: ${{ !inputs.zenodo-sandbox && steps.push.outputs.concept != '' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          CONCEPT: ${{ steps.push.outputs.concept }}
        run: |
          if ! out=$(python3 -I org-tools/tools/zenodo/zenodo.py record --repo "$GITHUB_REPOSITORY" \
              --checkout caller --concept "$CONCEPT" 2>&1); then
            echo "$out"
            echo "::error::${TAG} is archived in Zenodo concept ${CONCEPT}, but the repository names another (above); the maintainer decides which is right (CONTRIBUTING \"Releases and DOIs\")."
            exit 1
          fi
          echo "$out"
          case "$out" in
            *"missing from"*) echo "::notice::concept ${CONCEPT} is not recorded in the repository yet; org-bot's zenodo task opens the PR that writes it (or dispatch org-bot with task zenodo)." ;;
          esac
          printf '\n%s\n' "$out" >> "$GITHUB_STEP_SUMMARY"

  # Opt-in (`vcpkg-ports`, #439): the published release's port bump in
  # swarm-routing/vcpkg-registry, rendered by the registry's own script from
  # the published asset (never a typed hash), as a PR from the bot's branch.
  # No code of the caller's runs; the registry's script runs without a token.
  vcpkg:
    needs: [route, build, publish]
    if: ${{ inputs.vcpkg-ports != '' && needs.route.outputs.mode == 'release' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-vcpkg-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VER: ${{ needs.build.outputs.version }}
      PORTS: ${{ inputs.vcpkg-ports }}
      REGISTRY: swarm-routing/vcpkg-registry
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - name: The registry at main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/vcpkg-registry
          ref: main
          path: registry
          persist-credentials: false
      - name: Render the bump (the registry's tools/port_bump.py)
        working-directory: registry
        run: |
          for p in $PORTS; do
            case "$p" in *[!a-z0-9-]*|'') echo "::error::vcpkg-ports: '$p' is not a port name"; exit 1 ;; esac
            python3 -I tools/port_bump.py bump --port "$p" --tag "$TAG"
          done
          python3 -I tools/port_bump.py check
          git status --short
      # The action is this repository's, by path: a reusable workflow's `./`
      # would be the caller's checkout.
      - name: Bot token
        id: bot
        uses: swarm-routing/.github/.github/actions/bot-token@eb4464f60e7f9b2c5ef5f70c2d1c0f8119e0eddf # main@2026-11-24
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Push bot/vcpkg-<repository> and open or update the registry PR
        working-directory: registry
        env:
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_NAME: ${{ steps.bot.outputs.git-name }}
          BOT_EMAIL: ${{ steps.bot.outputs.git-email }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The registry already has ${PORTS} ${VER}: nothing to propose." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::no bot token (neither the App secrets nor ORG_BOT_TOKEN): GITHUB_TOKEN cannot push to ${REGISTRY}. The release ${TAG} is published; re-run this job once the secrets reach the caller, or open the PR by hand with tools/port_bump.py (swarm-routing/vcpkg-registry README \"How a port is bumped\")."
            exit 1
          fi
          branch="bot/vcpkg-${GITHUB_REPOSITORY#*/}"
          title="feat(ports): ${PORTS// /, } ${VER}"
          git config user.name "${BOT_NAME:-github-actions[bot]}"
          git config user.email "${BOT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git checkout -q -b "$branch"
          git add -A
          git commit -q -m "$title" -m "Rendered by tools/port_bump.py from ${GITHUB_REPOSITORY} ${TAG}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          auth="$(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # bot/vcpkg-<repository> is the bot's branch, rebuilt on the
          # registry's main each time: force-pushed.
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "HEAD:refs/heads/${branch}"
          body="$RUNNER_TEMP/body.md"
          {
            echo "The port bump for **${GITHUB_REPOSITORY} ${TAG}** (${PORTS}), rendered by \`tools/port_bump.py bump\` from the published release: the asset named in each port's portfile, checked against the release's \`SHA256SUMS\`, its SHA512, the version, the git-tree and \`versions/\`; then \`port_bump.py check\`."
            echo
            echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo "Opened by run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) (swarm-routing/.github \`reusable-release.yml\`, \`vcpkg-ports\`). The registry's CI installs every port on x64-linux and wasm32-emscripten."
          } > "$body"
          export GH_TOKEN="$BOT_TOKEN"
          n="$(gh pr list --repo "$REGISTRY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh pr edit "$n" --repo "$REGISTRY" --title "$title" --body-file "$body" > /dev/null
            url="$(gh pr view "$n" --repo "$REGISTRY" --json url --jq .url)"
            echo "Updated ${url}"
          else
            url="$(gh pr create --repo "$REGISTRY" --base main --head "$branch" --title "$title" --body-file "$body")"
            echo "Opened ${url}"
          fi
          echo "### ${title}: ${url}" >> "$GITHUB_STEP_SUMMARY"
          # Auto-merge (#461), as org-bot's and the site's bot PRs: the
          # registry's merge queue squashes it once its required checks pass.
          # Only on this bot branch's PR; a refusal is a warning, the release stands.
          if gh pr merge "$url" --repo "$REGISTRY" --auto --squash; then
            echo "Auto-merge on: the registry's merge queue lands ${url} once green" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::auto-merge not enabled on ${url}: merge it once the registry's checks are green"
            echo "Auto-merge NOT enabled on ${url}: merge it by hand once green" >> "$GITHUB_STEP_SUMMARY"
          fi

  # mode bump: the bump commit as the PR `chore(release): bump version A to
  # B` from bot/release. It runs no code of the caller's (the build job ran
  # only Commitizen in this mode).
  propose:
    needs: [route, build]
    if: ${{ needs.route.outputs.mode == 'bump' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-bump-${{ github.repository }}
      cancel-in-progress: false
    # contents + pull-requests: write only for the GITHUB_TOKEN fallback when
    # no bot token is configured; the bot token is the one that should push,
    # since a push or PR made with GITHUB_TOKEN starts no CI run.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.pr.outputs.url }}
    env:
      COMMIT: ${{ needs.build.outputs.commit }}
      VER: ${{ needs.build.outputs.version }}
      OLD: ${{ needs.build.outputs.old-version }}
      BASE: ${{ needs.route.outputs.base }}
      INCREMENT: ${{ inputs.increment }}
      NOTES_EMPTY: ${{ needs.build.outputs.notes-empty }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/rel

      # The org App's token (else ORG_BOT_TOKEN), so CI runs on the PR. The
      # action is this repository's, by path: a reusable workflow's `./`
      # would be the caller's checkout.
      - name: Bot token
        id: bot
        uses: swarm-routing/.github/.github/actions/bot-token@eb4464f60e7f9b2c5ef5f70c2d1c0f8119e0eddf # main@2026-11-24
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}

      - name: Push bot/release and open or update the PR
        id: pr
        env:
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          WORKFLOW_GITHUB_TOKEN: ${{ github.token }}
        run: |
          R="$RUNNER_TEMP/rel"
          git fetch --quiet "$R/meta/release.bundle" "refs/heads/bot/release:refs/remotes/bundle/release"
          # The commit the build job recorded (a job output no step here can
          # change), one bump commit on the dispatched tip.
          test "$(git rev-parse refs/remotes/bundle/release)" = "$COMMIT"
          test "$(git rev-parse "${COMMIT}^")" = "$GITHUB_SHA"
          token="$BOT_TOKEN"
          if [ -z "$token" ]; then
            echo "::warning::no bot token: GITHUB_TOKEN pushes and opens the PR, so no CI runs on it (close and reopen it to start CI), and the org's Actions policy may refuse the PR"
            token="$WORKFLOW_GITHUB_TOKEN"
          fi
          auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "::add-mask::$auth"
          # Rebuilt on the default branch's tip each time: bot/release is the
          # bot's branch, so it is force-pushed.
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "${COMMIT}:refs/heads/bot/release"
          title="chore(release): bump version ${OLD} to ${VER}"
          body="$RUNNER_TEMP/body.md"
          {
            echo "Commitizen's bump to **v${VER}** from the commits on \`${BASE}\` since the last tag (\`CHANGELOG.md\` has the notes)."
            echo
            echo "**Merging this PR releases v${VER}.** The release workflow runs on the merge: it builds, attests and verifies the merged commit, tags it v${VER} and publishes the GitHub release (swarm-routing/.github \`reusable-release.yml\`)."
            echo
            if [ "$NOTES_EMPTY" = true ]; then
              echo "> [!WARNING]"
              echo "> **The notes of v${VER} are empty**: no \`feat\` or \`fix\` commit since the last tag, so \`CHANGELOG.md\` has nothing under \`## v${VER}\`. Write the release's paragraph there, in a commit on this PR, before merging: a release with empty notes fails before anything is tagged or published (swarm-routing/.github#524)."
              echo
            fi
            echo "If \`${BASE}\` moves before the merge, org-bot's \`release-rebuild\` task dispatches the release workflow with mode \`bump\` again within the hour, with the same \`increment\`, and that rebuilds this branch on the new tip (swarm-routing/.github#430); a dispatch by hand does the same."
            echo
            echo "Opened by run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            # read by org-bot's release-rebuild, so a rebuild keeps the size asked for
            echo "<!-- release-increment: ${INCREMENT:-auto} -->"
          } > "$body"
          export GH_TOKEN="$token"
          n="$(gh pr list --repo "$GITHUB_REPOSITORY" --head bot/release --base "$BASE" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh pr edit "$n" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body" > /dev/null
            url="$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
            echo "Updated ${url}"
          else
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head bot/release --title "$title" --body-file "$body")"
            echo "Opened ${url}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "### ${title}: ${url}" >> "$GITHUB_STEP_SUMMARY"

  # mode release-notes (#524): the notes of an existing release, re-rendered
  # from the version's CHANGELOG.md section as it stands at the dispatched
  # commit (a paragraph written after the release, swarm-routing/BeeAdHoc#165),
  # with GITHUB_TOKEN. Everything from `## Verify your download` on is kept
  # byte for byte; only the part above it changes, and only when the section
  # has a paragraph. tools/release/release_notes.py `rerender` does the cut.
  release-notes:
    needs: route
    if: ${{ needs.route.outputs.mode == 'release-notes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # edit the release
    env:
      TAG: ${{ inputs.tag }}
      WD: ${{ inputs.working-directory }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      # The CHANGELOG.md to read; no code of the caller's runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Re-render the notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool="$RUNNER_TEMP/release_notes.py"
          if [ "$GITHUB_REPOSITORY" = swarm-routing/.github ]; then
            cp tools/release/release_notes.py "$tool"
          else
            gh api -H 'Accept: application/vnd.github.raw' \
              'repos/swarm-routing/.github/contents/tools/release/release_notes.py?ref=main' > "$tool"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$RUNNER_TEMP/before.json"
          id="$(jq -r .id "$RUNNER_TEMP/before.json")"
          if ! verdict="$(python3 -I "$tool" rerender --release-json "$RUNNER_TEMP/before.json" \
                 --changelog "${WD}/CHANGELOG.md" --tag "$TAG" --out "$RUNNER_TEMP/payload.json")"; then
            echo "::error::the notes of ${TAG} were left as they are (the reason is above)"
            exit 1
          fi
          if [ "$verdict" = unchanged ]; then
            echo "${TAG}: the notes already carry CHANGELOG.md's section; nothing edited" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" --input "$RUNNER_TEMP/payload.json" > /dev/null
          # Read back: the body is the one sent, so the verify block is the old one, byte for byte.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$RUNNER_TEMP/after.json"
          jq -e --slurpfile p "$RUNNER_TEMP/payload.json" '.body == $p[0].body' "$RUNNER_TEMP/after.json" > /dev/null
          jq -e --slurpfile b "$RUNNER_TEMP/before.json" \
            '(.body | .[index("## Verify your download"):]) == ($b[0].body | .[index("## Verify your download"):])' \
            "$RUNNER_TEMP/after.json" > /dev/null
          {
            echo "### ${TAG}: notes re-rendered from ${WD}/CHANGELOG.md at ${GITHUB_SHA}"
            echo
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG} (the Verify your download block is unchanged)"
          } >> "$GITHUB_STEP_SUMMARY"
