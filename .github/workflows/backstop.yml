name: backstop

# The schedule backstop (cmd/backstop, run from the ci-tools image by digest,
# docs/adr/0002-pipelines-are-go.md): hourly, on this repository's schedule, which
# fires, every row of .github/backstop.toml whose workflow has no run on its
# repository's default branch within its period (less 10 minutes) is dispatched
# with the row's inputs. Today: swarm-routing/ns3-upstream-report's send (1h), read
# (6h), maintain (24h) and rotate (168h), with `mode: scheduled`, because GitHub has
# fired no schedule there (swarm-routing/ns3-upstream-report#33); and org-bot.yml's
# hourly, three-hourly and daily tasks here, a row each found by run-name, with a
# 2-hour alarm on the hourly one kept as an issue by --issue (#748). Once a native
# schedule runs, its runs make the backstop skip that row.
#
# Token: the org App's installation token (.github/actions/bot-token), which may
# dispatch workflows (Actions write; org-bot's release-rebuild uses the same). A pull
# request that changes this workflow or the table runs a dry run with the
# workflow's own token: it only reads runs.
#
# When org-bot finishes, too (#748): GitHub fires few of this repository's
# schedules (this one ran 4 of its 24 hourly slots on 2026-11-21), while
# org-bot runs dozens of times a day, so each of its runs ending is a tick of
# the clock. This is a run of its own, not a job in org-bot's run: a job there
# that a newer one replaced in this group would mark org-bot's run cancelled,
# and the backstop does not count a cancelled run. A row within its period
# dispatches nothing, so most of these runs only read.
#
# On a tick from another repository, too (#748): org-bot's runs stop when
# dispatch traffic is quiet (no run 06:27-09:34 UTC on 2026-11-23, a 4 h 07 min
# gap in the hourly task), so a few active repositories run the org-managed
# backstop-tick.yml (templates/workflows/, opted in by `backstop_tick = MINUTE`
# in their .github/org-sync.toml), an hourly cron at each one's own minute that
# sends repository_dispatch `backstop-tick` here. GitHub drops each
# repository's schedules independently. The payload (the sender's name) is not
# read: a tick only starts this run from main's code.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_run:
    workflows: [org-bot]
    types: [completed]
  repository_dispatch:
    types: [backstop-tick]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Read the runs and print what would be dispatched'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/backstop.yml'
      - '.github/backstop.toml'

permissions:
  contents: read

concurrency:
  group: backstop-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  backstop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # the ci-tools image by digest (docs/adr/0002-pipelines-are-go.md)
      IMG: ghcr.io/swarm-routing/ci-tools@sha256:0959f552c5587cd20f9d44e30dcdd39e205385765ca4233cd2df8846d64c81cf  # promoted from 734a61a
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The ci-tools image (pulled with retries, #645)
        uses: ./.github/actions/pull-ci-tools
        timeout-minutes: 3  # about 15 MB, and up to 90 s of retries
        with:
          image: ${{ env.IMG }}
      - name: Dry run (pull request, reads only)
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace "$IMG" backstop --dry-run
      - name: Bot token
        if: github.event_name != 'pull_request'
        id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Dispatch what is due
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -o pipefail
          args=()
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ -z "$GH_TOKEN" ] && echo "::warning::no bot token (neither the App secrets nor ORG_BOT_TOKEN): dry run only"
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace "$IMG" backstop --issue "${args[@]}" \
            | tee "$RUNNER_TEMP/backstop.txt"
      - name: Summary
        if: always() && github.event_name != 'pull_request'
        run: |
          {
            echo "### backstop"
            echo
            printf '%s\n' '```'
            cat "$RUNNER_TEMP/backstop.txt" 2>/dev/null || echo "(no output)"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
