name: Reusable swarm-core pin

# For a protocol repository whose dual-licensed core/ builds on swarm-core's
# core/ at a pinned commit (#174, from ARA#40's `swarm-core pin` job): fails
# unless core/CMakeLists.txt's SWARM_CORE_REF, the Makefile and every
# workflow's swarm-core `core-deps` name one commit (and the ns-3 build's
# swarm-core dependency names `main` or that commit), naming the file and line
# that disagree; and fails when swarm-core main's core/ differs from the
# pinned commit's, saying to bump the pin (the ns-3 build follows swarm-core
# main, swarm-core golden rule 12, so the two must be the same code).
# A repository with a release lock, swarm-core.lock (swarm-routing/ns3-swarm-core#134),
# is checked in lock mode instead: one release tag everywhere, the lock verified
# against the release, and red only when a newer swarm-core release is out.
# The checker is tools/checks/check-swarm-core-pin.py in swarm-routing/.github
# (with tools/checks/release_lock.py).
# Caller:
#   jobs:
#     swarm-core:
#       uses: swarm-routing/.github/.github/workflows/reusable-swarm-core-pin.yml@main
# (the check is then named `swarm-core / pin`).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          path: .org
          sparse-checkout: tools/checks
          persist-credentials: false
      - name: The pin is one commit, and swarm-core main's core/ is the pinned core/
        run: |
          python3 -I .org/tools/checks/check-swarm-core-pin.py --self-test
          python3 -I .org/tools/checks/check-swarm-core-pin.py
