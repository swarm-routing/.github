# Applies each repository's description, homepage and topics (swarm-routing/.github#117).
# One-off and on demand until tools/repo-settings (#117) takes over; then this file goes.
# Token: the org GitHub App's (BOT_APP_ID + BOT_APP_PRIVATE_KEY, Administration: write; #21) through
# .github/actions/bot-token, else secret REPO_SETTINGS_TOKEN (fine-grained, swarm-routing repos,
# Administration: write + Metadata: read), else ORG_BOT_TOKEN.
name: repo metadata

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: print what would change, write nothing
        type: boolean
        default: true

permissions:
  contents: read # the checkout, for the bot-token action

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bot token
        id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.REPO_SETTINGS_TOKEN || secrets.ORG_BOT_TOKEN }}
      - name: Apply descriptions, homepages and topics
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::no bot token: neither the App secrets nor REPO_SETTINGS_TOKEN or ORG_BOT_TOKEN"; exit 1; fi
          S=https://swarm-routing.github.io
          fail=0
          apply() {
            local r=$1 d=$2 h=$3; shift 3
            local live
            if ! live=$(gh api "repos/swarm-routing/$r" --jq '[.description // "", .homepage // ""] | @tsv'); then
              echo "::error::$r: could not read the repository"; fail=1; return
            fi
            echo "::group::$r"
            echo "live:     $live"
            echo "proposed: $d	$h"
            echo "topics:   $*"
            if [ "$DRY_RUN" = "true" ]; then echo "dry run: nothing written"; echo "::endgroup::"; return; fi
            local a=(); for t in "$@"; do a+=(-f "names[]=$t"); done
            if gh api -X PATCH "repos/swarm-routing/$r" -f description="$d" -f homepage="$h" --jq .full_name \
               && gh api -X PUT "repos/swarm-routing/$r/topics" "${a[@]}" --jq '.names | join(",")'; then
              echo "updated"
            else
              echo "::error::$r: update failed (token needs Administration: write on this repo)"; fail=1
            fi
            echo "::endgroup::"
          }
          apply .github "Org-wide defaults for every swarm-routing repository: contributing rules and label taxonomy, issue forms, reusable CI workflows (ns-3, Python, licence, PR title), org-sync templates and the bots that keep each repository's epics, templates, settings and Zenodo records current." "$S/arena/org-commons/" github-actions reusable-workflows ci org-templates licensing automation swarm-intelligence ns-3
          apply AntHocNet "AntHocNet (Di Caro, Ducatelle & Gambardella), the hybrid ant-colony routing protocol for MANETs, as a paper-faithful reference: a simulator-agnostic C++ core, an ns-3 module, 20-seed benchmarks against AODV/OLSR/DSDV with 95% CIs, satellite/ISL scenarios, and its core compiled to WebAssembly for the learn-site game." "$S/AntHocNet/" aco ad-hoc-networks ad-hoc-routing ant-colony-optimization anthocnet leo-satellite manet network-simulation ns-3 routing-protocol satellite-networking swarm-intelligence webassembly
          apply ARA "ARA, the Ant-Colony-Based Routing Algorithm (Güneş, Sorges & Bouazizi, 2002), as a standalone swarm routing protocol for MANETs: planned as a simulator-agnostic C++ core and an ns-3 contrib module on swarm-core, with a paper-fidelity sheet." "$S/arena/ARA/" ara ant-colony-optimization aco swarm-intelligence manet ad-hoc-routing routing-protocol ns-3 network-simulation
          apply BeeAdHoc "BeeAdHoc, the honeybee-inspired routing protocol of Wedde & Farooq (2005), as a standalone swarm routing protocol for MANETs: scouts, foragers and an energy metric, as a planned simulator-agnostic C++ core and ns-3 contrib module on swarm-core." "$S/arena/BeeAdHoc/" beeadhoc bee-colony swarm-intelligence manet ad-hoc-routing routing-protocol energy-aware-routing ns-3 network-simulation
          apply HOPNET "HOPNET (Wang, 2007) as a standalone swarm routing protocol for MANETs: ant-colony routing over routing zones, proactive inside a zone and reactive between zones. Planned as a simulator-agnostic C++ core and an ns-3 contrib module on swarm-core." "$S/arena/HOPNET/" hopnet ant-colony-optimization aco zone-routing swarm-intelligence manet ad-hoc-routing routing-protocol ns-3
          apply Termite "Termite (Roth & Wicker, 2003/2005) as a standalone swarm routing protocol for MANETs: routing by stigmergy, pheromone carried inside data packets, no control ants, randomised multipath forwarding. A simulator-agnostic C++ core and an ns-3 contrib module on swarm-core." "$S/arena/Termite/" termite stigmergy swarm-intelligence multipath-routing manet ad-hoc-routing routing-protocol ns-3 network-simulation
          apply benchmarks "Immutable, reproducible benchmark datasets for the swarm-routing protocols: 20-seed ns-3 runs, paired statistical verdicts and a manifest per run pinning the image digest, protocol commits, scenario, seeds and command." "$S/arena/benchmarks/" benchmarks reproducibility datasets ns-3 network-simulation routing-protocol manet statistics
          apply ns3-containers "Pre-built, tested ns-3 images for contrib-module CI: ghcr.io/swarm-routing/ns3-dev with the ns-3 tree configured and built: debug, sanitized, default and optimized profiles on Ubuntu, debug and default on Debian, debug on Alpine; signed and attested." "$S/arena/ns3-containers/" ns-3 docker container-images ghcr ci sanitizers network-simulation reproducibility cosign
          apply ns3-swarm-core "swarm-core, the shared ns-3 contrib module every swarm-routing protocol links against: simulator-agnostic C++20 primitives (visited path, little-endian wire helpers, pheromone table, route decision, link metrics) and the ns-3 glue they need." "$S/arena/ns3-swarm-core/" ns-3 swarm-intelligence routing-protocol manet cpp20 pheromone network-simulation library
          apply ns3-tools "Protocol-agnostic ns-3 comparison and diagnostics tooling: the routing-bench harness every protocol arm registers with, the readers and paired statistics for its marker lines, and (planned) probes, universal arenas and the ns3-tool CLI." "$S/arena/ns3-tools/" ns-3 benchmarking routing-protocol manet network-simulation statistics reproducibility aodv olsr
          apply skills "The swarm-routing org's agent skills: one Claude Code plugin (swarm-routing) and plain Agent Skills for any agent (npx skills add swarm-routing/skills). Each skill is a procedure over a script in swarm-routing/.github tools/, script first." "" claude-code claude-code-plugin agent-skills ai-agents automation swarm-intelligence
          apply swarm-routing.github.io "Colony Arena, the swarm-routing site: a colony map of every project, a page per protocol with its diagrams and quests, and AntHocNet's game, docs and API, running AntHocNet's C++ core compiled to WebAssembly in the browser." "$S/" github-pages webassembly swarm-intelligence ant-colony-optimization manet routing-protocol education visualization
          exit "$fail"
