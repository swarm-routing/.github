name: ci-tools image

# Builds ghcr.io/swarm-routing/ci-tools, the image the org's Go pipeline
# tools ship in (docs/adr/0002-pipelines-are-go.md), on the rule of
# swarm-routing/ns3-containers' golden rule 17: what is tested is what is
# tagged.
#
#   go        reusable-go-ci.yml on the root module (cmd/, internal/)
#   dockerfile  hadolint (.hadolint.yaml), a Trivy configuration scan, and the
#             golang base tag = go.mod's `toolchain` version
#   image     build once (docker/ci-tools/Dockerfile: go vet and go test run
#             in its build stage); on a same-repository PR and on main, push
#             it as a candidate to ghcr.io/swarm-routing/ci-tools-dev and check
#             the pushed manifest is the image built; then every test runs on
#             that digest (a fork PR, which cannot push, tests the local
#             image): the dispatcher's usage and `list`, the fixture tool on
#             the mounted workspace as a workflow's `docker run` mounts it, compared
#             with wc -l and sha256sum, user nonroot, no shell in the image,
#             and Trivy on the image (HIGH/CRITICAL with a fix fails)
#   promote   main only: the same digest copied to ci-tools:sha-<sha7> and
#             ci-tools:latest by a registry copy (no rebuild; the copy's
#             digest must equal the candidate's), a CycloneDX SBOM (Trivy),
#             a keyless cosign signature, build provenance and SBOM
#             attestations, then `cosign verify`
#   cleanup   main only: ci-tools-dev candidates older than 2 days that no
#             committed file pins (reusable-dev-image-cleanup.yml)
#
# Workflows run a tool by digest, never by tag, in a run: step (ADR-0002,
# amended 2026-11-17; `uses: docker://` ended in startup_failure on a caller,
# #577):
#   docker run --rm --user "$(id -u):$(id -g)" \
#     -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace \
#     ghcr.io/swarm-routing/ci-tools@sha256:<digest> <tool> <args...>
# A new tool's workflow self-test runs the candidate the same way here, on the
# candidate digest. The image has no git and no gh.
#
# Permissions: read by default; the image job adds packages: write (push the
# candidate) and pull-requests: read (branch-sweep's dry run), the promote job
# packages: write, id-token: write (keyless signing, attestations) and
# attestations: write.
#
# The required check is `ci-tools image gate` (#610): a required check runs on
# every pull request and merge group, with no `paths:` filter (CONTRIBUTING
# "Settings are code"), so the `changes` job decides. A pull request or merge
# group that changes none of the paths in BUILD_PATHS skips go, dockerfile
# and image, and the gate reports green within seconds; one that does runs
# them all, and the gate is red unless every one passed. A red image build
# (#567: tests that pass from the checkout but not in the image's build
# context) can no longer merge.
on:
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (#130)
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - 'cmd/**'
      - 'internal/**'
      - 'docker/ci-tools/**'
      - .hadolint.yaml
      - .github/workflows/ci-tools-image.yml
      - .github/workflows/reusable-go-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tools-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CANDIDATES: ghcr.io/swarm-routing/ci-tools-dev
  IMAGE: ghcr.io/swarm-routing/ci-tools
  TRIVY: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  # Whether this change can affect the image: always on a push or dispatch;
  # for a pull request or merge group, whether any changed file matches
  # BUILD_PATHS (the push trigger's `paths:` list, as a regex). Any doubt (an
  # API error, 300 or more files, an empty diff) builds.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - name: Changed paths
        id: diff
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BUILD_PATHS: '^(go\.mod|go\.sum|cmd/|internal/|docker/ci-tools/|\.hadolint\.yaml$|\.github/workflows/(ci-tools-image|reusable-go-ci)\.yml$)'
        run: |
          build=true
          if { [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; } && [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            # three-dot compare: the change against its merge base; a rename lists both paths
            if files=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files | if length < 300 then .[] | .filename, (.previous_filename // empty) else error("300 or more files") end'); then
              printf 'changed:\n%s\n' "$files"
              if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qE -- "$BUILD_PATHS"; then
                build=false
              fi
            else
              echo "::warning::could not list the changed files; building"
            fi
          fi
          echo "build=$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [ "$build" = false ]; then
            echo "No Go, Docker or ci-tools workflow path changed: go, dockerfile and image skip (#610)." >> "$GITHUB_STEP_SUMMARY"
          fi

  go:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/reusable-go-ci.yml

  # The Go coverage of the `go` job to Codecov (report-only; GitHub OIDC, no
  # stored token; #635). Skipped with `go`, and in the merge queue.
  codecov:
    needs: go
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-codecov.yml
    with:
      artifact: go-coverage
      flags: go

  dockerfile:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        timeout-minutes: 3
        with:
          dockerfile: docker/ci-tools/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning
      - name: Trivy configuration scan
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/docker/ci-tools:/src:ro" "$TRIVY" config --quiet \
            --exit-code 1 --severity MEDIUM,HIGH,CRITICAL /src
      - name: The golang base is go.mod's toolchain
        run: |
          set -euo pipefail
          want=$(sed -n 's/^toolchain go//p' go.mod)
          have=$(sed -n 's/^FROM golang:\([0-9.]*\)-.*/\1/p' docker/ci-tools/Dockerfile)
          echo "go.mod toolchain: $want; Dockerfile golang: $have"
          if [ -z "$want" ] || [ "$want" != "$have" ]; then
            echo "::error file=docker/ci-tools/Dockerfile::the golang base ($have) must be go.mod's toolchain ($want): move both together"
            exit 1
          fi
          grep -Eq '^FROM golang:[^ ]+@sha256:[0-9a-f]{64} AS build$' docker/ci-tools/Dockerfile
          grep -Eq '^FROM gcr\.io/distroless/static-debian12:nonroot@sha256:[0-9a-f]{64}$' docker/ci-tools/Dockerfile
          echo "both bases pinned by digest"

  image:
    needs: [go, dockerfile]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      pull-requests: read  # branch-sweep's dry run reads this repository's PRs
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build once
        id: build
        timeout-minutes: 15
        run: |
          set -euo pipefail
          docker build --pull -f docker/ci-tools/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.github.swarm-routing.build-run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -t ci-tools:candidate .
          echo "id=$(docker image inspect -f '{{.Id}}' ci-tools:candidate)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the candidate and check it is the image built
        id: push
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 5
        env:
          ID: ${{ steps.build.outputs.id }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "$PR" ]; then tag="pr-$PR-${GITHUB_SHA::7}"
          elif [ "$GITHUB_EVENT_NAME" = merge_group ]; then tag="queue-${GITHUB_SHA::7}"
          else tag="main-${GITHUB_SHA::7}"; fi
          docker tag ci-tools:candidate "$CANDIDATES:$tag"
          .github/actions/pull-ci-tools/docker-retry.sh push "$CANDIDATES:$tag"  # GHCR's `unknown blob` clears on a retry (#618, #645)
          digest=$(docker buildx imagetools inspect "$CANDIDATES:$tag" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          docker buildx imagetools inspect --raw "$CANDIDATES@$digest" > "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" "$digest" "$ID" <<'PY'
          import json, sys
          m, digest, local = json.load(open(sys.argv[1])), sys.argv[2], sys.argv[3]
          ok = {digest} | ({m["config"]["digest"]} if "config" in m else set())
          if local not in ok:
              sys.exit(f"pushed {digest} is not the built image {local} (config/manifest {sorted(ok)})")
          print(f"pushed {digest} = built {local}")
          PY
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "candidate \`$CANDIDATES@$digest\` (\`$tag\`)" >> "$GITHUB_STEP_SUMMARY"
      - name: Test on the candidate digest
        timeout-minutes: 10
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}  # backstop's, labels', branch-sweep's, release-sync-watch's and project-sync's dry runs read the API (no rate limit of an anonymous runner)
        run: |
          set -euo pipefail
          if [ -n "$DIGEST" ]; then
            docker rmi ci-tools:candidate > /dev/null
            img="$CANDIDATES@$DIGEST"; .github/actions/pull-ci-tools/docker-retry.sh pull "$img"
          else
            img=ci-tools:candidate; echo "::notice::fork PR: testing the local image, nothing pushed"
          fi
          echo "testing $img"
          # the dispatcher: usage (exit 2) with no tool, `list` names the tools
          rc=0; docker run --rm "$img" 2> usage.txt || rc=$?
          if [ "$rc" != 2 ] || ! grep -q '^usage: ci-tools <tool>' usage.txt; then
            cat usage.txt; echo "::error::no-argument run: exit $rc"; exit 1
          fi
          docker run --rm "$img" list | tee list.txt
          grep -qx fixture list.txt
          grep -qx bestpractices list.txt
          grep -qx backstop list.txt
          grep -qx check-headers list.txt
          grep -qx branch-sweep list.txt
          grep -qx release-sync-watch list.txt
          grep -qx security-autofix list.txt
          grep -qx security-alerts list.txt
          grep -qx labels list.txt
          grep -qx project-sync list.txt
          grep -qx os-refresh list.txt
          rc=0; docker run --rm "$img" nope 2> /dev/null || rc=$?
          [ "$rc" = 2 ] || { echo "::error::an unknown tool must exit 2, got $rc"; exit 1; }
          # labels (#570): this checkout's labels.json against the public repositories, read only
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace "$img" labels --dry-run | tee labels.txt
          grep -q '^swarm-routing/\.github: ' labels.txt
          # project-sync (#541): the committed definition validates, and the
          # items it wants are read from the public repositories (read-only, as
          # nonroot; the project itself needs the org App's token, so org-bot runs it)
          docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace "$img" project-sync --validate
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace "$img" project-sync --wanted | tee project-sync.txt
          grep -Eq '^project-sync: "Swarm routing plan": [0-9]+ items wanted; 0 private repositories refused$' project-sync.txt \
            || { echo "::error::project-sync: no summary line"; exit 1; }
          # a tool on the workspace, mounted as a workflow's `docker run` mounts it
          printf 'a\nb\n' > fixture-input.txt
          got=$(docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace" -w /github/workspace "$img" fixture go.mod fixture-input.txt)
          want=$(for f in go.mod fixture-input.txt; do echo "$f $(wc -l < "$f") $(sha256sum < "$f" | cut -d' ' -f1)"; done)
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::fixture output differs from wc -l / sha256sum:"; echo "$want"; exit 1; }
          # bestpractices (#531), both run forms of the ADR on a copy of this
          # checkout without .git (the image has no git, so neither may the
          # comparison): read-only as the image's nonroot user (output on
          # stdout), then writing as the runner's user (`--user`, the file in
          # the checkout); the two must agree
          bp="$RUNNER_TEMP/bp-fixture"; mkdir -p "$bp"
          git archive HEAD | tar -x -C "$bp"
          args=(answers . --slug swarm-routing/.github --today 2026-11-16)
          docker run --rm -v "$bp:/github/workspace" -w /github/workspace "$img" bestpractices "${args[@]}" > bp-read.json
          docker run --rm --user "$(id -u):$(id -g)" -v "$bp:/github/workspace" -w /github/workspace "$img" bestpractices "${args[@]}" --write
          cmp bp-read.json "$bp/.bestpractices.json" || { echo "::error::the written .bestpractices.json differs from the printed one"; exit 1; }
          [ "$(stat -c %u "$bp/.bestpractices.json")" = "$(id -u)" ] || { echo "::error::--user did not write as the runner's user"; exit 1; }
          echo "bestpractices: both run forms agree ($(wc -c < bp-read.json) bytes)"
          # backstop (swarm-routing/ns3-upstream-report#33): the repository's table, read-only
          # as nonroot: --dry-run only reads runs
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/github/workspace" -w /github/workspace "$img" backstop --dry-run | tee backstop.txt
          [ "$(grep -c ': dry run: would dispatch\|: nothing to do$' backstop.txt)" = "$(grep -c '^\[\[entry\]\]' .github/backstop.toml)" ] \
            || { echo "::error::backstop: not one line per entry of .github/backstop.toml"; exit 1; }
          # branch-sweep (#595): a read-only dry run on this repository as nonroot
          # (the workflow token reads its branches, PRs and commits; nothing is deleted)
          docker run --rm -e GH_TOKEN "$img" branch-sweep --dry-run --repos .github | tee branch-sweep.txt
          grep -Eq '^branch-sweep: 1 repositories, would delete [0-9]+ branches, kept [0-9]+' branch-sweep.txt \
            || { echo "::error::branch-sweep: no summary line"; exit 1; }
          # release-sync-watch (#571): a read-only dry run on two repositories
          # (the workflow token reads their releases and the site's issues and runs)
          docker run --rm -e GH_TOKEN "$img" release-sync-watch --dry-run --repos .github,AntHocNet | tee release-sync.txt
          grep -Eq '^release-sync-watch: ' release-sync.txt \
            || { echo "::error::release-sync-watch: no summary line"; exit 1; }
          # os-refresh (swarm-routing/sim-containers#218): a dry run on the fixture report, read-only
          # as nonroot (the workflow token reads sim-containers' image runs and issues; nothing is dispatched)
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace "$img" os-refresh --dry-run \
            --repo swarm-routing/sim-containers --actor 'swarm-routing-bot[bot]' internal/osrefresh/testdata/fixable.json | tee os-refresh.txt
          grep -Eq '^os-refresh: 1 images, 3 fixable OS CVEs \(CRITICAL 0, HIGH 1, MEDIUM 2\); ' os-refresh.txt \
            || { echo "::error::os-refresh: no summary line"; exit 1; }
          # security-alerts (#629): a read-only dry run on this repository (the workflow
          # token reads its issues; an alert listing it may not read is reported, not fatal)
          docker run --rm -e GH_TOKEN "$img" security-alerts --dry-run --repos .github | tee security-alerts.txt
          grep -Eq '^security-alerts: 1 repositories, [0-9]+ open alerts' security-alerts.txt \
            || { echo "::error::security-alerts: no summary line"; exit 1; }
          # security-autofix (#629): the guard on two diffs in the mounted workspace,
          # read-only as nonroot, as reusable-security-autofix.yml runs it
          printf 'diff --git a/src/a.c b/src/a.c\n+fix\ndiff --git a/tests/test_a.c b/tests/test_a.c\n+test\n' > sa-good.diff
          printf 'diff --git a/.github/workflows/ci.yml b/.github/workflows/ci.yml\n+x\n' > sa-bad.diff
          docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace "$img" security-autofix guard sa-good.diff \
            || { echo "::error::security-autofix guard refused a tested fix"; exit 1; }
          rc=0; docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace "$img" security-autofix guard sa-bad.diff || rc=$?
          [ "$rc" = 1 ] || { echo "::error::security-autofix guard: a workflow change must exit 1, got $rc"; exit 1; }
          # check-headers (#531): read-only as nonroot, as reusable-licence-check.yml runs it, with no
          # git in the image (it reads the index); its self-test, then this
          # checkout, which must pass (the Python twin it was compared with is gone, #578)
          [ "$(docker run --rm "$img" check-headers --self-test)" = "self-test: PASS" ] \
            || { echo "::error::check-headers --self-test"; exit 1; }
          docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace" -w /github/workspace "$img" check-headers --dual '' . \
            || { echo "::error::check-headers on this checkout"; exit 1; }
          # nonroot, and no shell to fall back to
          user=$(docker image inspect -f '{{.Config.User}}' "$img")
          [ "$user" = nonroot:nonroot ] || { echo "::error::image user is '$user'"; exit 1; }
          if docker run --rm --entrypoint /bin/sh "$img" -c true 2> /dev/null; then
            echo "::error::the image has a shell"; exit 1
          fi
          echo "dispatcher, fixture tool, user and no-shell checks passed on $img"
          echo "img=$img" >> "$GITHUB_ENV"
      - name: Trivy on the image (HIGH/CRITICAL with a fix fails)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image --quiet \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$img"

  promote:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.image.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2
        with:
          egress-policy: audit
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested digest (registry copy, no rebuild)
        timeout-minutes: 5
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          # --prefer-index=false: copy the candidate's own manifest; the
          # default wraps a single image manifest in a new index, a new digest
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" -t "$IMAGE:latest" "$CANDIDATES@$DIGEST"
          got=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [ "$got" = "$DIGEST" ] || { echo "::error::promoted $got is not the tested $DIGEST"; exit 1; }
          { echo "promoted \`$IMAGE@$DIGEST\` (\`sha-${GITHUB_SHA::7}\`, \`latest\`)"; echo
            echo "pin it: \`docker run … $IMAGE@$DIGEST <tool>\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: SBOM (CycloneDX, Trivy pinned by digest)
        timeout-minutes: 5
        env:
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Trivy runs as root: write through stdout so the runner owns the file.
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY" image --quiet \
            --image-src remote --format cyclonedx "$REF" > sbom.cdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        timeout-minutes: 3
      - name: Sign (keyless, by digest)
        timeout-minutes: 3
        env:
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        timeout-minutes: 3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        timeout-minutes: 3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: Verify the signature
        timeout-minutes: 3
        env:
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci-tools-image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$REF" > /dev/null
          echo "signature verified for \`$REF\`" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: promote
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-dev-image-cleanup.yml
    with:
      packages: ci-tools-dev

  # The required check (#610): green when the change touches no build path
  # (go, dockerfile and image skipped) or when all three passed; red when
  # the path test or any of them failed or was cancelled.
  gate:
    name: ci-tools image gate
    needs: [changes, go, dockerfile, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verdict
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.go.result }}
          DOCKERFILE: ${{ needs.dockerfile.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "changes=$CHANGES build=$BUILD go=$GO dockerfile=$DOCKERFILE image=$IMAGE"
          if [ "$CHANGES" != success ]; then
            echo "::error::the changed-path test did not run to the end ($CHANGES)"; exit 1
          fi
          if [ "$BUILD" != true ]; then
            echo "no build path changed: nothing to build"; exit 0
          fi
          for r in "$GO" "$DOCKERFILE" "$IMAGE"; do
            if [ "$r" != success ]; then
              echo "::error::the ci-tools image build is red (go=$GO dockerfile=$DOCKERFILE image=$IMAGE)"; exit 1
            fi
          done
          echo "go, dockerfile and image passed"
