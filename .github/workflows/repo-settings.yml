name: repo-settings

# Repository settings as code (tools/repo-settings/repo_settings.py, #117):
# each repository's description, homepage, topics, merge settings and
# features, `main` and `release-tags` rulesets, security features, Actions
# policy and `release` environment, declared in the [settings] table of its
# .github/org-sync.toml and the profiles in templates/rulesets/.
# - push to main changing a profile or the tool: apply;
# - daily: check, and open, update or close one `[settings]` drift issue here;
# - on demand: plan (read-only) or apply.
#
# Token as org-bot.yml (#21): the org GitHub App's token when BOT_APP_ID and
# BOT_APP_PRIVATE_KEY are set, else the ORG_BOT_TOKEN secret. Either needs, in
# addition to org-bot's scopes, on every repository: Administration read and
# write, Contents read (each org-sync.toml and the workflows, private ones
# included), Actions read (the release environment). Until the token has
# Administration: write, apply reports each write as `refused` (exit 2) and
# the run ends with a warning, not a failure; the daily check still reports
# the drift. With neither, the workflow's own token is used, which only reads
# this repository's settings: the check then fails clearly.
# No pull_request trigger, so the token never runs on code from a PR.
# A private repository's values never reach the log or the issue: the tool
# prints only which of its fields differ.
on:
  schedule:
    - cron: '41 5 * * *'
  push:
    branches: [main]
    paths:
      - 'templates/rulesets/**'
      - 'tools/repo-settings/**'
      - '.github/workflows/repo-settings.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan (read-only) or apply'
        type: choice
        options: [plan, apply]
        default: plan
      repos:
        description: 'Space-separated repository names (default: every org repository)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: repo-settings
  cancel-in-progress: false

jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ github.event_name == 'schedule' && 'check' || github.event_name == 'push' && 'apply' || inputs.mode }}
      REPOS: ${{ inputs.repos }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test
        run: python3 -I tools/repo-settings/repo_settings.py --self-test
      - name: Bot token
        id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Run
        id: run
        env:
          ORG_BOT_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          [ -z "$ORG_BOT_TOKEN" ] && echo "::warning::no bot token (neither the App secrets nor ORG_BOT_TOKEN): only this repository is readable"
          rc=0
          # shellcheck disable=SC2086  # REPOS is a space-separated list
          python3 -I tools/repo-settings/repo_settings.py "$MODE" $REPOS > "$RUNNER_TEMP/settings.txt" || rc=$?
          cat "$RUNNER_TEMP/settings.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = apply ] && [ "$rc" = 2 ]; then
            echo "::warning::repo-settings: writes refused; the bot token needs Administration: write (#117)"
          elif [ "$MODE" = check ] && [ "$rc" = 1 ]; then
            echo "::notice::repo-settings: drift found (see the [settings] issue)"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: Open, update or close the drift issue
        if: github.event_name == 'schedule'
        env:
          RC: ${{ steps.run.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[settings] repository settings drifted from their declaration'
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
                  --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$RC" = 1 ]; then
            {
              echo "The daily \`repo_settings.py check\` found settings that differ from each repository's \`[settings]\` table: $RUN_URL"
              echo
              printf '%s\n' '```'
              grep -v ': in sync$' "$RUNNER_TEMP/settings.txt" | sed -n '1,200p'
              printf '%s\n' '```'
              echo
              echo "Fix the declaration (the repository's \`.github/org-sync.toml\`, or \`templates/rulesets/\`) or run the \`repo-settings\` workflow with \`mode: apply\`. A \`refused\` or \`unreadable\` line means the bot token (the App, else ORG_BOT_TOKEN) lacks Administration read and write, Contents read or Actions read (CONTRIBUTING \"Automation\", #117)."
            } > body.md
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file body.md
            else
              gh issue create --title "$title" --label chore --label packaging --label priority:P2 --body-file body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Every repository matches its declared settings again: $RUN_URL"
          fi
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### repo-settings ($MODE)"
            echo
            printf '%s\n' '```'
            cat "$RUNNER_TEMP/settings.txt" 2>/dev/null || echo "(no output)"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
