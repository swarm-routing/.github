name: Sync labels

# Applies labels.json (the org taxonomy) to the calling repository: creates
# missing labels and updates colour/description of existing ones. Never
# deletes a label; in a repository labels.json lists in own_release_labels,
# touches no release:* label (#998). A repo adopts it with a 10-line caller:
#
#   on: { workflow_dispatch: {}, schedule: [{ cron: '17 4 1 * *' }] }
#   permissions: { contents: read, issues: write }
#   jobs:
#     labels:
#       uses: swarm-routing/.github/.github/workflows/sync-labels.yml@main
#
# Dispatching it here syncs this repository itself.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          path: .org
          sparse-checkout: labels.json
          persist-credentials: false
      - name: Apply labels.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # a repository in own_release_labels (AntHocNet) keeps its own release:* labels (#998)
          python3 - <<'PY' > labels.tsv
          import json, os
          tax = json.load(open('.org/labels.json'))
          own = {r.lower() for r in tax.get('own_release_labels', [])}
          skip = os.environ['REPO'].split('/')[-1].lower() in own
          for l in tax['labels']:
              if skip and l['name'].lower().startswith('release:'):
                  continue
              print('\t'.join((l['name'], l['color'], l['description'])))
          PY
          while IFS=$'\t' read -r name color desc; do
            gh label create "$name" --repo "$REPO" --color "$color" --description "$desc" --force
          done < labels.tsv
