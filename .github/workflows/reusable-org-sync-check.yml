name: org-sync check (reusable)

# The org-managed files of the calling repository (its .github/org-sync.toml)
# must match the templates in swarm-routing/.github@main: the shared AGENTS.md
# sections and CLAUDE.md (only `@AGENTS.md`), the README badge row, SECURITY.md's reporting
# section, LICENSE, the ADR template, the org-sync workflow, the marketplace
# keys of .claude/settings.json, and the standard Makefile target names.
# On pull_request only the PR's own drift fails (swarm-routing/.github#159):
# `org_sync.py check --changed-only` against the PR's base fails an item only
# when it drifts at the head and either did not drift at the base (the same
# templates rendered on the base's tree, e.g. a config change whose render the
# PR did not apply) or the PR edited it by hand (its file, or a line inside its
# section; editing .github/org-sync.toml alone is not one). Drift a newer
# template already left on the base is a ::warning:: annotation per item and
# passes, so a template merge here never blocks a PR, not even one that only
# adds a [settings] key (HOPNET#32). A merge group (the merge queue, #130) is
# judged the same way, against the group's base (merge_group.base_sha), so a
# newer template does not stall the queue either. Pushes and every other
# event keep the full check, so drift on main stays red and visible;
# full-check-on-pr: true restores it on PRs too.
# A public contract (AGENTS.md rule 10): inputs are only ever added.
on:
  workflow_call:
    inputs:
      org-ref:
        description: 'swarm-routing/.github ref whose templates and tools/org-sync to check against'
        type: string
        default: main
      full-check-on-pr:
        description: 'On pull_request, check every managed item, not only those the PR touches (the behaviour before #159)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  org-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
          # a PR's merge commit and its first parent (the base), for --changed-only
          # (its diff, and the base's tree to tell the base's drift from the PR's);
          # a merge group's base can be several queued commits back: full history
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || (github.event_name == 'pull_request' && '2' || '1') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          ref: ${{ inputs.org-ref }}
          path: org
          persist-credentials: false
      - name: org-sync check
        env:
          CHANGED_ONLY: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !inputs.full-check-on-pr }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || 'HEAD^1' }}
        run: |
          scope=()
          if [ "$CHANGED_ONLY" = true ]; then scope=(--changed-only "$BASE"); fi
          python3 -I org/tools/org-sync/org_sync.py check "${scope[@]}" repo || {
            echo "::error::org-managed files drifted from swarm-routing/.github templates. Run locally: python3 org_sync.py conflicts . && python3 org_sync.py apply ."
            exit 1
          }
