name: org-sync check (reusable)

# The org-managed files of the calling repository (its .github/org-sync.toml)
# must match the templates in swarm-routing/.github at the commit the
# repository pins in .github/org-sync.lock (#586; written by `org_sync.py
# apply`, moved only by org-bot's refresh PR together with the rendered text),
# or at org-ref (default main) for a repository without a lock, for
# `pinned: false`, or when org-ref names another ref. So a template merge in
# swarm-routing/.github never turns another repository's check red, on a PR
# or on main: only the refresh PR brings the new templates in. The shared AGENTS.md
# sections and CLAUDE.md (only `@AGENTS.md`), the README badge row, SECURITY.md's reporting
# section, LICENSE, the ADR template, the org-sync workflow, the marketplace
# keys of .claude/settings.json, and the standard Makefile target names.
# On pull_request only the PR's own drift fails (swarm-routing/.github#159):
# `org_sync.py check --changed-only` against the PR's base fails an item only
# when it drifts at the head and either did not drift at the base (the same
# templates rendered on the base's tree, e.g. a config change whose render the
# PR did not apply) or the PR edited it by hand (its file, or a line inside its
# section; editing .github/org-sync.toml alone is not one). Drift a newer
# template already left on the base is a ::warning:: annotation per item and
# passes, so a template merge here never blocks a PR, not even one that only
# adds a [settings] key (HOPNET#32). A merge group (the merge queue, #130) is
# judged the same way, against the group's base (merge_group.base_sha), so a
# newer template does not stall the queue either. Pushes and every other
# event keep the full check, so drift on main stays red and visible;
# full-check-on-pr: true restores it on PRs too.
# A second step checks the repository's docs/references.bib with
# `fidelity.py bib check` (#308) once the file holds more than blank and `%`
# comment lines (stray text is checked, and fails): the seed org-sync places is
# a header alone, and checking it would fail a protocol repository
# whose fidelity sheet predates the bib, so a repository is checked from the
# PR that fills its bibliography on. When the bib has an entry (an `@` line)
# and CITATION.cff exists, the same step also runs `org_sync.py citation-refs
# --check`: CITATION.cff's `references:` must be the bib's render, with or
# without `citation = true` (CITATION.cff is a seed, so nothing else keeps it
# in step with the bib).
# A public contract (AGENTS.md rule 10): inputs are only ever added.
on:
  workflow_call:
    inputs:
      org-ref:
        description: 'swarm-routing/.github ref whose templates and tools/org-sync to check against (a repository with .github/org-sync.lock is checked at its pin while this is main and pinned is true)'
        type: string
        default: main
      pinned:
        description: 'Check against the swarm-routing/.github commit in .github/org-sync.lock when the repository has one and org-ref is main (#586)'
        type: boolean
        default: true
      full-check-on-pr:
        description: 'On pull_request, check every managed item, not only those the PR touches (the behaviour before #159)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  org-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
          # a PR's merge commit and its first parent (the base), for --changed-only
          # (its diff, and the base's tree to tell the base's drift from the PR's);
          # a merge group's base can be several queued commits back: full history
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || (github.event_name == 'pull_request' && '2' || '1') }}
      - name: template pin
        id: pin
        env:
          ORG_REF: ${{ inputs.org-ref }}
          PINNED: ${{ inputs.pinned }}
        run: |
          lock=repo/.github/org-sync.lock
          ref=$ORG_REF
          if [ "$PINNED" = true ] && [ "$ORG_REF" = main ] && [ -f "$lock" ]; then
            ref=$(sed -nE 's/^commit = "([0-9a-f]{40})"[[:space:]]*$/\1/p' "$lock")
            if [ -z "$ref" ]; then
              echo "::error::.github/org-sync.lock names no commit (a line commit = \"<40 hex>\"): run org_sync.py apply in a clean swarm-routing/.github checkout on main"
              exit 1
            fi
            echo "templates pinned at swarm-routing/.github@$ref (.github/org-sync.lock)"
          else
            echo "templates at swarm-routing/.github@$ref (no .github/org-sync.lock, or not pinned)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          ref: ${{ steps.pin.outputs.ref }}
          path: org
          persist-credentials: false
      - name: org-sync check
        env:
          CHANGED_ONLY: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !inputs.full-check-on-pr }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || 'HEAD^1' }}
          REF: ${{ steps.pin.outputs.ref }}
        run: |
          scope=()
          if [ "$CHANGED_ONLY" = true ]; then scope=(--changed-only "$BASE"); fi
          python3 -I org/tools/org-sync/org_sync.py check "${scope[@]}" repo || {
            echo "::error::org-managed files drifted from the swarm-routing/.github templates at ${REF}. Run locally: python3 org_sync.py conflicts . && python3 org_sync.py apply ."
            exit 1
          }
      - name: references
        run: |
          bib=repo/docs/references.bib
          # skipped only without the file or for the seed: blank and `%` comment lines alone
          if [ ! -f "$bib" ] || ! grep -Eqv '^[[:space:]]*(%.*)?$' "$bib"; then
            echo "docs/references.bib is absent or comments only: bib check skipped (swarm-routing/.github#308)"
            exit 0
          fi
          python3 -I org/tools/fidelity/fidelity.py bib check repo || {
            echo "::error::docs/references.bib breaks a references rule (swarm-routing/.github CONTRIBUTING \"References\"). Run locally: python3 -I tools/fidelity/fidelity.py bib check REPO"
            exit 1
          }
          # CITATION.cff references: from the bib, once the bib has an entry
          if [ ! -f repo/CITATION.cff ] || ! grep -Eq '^[[:space:]]*@' "$bib"; then
            echo "no CITATION.cff, or no entry in docs/references.bib: citation-refs check skipped"
            exit 0
          fi
          python3 -I org/tools/org-sync/org_sync.py citation-refs repo --check || {
            echo "::error::CITATION.cff references: are not the render of docs/references.bib (swarm-routing/.github CONTRIBUTING \"References\"). Run locally: python3 -I tools/org-sync/org_sync.py citation-refs REPO (in a swarm-routing/.github checkout), and commit CITATION.cff"
            exit 1
          }
