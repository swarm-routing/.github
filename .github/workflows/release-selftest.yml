name: Release self-test

# Proves reusable-release.yml from this checkout (so a PR that changes it is
# tested with its own version): a dry run on tools/release/fixture/, a caller
# with the minimal Commitizen config and a `make dist`, against this repo's own
# history (no tag yet, so the version is the first release, 0.1.0). Then the
# release it would have published is checked: every asset, SHA256SUMS, the
# CycloneDX SBOM, the provenance as *.intoto.jsonl and its Sigstore bundle,
# the notes' verify commands, the bump commit in the bundle, no tag pushed
# and no bump PR opened. The dry run's attestations are real, in this repo's
# attestation store, on the fixture's assets, so the dry run needs a write
# token: a pull request from a fork (read-only token) skips it, and the same
# self-test runs on main once the change is merged.
#
# The `zenodo` job then archives that release's assets as the release job's
# opt-in `zenodo` job does (#232), with this checkout's
# tools/zenodo/zenodo.py `publish-release`, against the self-test's fake
# Zenodo on 127.0.0.1 (no real Zenodo, no token): a first release becomes a
# new concept with every asset, a re-run writes nothing, a refused token
# fails. The job itself (the token, the environment, the real API) is proven
# on sandbox.zenodo.org and by the first caller's release.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reusable-release.yml', '.github/workflows/release-selftest.yml', 'tools/release/**', 'tools/zenodo/**']
  pull_request:
    paths: ['.github/workflows/reusable-release.yml', '.github/workflows/release-selftest.yml', 'tools/release/**', 'tools/zenodo/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # The union of what the called jobs declare: its publish and propose jobs
    # (skipped in a dry run) declare contents: write and pull-requests:
    # write, and a called workflow cannot raise the caller's grant.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-release.yml
    with:
      working-directory: tools/release/fixture
      dry-run: true

  check:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MODE: ${{ needs.release.outputs.mode }}
      VER: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      PR_URL: ${{ needs.release.outputs.pull-request }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.release.outputs.artifact }}
          path: rel
      - name: The release it would have published
        env:
          REPO: ${{ github.repository }}
        run: |
          set -x
          test "$MODE" = dry-run && test -z "$PR_URL"
          test "$VER" = 0.1.0 && test "$TAG" = v0.1.0
          cd rel/release
          for f in SHA256SUMS fixture-0.1.0.txt fixture-0.1.0.tar.gz \
                   github-0.1.0.cdx.json github-0.1.0.intoto.jsonl github-0.1.0.sigstore.json; do
            test -s "$f"
          done
          test "$(find . -type f | wc -l)" -eq 6
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3
          grep -q 'fixture 0.1.0' fixture-0.1.0.txt
          test "$(jq -r .bomFormat github-0.1.0.cdx.json)" = CycloneDX
          test "$(wc -l < github-0.1.0.intoto.jsonl)" -eq 1
          test "$(jq -r .payloadType github-0.1.0.intoto.jsonl)" = application/vnd.in-toto+json
          stmt="$(jq -r '.payload | @base64d' github-0.1.0.intoto.jsonl)"
          test "$(jq -r .predicateType <<< "$stmt")" = https://slsa.dev/provenance/v1
          # every asset and SHA256SUMS are subjects, each with its digest
          for f in SHA256SUMS fixture-0.1.0.txt fixture-0.1.0.tar.gz github-0.1.0.cdx.json; do
            test "$(jq -r --arg n "$f" '.subject[] | select(.name == $n) | .digest.sha256' <<< "$stmt")" = "$(sha256sum "$f" | cut -d' ' -f1)"
          done
          cd ../meta
          grep -q '^## v0.1.0 ' notes.md
          grep -qF 'sha256sum -c SHA256SUMS --ignore-missing' notes.md
          grep -qF "gh attestation verify fixture-0.1.0.tar.gz --repo ${REPO} --signer-workflow swarm-routing/.github/.github/workflows/reusable-release.yml" notes.md
          grep -qF 'predicate-type https://cyclonedx.org/bom' notes.md
          grep -qF -- '--bundle github-0.1.0.sigstore.json' notes.md
          git init -q "$RUNNER_TEMP/g"
          git -C "$RUNNER_TEMP/g" bundle list-heads "$PWD/release.bundle" | grep -q ' refs/tags/v0.1.0$'
      - name: Nothing pushed
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          test -z "$(git ls-remote --tags "${SERVER}/${REPO}.git" "refs/tags/${TAG}")"
          echo "dry run ${TAG}: complete, verified, nothing pushed or published" >> "$GITHUB_STEP_SUMMARY"

  zenodo:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.release.outputs.artifact }}
          path: ${{ runner.temp }}/rel
      - name: Archive the dry run's assets on a fake Zenodo
        run: |
          set -x
          python3 -I tools/zenodo/zenodo.py fake-zenodo --port-file "$RUNNER_TEMP/port" &
          for _ in $(seq 50); do [ -s "$RUNNER_TEMP/port" ] && break; sleep 0.2; done
          api="http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/api"
          files=("$RUNNER_TEMP"/rel/release/*)
          test "${#files[@]}" -eq 6
          push() {
            python3 -I tools/zenodo/zenodo.py publish-release --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
              --checkout tools/release/fixture --publish --api "$api" --allow-unreleased \
              --files "${files[@]}"
          }
          # a first release: a new concept, every asset
          ZENODO_TOKEN=t0k push | tee "$RUNNER_TEMP/first.txt"
          grep -q "archived as a new Zenodo concept (software, title 'release fixture', licence mit), files " "$RUNNER_TEMP/first.txt"
          for f in "${files[@]}"; do grep -qF "$(basename "$f")" "$RUNNER_TEMP/first.txt"; done
          grep -q 'version 10.0/z.200 (record 200), concept 500 (10.0/z.500)' "$RUNNER_TEMP/first.txt"
          grep -qF '| 500 | 10.0/z.500 | 10.0/z.200 |' "$GITHUB_STEP_SUMMARY"
          # the same release again: nothing written
          ZENODO_TOKEN=t0k push | tee "$RUNNER_TEMP/again.txt"
          grep -q 'already archived as 10.0/z.200' "$RUNNER_TEMP/again.txt"
          # a refused token fails the run
          if ZENODO_TOKEN=wrong push 2> "$RUNNER_TEMP/refused.txt"; then exit 1; fi
          grep -q 'HTTP 403' "$RUNNER_TEMP/refused.txt"
          echo "zenodo push ${TAG}: new concept, idempotent re-run, refusal (fake Zenodo)" >> "$GITHUB_STEP_SUMMARY"
