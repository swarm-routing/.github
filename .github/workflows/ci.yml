name: CI

# This repo's own checks. Uses the local checker (not @main) so a PR that
# changes it is tested with its own version.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Licence headers (the whole repo is tooling, so all of it is dual)
        run: |
          python3 -I tools/checks/check-headers.py --self-test
          python3 -I tools/checks/check-dco.py --self-test
          python3 -I tools/checks/check-headers.py --dual '' .
          for f in LICENSE LICENSE-MIT LICENSING.md; do test -f "$f"; done
      - name: org-sync self-test (tools/org-sync)
        run: python3 -I tools/org-sync/test_org_sync.py
      - name: epics self-test (tools/epics)
        run: python3 -I tools/epics/epics.py --self-test
      - name: zenodo self-test (tools/zenodo)
        run: python3 -I tools/zenodo/zenodo.py --self-test
      - name: org-bot self-test (tools/org-bot)
        run: python3 -I tools/org-bot/org_bot.py --self-test
      - name: fidelity self-test (tools/fidelity)
        run: python3 -I tools/fidelity/fidelity.py --self-test
      - name: docs-review self-test (tools/docs-review)
        run: python3 -I tools/docs-review/check_docs.py --self-test
      - name: ai-files-review self-test (tools/docs-review)
        run: python3 -I tools/docs-review/ai_files_review.py --self-test
      - name: protocol-review self-test (tools/protocol-review)
        run: python3 -I tools/protocol-review/check_invariants.py --self-test
      - name: pr-status self-test (tools/pr-status)
        run: python3 -I tools/pr-status/pr_status.py --self-test
      - name: lit-search self-test (tools/lit-search)
        run: python3 -I tools/lit-search/lit_search.py --self-test
      - name: repo-settings self-test (tools/repo-settings)
        run: python3 -I tools/repo-settings/repo_settings.py --self-test
      - name: Forms, labels, style parse
        run: |
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('ISSUE_TEMPLATE/*.yml')]"
          python3 -m json.tool labels.json > /dev/null
      - name: actionlint
        timeout-minutes: 5  # the two downloads (CONTRIBUTING invariant 5)
        env:
          # actionlint 1.7.12's own release, checked against its sha256 (the release's
          # checksums.txt): actionlint-py has no wheel, and its sdist runs a setup script
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          pip install --quiet --only-binary :all: shellcheck-py==0.10.0.1
          curl --proto =https --tlsv1.2 -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tgz" "$ACTIONLINT_URL"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

  # The reusable workflows run here from this checkout, so a PR that changes
  # one is tested with its own version.
  python:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      paths: tools
      tests: tools/org-sync/test_org_sync.py
      source: tools

  title:
    # Not on push: there is no title. On a merge group the reusable job skips
    # itself, which still reports `title / title` (a skipped check passes).
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: ./.github/workflows/reusable-pr-title.yml
