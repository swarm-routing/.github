name: CI

# This repo's own checks. Uses the local checker (not @main) so a PR that
# changes it is tested with its own version.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Licence headers (the whole repo is tooling, so all of it is dual)
        run: |
          python3 -I tools/checks/check-headers.py --self-test
          python3 -I tools/checks/check-headers.py --dual '' .
          for f in LICENSE LICENSE-MIT LICENSING.md; do test -f "$f"; done
      - name: org-sync self-test (tools/org-sync)
        run: python3 -I tools/org-sync/test_org_sync.py
      - name: epics self-test (tools/epics)
        run: python3 -I tools/epics/epics.py --self-test
      - name: zenodo self-test (tools/zenodo)
        run: python3 -I tools/zenodo/zenodo.py --self-test
      - name: org-bot self-test (tools/org-bot)
        run: python3 -I tools/org-bot/org_bot.py --self-test
      - name: fidelity self-test (tools/fidelity)
        run: python3 -I tools/fidelity/fidelity.py --self-test
      - name: protocol-review self-test (tools/protocol-review)
        run: python3 -I tools/protocol-review/check_invariants.py --self-test
      - name: pr-status self-test (tools/pr-status)
        run: python3 -I tools/pr-status/pr_status.py --self-test
      - name: Forms, labels, style parse
        run: |
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('ISSUE_TEMPLATE/*.yml')]"
          python3 -m json.tool labels.json > /dev/null
      - name: actionlint
        run: |
          pip install --quiet actionlint-py==1.7.7.23 shellcheck-py==0.10.0.1
          actionlint .github/workflows/*.yml

  # The reusable workflows run here from this checkout, so a PR that changes
  # one is tested with its own version.
  python:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      paths: tools
      tests: tools/org-sync/test_org_sync.py
      source: tools

  title:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-pr-title.yml
