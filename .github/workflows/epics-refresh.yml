name: epics-refresh

# The epic lists follow the issues with no hand step (#572): each public
# repository's README `## Epics`, ROADMAP.md#epics and the profile here are
# regenerated by org-bot's `epics` task (tools/org-bot/org_bot.py, which runs
# tools/epics/epics.py), one refresh PR per repository whose list drifted,
# auto-merged through its queue.
#
# Triggers:
# - repository_dispatch `epics`: every repository's org-managed
#   epics-changed.yml sends it, with the bot token, when an issue there
#   changes in a way that can move a list (an `epic` label added or removed;
#   an epic opened or edited; an epic or a sub-issue closed, reopened,
#   deleted or transferred). The payload's `repository` is only logged
#   (checked as swarm-routing/<name>): the run refreshes every public
#   repository from this repository's main, never the sender's code;
# - issues here, with the same filter (this repository has no org-sync kind,
#   so it carries the trigger itself);
# - hourly: a sub-issue added or removed raises no issue event, and a
#   dispatch that failed is caught within the hour;
# - workflow_dispatch.
#
# Debounce: an event first waits five minutes in the `wait` job, whose
# concurrency group cancels the waiting run when a newer event arrives, so
# a burst (an epic closed with its sub-issues, a batch of labels) makes one
# refresh, and one PR per repository, at its end. The `refresh` job has its
# own group that never cancels: a refresh already writing finishes, and the
# newest pending one runs after it. org-bot never proposes the same change
# twice, so a run with nothing new opens nothing.
#
# Token: the org App's installation token (.github/actions/bot-token), as
# org-bot.yml (Contents, Pull requests, Issues read); with none, a dry run.
on:
  repository_dispatch:
    types: [epics]
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred, labeled, unlabeled]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Fetch and print what would be proposed'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wait:
    if: >-
      github.event_name == 'repository_dispatch' || (github.event_name == 'issues' && (
        ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'epic') ||
        ((github.event.action == 'opened' || github.event.action == 'edited') && contains(github.event.issue.labels.*.name, 'epic')) ||
        ((github.event.action == 'closed' || github.event.action == 'reopened' || github.event.action == 'deleted' || github.event.action == 'transferred') &&
          (contains(github.event.issue.labels.*.name, 'epic') || github.event.issue.parent_issue_url))
      ))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    concurrency:
      group: epics-refresh-wait
      cancel-in-progress: true
    env:
      SENDER: ${{ github.event.client_payload.repository || github.repository }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - name: Wait for the burst to end
        timeout-minutes: 7
        run: |
          # only swarm-routing/<name> is logged; anything else is refused, never interpolated
          if ! [[ "$SENDER" =~ ^swarm-routing/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::epics: repository '${SENDER:0:80}' is not swarm-routing/<name>"
            exit 1
          fi
          # the sender is not printed: it may be a private repository (#622)
          echo "epics changed in an org repository; waiting 5 minutes (a newer event cancels this wait)"
          sleep 300

  refresh:
    needs: wait
    # after a wait that ran to its end, or with no wait (schedule, dispatch)
    if: >-
      always() && (needs.wait.result == 'success' ||
        (needs.wait.result == 'skipped' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: epics-refresh
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bot token
        id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Refresh the epic lists
        env:
          ORG_BOT_TOKEN: ${{ steps.bot.outputs.token }}
          ORG_BOT_GIT_NAME: ${{ steps.bot.outputs.git-name }}
          ORG_BOT_GIT_EMAIL: ${{ steps.bot.outputs.git-email }}
        run: |
          set -o pipefail
          args=(run --task epics)
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ -z "$ORG_BOT_TOKEN" ] && echo "::warning::no bot token (neither the App secrets nor ORG_BOT_TOKEN): dry run only"
          python3 -I tools/org-bot/org_bot.py "${args[@]}" | tee "$RUNNER_TEMP/epics.txt"
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### epics-refresh (${GITHUB_EVENT_NAME})"
            echo
            printf '%s\n' '```'
            cat "$RUNNER_TEMP/epics.txt" 2>/dev/null || echo "(no output)"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
