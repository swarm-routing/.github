name: org-bot

# Keep every public org repository in step with this one, through PRs it opens
# (tools/org-bot/org_bot.py):
# - epics: the README's `## Epics` section, plus ROADMAP.md#epics and the
#   profile here, regenerated from the issues;
# - org-sync: `org_sync.py apply` in each repository with a
#   .github/org-sync.toml, so a template change here reaches every adopting
#   repository the same day instead of turning its check red;
# - zenodo: `zenodo.py record --write` then `org_sync.py apply` in each
#   repository with a CITATION.cff whose concept Zenodo holds but the
#   repository does not name yet (a first release), so CITATION.cff's doi,
#   zenodo_concept and the README DOI badge are never typed by hand (#232);
# - swarm-core-pin: `check-swarm-core-pin.py --bump` in each protocol
#   repository whose pin is stale after a swarm-core core/ change, on one PR
#   per repository (org-bot/swarm-core-pin) updated in place (#208). Every
#   three hours on its own as well: a stale pin blocks every PR there.
# Daily, on every push to main that changes the templates or the generators,
# and on demand. One PR per repository and task; the same change is never
# proposed twice, and an older bot PR is closed as superseded. Where the
# repository's main has a merge queue, the bot enables auto-merge on its own
# PR, which then lands through the queue once green (#178); elsewhere a person
# or an agent merges it.
#
# Token (#21): the org GitHub App's installation token, made by
# .github/actions/bot-token when the BOT_APP_ID and BOT_APP_PRIVATE_KEY org
# secrets are set (commits then come from the App's `<slug>[bot]`); else the
# ORG_BOT_TOKEN secret, a fine-grained personal access token on the
# swarm-routing org, all repositories, with Contents, Pull requests and
# Workflows read and write. The App has its own rate limit; the personal token
# shares its owner's 5,000 requests an hour. PRs opened with either run CI;
# PRs opened with the workflow's GITHUB_TOKEN would not. With neither, every
# run is a dry run. This workflow has no pull_request trigger, so the token
# never runs on code from a pull request.
on:
  schedule:
    - cron: '17 4 * * *'
    - cron: '41 */3 * * *'  # swarm-core-pin alone (#208)
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'tools/org-sync/**'
      - 'tools/epics/**'
      - 'tools/org-bot/**'
      - 'tools/zenodo/**'
      - 'tools/checks/check-swarm-core-pin.py'
  workflow_dispatch:
    inputs:
      task:
        description: 'What to refresh'
        type: choice
        options: [all, epics, org-sync, zenodo, swarm-core-pin]
        default: all
      repos:
        description: 'Comma-separated repository names (default: every public repo)'
        type: string
        default: ''
      dry-run:
        description: 'Clone read-only and print what would be proposed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: org-bot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TASK: ${{ inputs.task || (github.event.schedule == '41 */3 * * *' && 'swarm-core-pin') || 'all' }}
      REPOS: ${{ inputs.repos }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test
        run: python3 -I tools/org-bot/org_bot.py --self-test
      - name: Bot token
        id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Refresh
        env:
          ORG_BOT_TOKEN: ${{ steps.bot.outputs.token }}
          ORG_BOT_GIT_NAME: ${{ steps.bot.outputs.git-name }}
          ORG_BOT_GIT_EMAIL: ${{ steps.bot.outputs.git-email }}
        run: |
          set -o pipefail
          args=(run --task "$TASK")
          [ -n "$REPOS" ] && args+=(--repos "$REPOS")
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ -z "$ORG_BOT_TOKEN" ] && echo "::warning::no bot token (neither the App secrets nor ORG_BOT_TOKEN): dry run only"
          python3 -I tools/org-bot/org_bot.py "${args[@]}" | tee "$RUNNER_TEMP/org-bot.txt"
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### org-bot ($TASK)"
            echo
            printf '%s\n' '```'
            cat "$RUNNER_TEMP/org-bot.txt" 2>/dev/null || echo "(no output)"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
