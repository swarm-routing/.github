name: org-bot

# Keep every public org repository in step with this one, through PRs it opens
# (tools/org-bot/org_bot.py):
# - epics: the README's `## Epics` section, plus ROADMAP.md#epics and the
#   profile here, regenerated from the issues;
# - org-sync: `org_sync.py apply` in each repository with a
#   .github/org-sync.toml, so a template change here reaches every adopting
#   repository the same day instead of turning its check red;
# - zenodo: `zenodo.py record --write` then `org_sync.py apply` in each
#   repository with a CITATION.cff whose concept Zenodo holds but the
#   repository does not name yet (a first release), so CITATION.cff's doi,
#   zenodo_concept and the README DOI badge are never typed by hand (#232);
# - swarm-core-pin: `check-swarm-core-pin.py --bump` in each protocol
#   repository whose pin is stale after a swarm-core core/ change, on one PR
#   per repository (org-bot/swarm-core-pin) updated in place (#208). Every
#   three hours on its own as well: a stale pin blocks every PR there.
#   When the same repository also needs a template refresh, both go in that
#   one PR, so neither waits on the other's required check (#429).
# - release-lock (daily, and hourly with `release`): every other root
#   `<name>.lock` (AntHocNet's ns3-tools.lock) moved to its dependency's newest
#   release by `release_lock.py bump --write`, one PR per repository on
#   org-bot/release-lock, updated in place; the consumer's CI judges it and the
#   merge queue lands it only when green; a lock a hand PR changes is left
#   alone (#478).
# - release-rebuild (hourly, `release`): a repository whose open bot/release
#   PR is behind its base gets its release caller dispatched with mode bump
#   again, with the increment the PR records, so the PR is rebuilt (#430);
# - release-aftercare (hourly, `release`): for a release younger than 14 days,
#   the roadmap's shipped block and CONTRIBUTING's DOI rows (zenodo.py
#   shipped) and, here, the archived-releases table (zenodo.py table), every
#   DOI read from Zenodo, in one auto-merge PR per repository; then what
#   release_check.py after still finds, as one comment on the site's
#   [release-sync] issue (#465); release-lock runs in the same hourly group.
# - release-sync (hourly, with `hourly` and `release-aftercare`; #571): the Go
#   tool `release-sync-watch` (cmd/release-sync-watch, from the ci-tools image
#   by digest) dispatches the site's release-sync.yml with repository and tag
#   for a release published more than an hour ago that has no
#   `[release-sync] <repo> <tag>` issue or no green run named for it, so no
#   one dispatches it by hand.
# - bestpractices (daily, with `all`): `.bestpractices.json` regenerated in every
#   public repository by the Go tool `bestpractices answers --write`
#   (cmd/bestpractices; its binary copied out of the ci-tools image by digest,
#   because the answers read git's last commit date and the distroless image
#   has no git), one PR when it changes (#531). Also for one repository on its
#   repository_dispatch `bestpractices`, which that repository's org-managed
#   bestpractices-evidence.yml sends when a push to main touches the evidence
#   files; those runs have their own concurrency group per repository, so a
#   pending org-release run is never replaced by one.
# - branch-sweep (daily, with `all`; #595): the Go tool `branch-sweep`
#   (cmd/branch-sweep, run from the ci-tools image by digest) deletes stale
#   branches in every unarchived org repository: a branch whose PRs all closed
#   more than 2 days ago with no commit since and no open PR on it, and a
#   claude/* or org-bot/* branch with no PR and no commit for 7 days; never the
#   default branch, main, bot/release, gh-readonly-queue/*, release branches, a
#   protected branch or a tag. Each deletion is a line of the run's summary.
# - project-sync (hourly, with `hourly` and `all`; and on repository_dispatch
#   `project`, which every public repository's org-managed epics-changed.yml
#   sends when an issue change can move the org Project: a `release:*`,
#   `rcapa`, `ns3-upstream` or `priority:*` label, or such an issue closed,
#   reopened, deleted or transferred; #541): the Go tool `project-sync`
#   (cmd/project-sync, from the ci-tools image by digest) makes the public
#   org Project "Swarm routing plan" match templates/projects/plan.json, a
#   generated read-only view (hand edits overwritten, private repositories
#   never added). Those runs have their own concurrency group: a burst of
#   label changes makes at most one run and one pending, never in place of
#   an org-release run.
# - security-alerts (hourly, with `hourly`, and daily with `all`; #629): the Go
#   tool `security-alerts` (cmd/security-alerts): one `security` ticket per
#   open security alert in every org repository, kept current and closed when
#   the alert closes; on Mondays (and a dispatch of `security-report`) also the
#   summary issue `[security] open alerts across the org` here.
# - fan-out in bounded batches (#505): epics, org-sync and bestpractices open
#   at most 4 new PRs at a time, then wait (2 min, then while the org holds
#   more than 10 queued runs, 30 min in all) before the next 4; what the run
#   cannot open in that time is deferred, and the hourly run (org-sync) or
#   the next daily one proposes it. A release's jobs never queue behind a
#   whole-org refresh again (on 2026-11-16 a publish waited 19 min).
# Daily, on every push to main that changes the templates or the generators,
# on demand, and on each release (#479): reusable-release.yml (and
# AntHocNet's release.yml) send repository_dispatch `org-release` with
# {repository, tag} once it is published; this workflow then runs `release`
# for that repository (its aftercare, without waiting for an hourly slot
# GitHub may skip, as it did 12:57-16:30 UTC on 2026-11-15) and
# `release-lock` (plus `swarm-core-pin` for a swarm-core release) in every
# repository, so the consumers' locks move at once. The hourly run is the
# backstop: Zenodo may mint the DOI after the event, and the next hour records it. One PR per repository and task; the same change is never
# proposed twice, and an older bot PR is closed as superseded. Where the
# repository's main has a merge queue, the bot enables auto-merge on its own
# PR, which then lands through the queue once green (#178); elsewhere a person
# or an agent merges it.
#
# Token (#21): the org GitHub App's installation token, made by
# .github/actions/bot-token when the BOT_APP_ID and BOT_APP_PRIVATE_KEY org
# secrets are set (commits then come from the App's `<slug>[bot]`); else the
# ORG_BOT_TOKEN secret, a fine-grained personal access token on the
# swarm-routing org, all repositories, with Contents, Pull requests,
# Workflows, Actions (release-rebuild's dispatch) and Issues
# (release-aftercare's comment) read and write. The App has its own rate limit; the personal token
# shares its owner's 5,000 requests an hour. PRs opened with either run CI;
# PRs opened with the workflow's GITHUB_TOKEN would not. With neither, every
# run is a dry run. This workflow has no pull_request trigger, so the token
# never runs on code from a pull request.
on:
  schedule:
    - cron: '17 4 * * *'
    - cron: '41 */3 * * *'  # swarm-core-pin alone (#208)
    - cron: '23 * * * *'    # hourly: release-rebuild, release-aftercare, release-lock, org-sync (#430, #465, #505)
  repository_dispatch:
    types: [org-release, bestpractices, project]
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'tools/org-sync/**'
      - 'tools/epics/**'
      - 'tools/org-bot/**'
      - 'tools/zenodo/**'
      - 'tools/checks/check-swarm-core-pin.py'
      - 'tools/checks/release_lock.py'
  workflow_dispatch:
    inputs:
      task:
        description: 'What to refresh'
        type: choice
        options: [all, epics, org-sync, zenodo, swarm-core-pin, release-lock, release, hourly, release-rebuild, release-aftercare, bestpractices, branch-sweep, release-sync, project-sync, security-alerts, security-report]
        default: all
      repos:
        description: 'Comma-separated repository names (default: every public repo)'
        type: string
        default: ''
      dry-run:
        description: 'Clone read-only and print what would be proposed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One pending run per group, and a newer pending run replaces it. So:
  # - a bestpractices nudge queues per repository, never in place of an
  #   org-release run, and a project event in its own group (every run syncs
  #   the whole project, so replacing a pending one loses nothing);
  # - a workflow_dispatch has its own group keyed on its inputs (#614), so a
  #   targeted dispatch (one task, some repositories) is never replaced by a
  #   scheduled or push run, nor by a dispatch with other inputs; only a later
  #   dispatch with the same inputs, which does the same work, replaces it.
  #   A dispatch may then run beside the scheduled run: every task is
  #   idempotent (one PR per repository and task, updated in place).
  group: >-
    ${{ github.event.action == 'bestpractices' && format('org-bot-bestpractices-{0}', github.event.client_payload.repository)
        || github.event.action == 'project' && 'org-bot-project'
        || github.event_name == 'workflow_dispatch' && format('org-bot-dispatch-{0}-{1}-{2}', inputs.task, inputs.repos, inputs.dry-run)
        || 'org-bot' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # longest green run: 5.5 min; the fan-out throttle may wait up to 30 more
    # (ORG_BOT_BATCH_WAIT, #505) before it defers the rest to the next run
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TASK: ${{ inputs.task || (github.event.action == 'bestpractices' && 'bestpractices') || (github.event.action == 'project' && 'project-sync') || (github.event_name == 'repository_dispatch' && 'release') || (github.event.schedule == '41 */3 * * *' && 'swarm-core-pin') || (github.event.schedule == '23 * * * *' && 'hourly') || 'all' }}
      REPOS: ${{ inputs.repos }}
      # org-release (#479): the released repository, checked below before use
      RELEASED: ${{ github.event.client_payload.repository }}
      RELEASED_TAG: ${{ github.event.client_payload.tag }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test
        run: python3 -I tools/org-bot/org_bot.py --self-test
      - name: The bestpractices tool (the ci-tools image's binary, by digest)
        if: env.TASK == 'all' || env.TASK == 'bestpractices'
        timeout-minutes: 3
        env:
          IMG: ghcr.io/swarm-routing/ci-tools@sha256:47de777a458c52a808a970ba1c2cd1a557c991c26deebde249f5ee9c95a75547
        run: |
          set -euo pipefail
          docker pull --quiet "$IMG" > /dev/null
          id=$(docker create "$IMG")
          docker cp "$id:/usr/local/bin/bestpractices" "$RUNNER_TEMP/bestpractices"
          docker rm "$id" > /dev/null
          "$RUNNER_TEMP/bestpractices" --help > /dev/null
          echo "ORG_BOT_BESTPRACTICES=$RUNNER_TEMP/bestpractices" >> "$GITHUB_ENV"
      - name: Bot token
        id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Refresh
        id: refresh
        if: env.TASK != 'branch-sweep' && env.TASK != 'release-sync' && env.TASK != 'project-sync' && env.TASK != 'security-alerts' && env.TASK != 'security-report'
        env:
          ORG_BOT_TOKEN: ${{ steps.bot.outputs.token }}
          ORG_BOT_GIT_NAME: ${{ steps.bot.outputs.git-name }}
          ORG_BOT_GIT_EMAIL: ${{ steps.bot.outputs.git-email }}
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ] && [ "$TASK" = bestpractices ]; then
            # bestpractices (#531): only swarm-routing/<name>, refused otherwise, never interpolated
            if ! [[ "$RELEASED" =~ ^swarm-routing/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::bestpractices: repository '${RELEASED:0:80}' is not swarm-routing/<name>"
              exit 1
            fi
            # the repository is not printed here (it may be private, #622): org_bot.py names it when public
            echo "bestpractices: one repository" | tee "$RUNNER_TEMP/org-bot.txt"
            python3 -I tools/org-bot/org_bot.py run --task bestpractices --repos "${RELEASED#swarm-routing/}" | tee -a "$RUNNER_TEMP/org-bot.txt"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then
            # only swarm-routing/<name>; anything else is refused, never interpolated
            if ! [[ "$RELEASED" =~ ^swarm-routing/[A-Za-z0-9_.-]+$ ]] || ! [[ "$RELEASED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::org-release: repository '${RELEASED:0:80}' / tag '${RELEASED_TAG:0:40}' is not swarm-routing/<name> and vX.Y.Z"
              exit 1
            fi
            REPOS="${RELEASED#swarm-routing/}"
            # the repository is not printed here (it may be private, #622): org_bot.py names it when public
            echo "org-release: ${RELEASED_TAG}" | tee "$RUNNER_TEMP/org-bot.txt"
          fi
          args=(run --task "$TASK")
          [ -n "$REPOS" ] && args+=(--repos "$REPOS")
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ -z "$ORG_BOT_TOKEN" ] && echo "::warning::no bot token (neither the App secrets nor ORG_BOT_TOKEN): dry run only"
          if [ "$GITHUB_EVENT_NAME" != repository_dispatch ]; then
            python3 -I tools/org-bot/org_bot.py "${args[@]}" | tee -a "$RUNNER_TEMP/org-bot.txt"
            exit 0
          fi
          # org-release: the released repository, then the consumers (every
          # repository's locks; the swarm-core pin after a swarm-core release).
          # Each invocation runs even when the one before it failed; the step fails
          # at the end if any of them failed.
          failed=0
          python3 -I tools/org-bot/org_bot.py "${args[@]}" | tee -a "$RUNNER_TEMP/org-bot.txt" || failed=1
          consumers=release-lock
          [ "$REPOS" = ns3-swarm-core ] && consumers="swarm-core-pin release-lock"
          for task in $consumers; do
            python3 -I tools/org-bot/org_bot.py run --task "$task" | tee -a "$RUNNER_TEMP/org-bot.txt" || failed=1
          done
          exit "$failed"
      - name: Stale branches (branch-sweep, daily)
        id: sweep
        # cmd/branch-sweep from the ci-tools image by digest (#595): in every
        # unarchived org repository, a branch whose PRs all closed more than 2
        # days ago (no commit since, no open PR on it) and a claude/* or org-bot/*
        # branch with no PR and no commit for 7 days; never the default branch,
        # main, bot/release, gh-readonly-queue/*, release branches, a protected
        # branch or a tag. The daily run and a dispatch of `all` or `branch-sweep`;
        # it runs even when Refresh failed. Deleting needs Contents: write.
        if: >-
          ${{ !cancelled() && steps.bot.outcome == 'success'
              && ((github.event_name == 'schedule' && env.TASK == 'all')
                  || (github.event_name == 'workflow_dispatch' && (env.TASK == 'all' || env.TASK == 'branch-sweep'))) }}
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          IMG: ghcr.io/swarm-routing/ci-tools@sha256:47de777a458c52a808a970ba1c2cd1a557c991c26deebde249f5ee9c95a75547  # promoted from bd03540 (#650)
        run: |
          set -o pipefail
          args=()
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ -n "$REPOS" ] && args+=(--repos "$REPOS")
          docker run --rm -e GH_TOKEN "$IMG" branch-sweep "${args[@]}" | tee -a "$RUNNER_TEMP/org-bot.txt"
      - name: The site's release sync (release-sync-watch, hourly)
        id: sync
        # cmd/release-sync-watch from the ci-tools image by digest (#571): for the
        # newest release of every public org repository published 1 hour to 14
        # days ago, when the site has no `[release-sync] <repo> <tag>` issue or
        # no green release-sync.yml run named for it, dispatch release-sync.yml
        # with repository and tag; at most once per release per 3 hours, at most
        # 2 site runs active. The hourly run and a dispatch of `hourly`,
        # `release-aftercare` or `release-sync`; it runs even when Refresh
        # failed. Dispatching needs Actions: write on the site.
        if: >-
          ${{ !cancelled() && steps.bot.outcome == 'success'
              && (env.TASK == 'hourly' || env.TASK == 'release-aftercare' || env.TASK == 'release-sync') }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          IMG: ghcr.io/swarm-routing/ci-tools@sha256:47de777a458c52a808a970ba1c2cd1a557c991c26deebde249f5ee9c95a75547  # promoted from bd03540 (#650)
        run: |
          set -o pipefail
          args=()
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ -n "$REPOS" ] && args+=(--repos "$REPOS")
          docker run --rm -e GH_TOKEN "$IMG" release-sync-watch "${args[@]}" | tee -a "$RUNNER_TEMP/org-bot.txt"
      - name: The org Project (project-sync)
        id: project
        # cmd/project-sync from the ci-tools image by digest (#541): the public
        # org Project generated from templates/projects/plan.json (this
        # checkout, mounted read-only). The hourly and daily runs, a dispatch of
        # `all`, `hourly` or `project-sync`, and repository_dispatch `project`;
        # it runs even when Refresh failed. Needs the App's organization
        # Projects permission (read and write).
        if: >-
          ${{ !cancelled() && steps.bot.outcome == 'success'
              && (env.TASK == 'all' || env.TASK == 'hourly' || env.TASK == 'project-sync') }}
        # a full write budget (400 writes, about 200 new items) took over 14
        # minutes on the first sync (run 44968941723: 189 items in 14 min,
        # GitHub's mutations ~2 s each plus the pacing); a run with nothing
        # new reads only, in under a minute
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          IMG: ghcr.io/swarm-routing/ci-tools@sha256:4c57d100f9e6a745c6c7e669c92b0fc5a7441f966f2f936b1de0ffc37abb9b3d  # promoted from fcef343: has the visibility fix (#655)
        run: |
          set -o pipefail
          args=()
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace \
            "$IMG" project-sync "${args[@]}" | tee -a "$RUNNER_TEMP/org-bot.txt"
      - name: Security alert tickets (security-alerts, hourly)
        id: security
        # cmd/security-alerts from the ci-tools image by digest (#629): one
        # `security` issue per open code-scanning, Dependabot and
        # secret-scanning alert in every unarchived org repository (the list
        # comes from the org, so a new repository is covered), priority from
        # severity, P1 past the SLA (critical 14 days, medium or higher 45),
        # updated in place, closed when the alert is no longer open.
        # `--report` (the daily run on Mondays, and a dispatch of
        # `security-report`) also refreshes the summary issue here. The hourly
        # run, the daily one, and a dispatch of `hourly`, `security-alerts` or
        # `security-report`; it runs even when Refresh failed. Needs the App's
        # Code scanning, Dependabot and Secret scanning alerts read, Issues write.
        if: >-
          ${{ !cancelled() && steps.bot.outcome == 'success'
              && (env.TASK == 'hourly' || env.TASK == 'security-alerts' || env.TASK == 'security-report'
                  || (github.event_name == 'schedule' && env.TASK == 'all')) }}
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          IMG: ghcr.io/swarm-routing/ci-tools@sha256:4c57d100f9e6a745c6c7e669c92b0fc5a7441f966f2f936b1de0ffc37abb9b3d  # promoted from fcef343 (#651, #649)
        run: |
          set -o pipefail
          args=()
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          [ -n "$REPOS" ] && args+=(--repos "$REPOS")
          if [ "$TASK" = security-report ] || { [ "$TASK" = all ] && [ "$(date -u +%u)" = 1 ]; }; then
            args+=(--report)
          fi
          docker run --rm -e GH_TOKEN "$IMG" security-alerts "${args[@]}" | tee -a "$RUNNER_TEMP/org-bot.txt"
      - name: Summary
        if: ${{ always() }}
        env:
          EVENT: ${{ github.event_name }}
          STEP_REFRESH: ${{ steps.refresh.outcome }}
          STEP_SWEEP: ${{ steps.sweep.outcome }}
          STEP_SYNC: ${{ steps.sync.outcome }}
          STEP_SECURITY: ${{ steps.security.outcome }}
          STEP_PROJECT: ${{ steps.project.outcome }}
        run: |
          # which tasks ran, and how each ended (#614); the repositories are
          # not listed (a dispatch may name a private one, #622)
          ran=""
          if [ "$STEP_REFRESH" != skipped ] && [ -n "$STEP_REFRESH" ]; then
            ran="$TASK: $STEP_REFRESH"
            if [ "$EVENT" = repository_dispatch ] && [ "$TASK" = release ]; then
              ran="$ran (then release-lock, and swarm-core-pin after a swarm-core release)"
            fi
          fi
          [ "$STEP_SWEEP" != skipped ] && [ -n "$STEP_SWEEP" ] && ran="${ran:+$ran; }branch-sweep: $STEP_SWEEP"
          [ "$STEP_SYNC" != skipped ] && [ -n "$STEP_SYNC" ] && ran="${ran:+$ran; }release-sync: $STEP_SYNC"
          [ "$STEP_PROJECT" != skipped ] && [ -n "$STEP_PROJECT" ] && ran="${ran:+$ran; }project-sync: $STEP_PROJECT"
          [ "$STEP_SECURITY" != skipped ] && [ -n "$STEP_SECURITY" ] && ran="${ran:+$ran; }security-alerts: $STEP_SECURITY"
          {
            echo "### org-bot ($TASK)"
            echo
            echo "Event: $EVENT${DRY_RUN:+, dry run: $DRY_RUN}; tasks run: ${ran:-none}"
            echo
            printf '%s\n' '```'
            cat "$RUNNER_TEMP/org-bot.txt" 2>/dev/null || echo "(no output)"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
