name: Reusable dev-image cleanup

# The 2-day retention of development images (epic #370, #371). A repository's
# campaign images live in its `<repo>-dev` package; a job of its own main
# pipeline calls this workflow, which deletes the package's versions older
# than `days` that no committed file pins:
#
#   tools/images/retention.py sweep --org <owner> --package <pkg> --days N --apply
#
# The script first lists every pin (`retention.py pinned`): each
# `sha256:<64 hex>` and each `ghcr.io/<owner>/<package>:<tag>` in the tracked
# text files of the default branch of every public, unarchived, non-fork
# repository of the owner, and of the head of every open swarm-routing/benchmarks
# pull request (run manifests, ##PROV## lines, campaign plans, results). It
# never deletes:
#   - a version whose digest, or any of whose tags, is pinned;
#   - the package's newest image (GHCR refuses to delete the last version);
#   - an untagged version (the children and attestations of tagged images,
#     swarm-routing/ns3-containers#36);
#   - the signatures and attestations (`sha256-<hex>.sig`, ...) of a kept image;
#   - anything in a package whose name does not end in `-dev`, or in `ns3-dev`,
#     which keeps the frozen official base images (ns3-containers sweeps its
#     candidates itself).
# It fails closed: if a repository or a pull request cannot be read, nothing
# is deleted. A failed delete fails the job; each package's result is a line
# of the job summary. `dry-run: true` lists what would go and deletes nothing.
#
# Permissions. This file declares none, so its job runs with exactly the
# token the caller's job grants (a called workflow can only reduce it, as
# reusable-ns3-image.yml's header explains): { contents: read, packages: write }.
# The calling repository needs the package's Admin role (package settings,
# "Manage Actions access"), which the repository whose workflow pushed the
# package with github.token has.
#
# Caller (a job of the owning repository's main pipeline):
#
#   jobs:
#     dev-images:
#       if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
#       permissions: { contents: read, packages: write }
#       uses: swarm-routing/.github/.github/workflows/reusable-dev-image-cleanup.yml@main
#       with:
#         packages: anthocnet-dev
#
# The script is tools/images/retention.py in swarm-routing/.github; its
# --self-test runs against a fake registry and fake GitHub in ci.yml.
on:
  workflow_call:
    inputs:
      packages:
        description: "Space-separated `<repo>-dev` packages of the caller's owner, e.g. `anthocnet-dev`"
        type: string
        required: true
      days:
        description: "Age in days after which an unpinned version is deleted"
        type: number
        default: 2
      dry-run:
        description: "List what would be deleted; delete nothing"
        type: boolean
        default: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `permissions:` here on purpose: see the header (the caller's grant).
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          path: .org
          sparse-checkout: tools/images
          persist-credentials: false
      - name: Delete unpinned versions older than ${{ inputs.days }} days
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
          PACKAGES: ${{ inputs.packages }}
          DAYS: ${{ inputs.days }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          apply=--apply
          if [ "$DRY_RUN" = true ]; then apply=; fi
          [ -n "$PACKAGES" ] || { echo "::error::no package to sweep"; exit 1; }
          rc=0
          for p in $PACKAGES; do
            echo "::group::$p"
            # shellcheck disable=SC2086  # $apply is empty or one flag
            python3 -I .org/tools/images/retention.py sweep --org "$ORG" --package "$p" \
              --days "$DAYS" $apply --summary "$GITHUB_STEP_SUMMARY" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
