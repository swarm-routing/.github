#
# Reviewed SonarQube Cloud verdicts, applied by sonar_triage.py through the
# sonar-triage workflow (swarm-routing/.github#425). One entry per finding
# KEY, read from the public API (api/issues/search, api/hotspots/search),
# never typed. `plan` matches an entry by its key, project, rule and file and
# refuses if one no longer matches (a substantive code change gives the finding
# a new key, so it is re-reviewed, not silently marked); a finding whose line
# only moved is reported, and `sonar_triage.py refresh` rewrites its `line`
# from the API for a PR (#487).
#
# To record a new false positive: review it in its tracking issue, list the
# open findings (`sonar_triage.py findings --repos <repo>`), print the entry
# (`sonar_triage.py entry <KEY> --reason <id>`, every field from the API), add
# it here by PR, merge, then dispatch sonar-triage with mode plan, then apply.
#
# decision: falsepositive (the finding is wrong) or wontfix (true as stated,
# accepted for the reason given; SonarQube Cloud may call it `accept`).

[reasons]
FP-cli = "The value is an argument the invoker passes to a command-line tool they run themselves, on their own machine or as a literal in a workflow file; the script runs with the invoker's own rights, so the path, git ref or URL it names reaches nothing the invoker could not reach directly. No trust boundary is crossed, and where the tool's job is to read the named path or fetch the named URL, confining it would break the tool."
FP-repofile = "The content comes from a committed, reviewed file of the same repository, the same trust as the script; a PR that could plant a bad value could change the script."
FP-redos = "The regex is a pattern from the repository's own schemas/manifest.schema.json; every pattern there is anchored with no nested quantifier (worst case quadratic on a short manifest field), and the strings matched are fields of the PR's own run."
FP-basename = "The manifest's source.path is reduced to os.path.basename and joined to the cell's own directory, which must then hold exactly manifest.json and that file; it cannot name a path outside the run."
FP-validated = "Every path component is checked before use: the plan name by NAME (^[a-z0-9]([a-z0-9-]*[a-z0-9])?$), each cell by CELL (^[a-z0-9][a-z0-9._-]*$, no slash); the date is the tool's own state.json and the run id an integer from the GitHub API."
FP-walk = "The file names come from os.walk over the output directory itself."
FP-gitpaths = "The paths are git diff --name-only / ls-files output of the bot's own temporary clone (always relative, inside the work tree) and os.path.join(clone, <constant>)."
FP-argv = "subprocess.run with an argument list, no shell; the values are repository names from the org listing and the bot's own constants."
FP-guarded = "The test server resolves the request under the absolute site root and refuses anything not startsWith(root + sep) before any fs call, and listens on 127.0.0.1 only; the scanner does not recognise the guard."
FP-hash = "pip install --require-hashes pins every distribution by hash; --only-binary :all: would break the build (paginate==0.5.7 in the mkdocs lock is sdist-only)."
FP-local = "pip install ./python builds this repository's own package from the checkout; its build backend is this repository's reviewed code."
FP-curl = "curl ... | python3 -c '<inline code>' pipes a registry token response as data into inline code; nothing downloaded is executed."
FP-literal = "what is a string literal at every TakeStreams(...) call site (\"wifi channel\", \"mobility\", ...)."
FP-image = "image passed IMAGE_RE (ghcr.io/...@sha256:<64 hex>) before registry_config is reached, and the token request is anonymous."
FP-display = "dispatch_command only builds the command line recorded in the manifest (with shlex.quote); it is never executed."
FP-chmod = "0o755 on the generated kit's .sh scripts, which the kit's reader runs; the kit holds no secret."
FP-root = "ns3-dev is a build image run as a GitHub Actions container:, whose workspace mounts and actions need root; it runs no service."
FP-float = "An exact test for zero of a counter parsed from the harness's text, where zero is printed exactly ('nothing happened'); a tolerance would change verdicts, and scenario_check's verdicts must stay byte-identical to AntHocNet's script (test_scenario_check_corpus.py)."
WF-fixture = "A deliberate defect in a test fixture whose job is to carry it: reusable-go-ci.yml's failing fixture (tools/checks/fixtures/go-ci/bad) must have one go vet, one staticcheck, one gofmt and one test finding, and go-ci-selftest.yml fails if any of them goes away. The code is never built into anything shipped."
FP-stub = "The file written is one of ns-3's one-line include stubs in the tool's own temporary copy of the headers of the ns3-dev image the invoker named (IMAGE-checked); a stub is skipped if it is a symlink or resolves outside that copy, and its own text is written back with the /opt/ns-3/ prefix pointed at the copy. Nothing read from the file chooses which file is written."

